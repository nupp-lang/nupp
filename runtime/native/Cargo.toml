[package]
name = "nupp-native"
version = "0.1.0"
edition = "2021"
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[features]
default = []
files = []
http = [
    "dep:bytes",
    "dep:url",
    "dep:reqwest",
    "dep:rustls",
    "dep:tokio",
    "dep:tokio-stream",
    "dep:tokio-util",
    "uri",
]
process = []
path = []
uri = []
uuid = []
sha256 = []

[dependencies]
bytes = { version = "1", optional = true }
reqwest = { version = "0.13.4", default-features = false, features = ["deflate", "gzip", "rustls-no-provider", "socks", "stream"], optional = true }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"], optional = true }
tokio = { version = "1", features = ["fs", "io-util", "net", "rt-multi-thread", "sync", "time"], optional = true }
tokio-stream = { version = "0.1", optional = true }
tokio-util = { version = "0.7", features = ["io", "rt"], optional = true }
url = { version = "2.5", optional = true }

[build-dependencies]
# The ported half of the provider is C, compiled into this library until the
# Rust half is gone and the crate with it.
cc = "1"

[target.'cfg(unix)'.dependencies]
libc = { version = "0.2", optional = true }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", optional = true, features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_Storage_FileSystem",
    "Win32_System_Console",
    "Win32_System_IO",
    "Win32_System_Pipes",
    "Win32_System_Threading",
] }
