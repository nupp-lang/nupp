[package]
name = "nupp-native"
version = "0.1.0"
edition = "2021"
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[features]
default = []
files = []
http = []
process = []
path = []
uri = []
uuid = []
sha256 = []

[build-dependencies]
# The ported half of the provider is C, compiled into this library until the
# Rust half is gone and the crate with it.
cc = "1"
