[package]
name = "nupp-native"
version = "0.1.0"
edition = "2021"
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[features]
default = []
path = ["dep:camino", "dep:path-clean", "dep:pathdiff"]
uri = ["dep:url"]
uuid = ["dep:uuid"]
sha256 = ["dep:sha2"]

[dependencies]
camino = { version = "1.1", optional = true }
path-clean = { version = "1.0", optional = true }
pathdiff = { version = "0.2", features = ["camino"], optional = true }
sha2 = { version = "0.10", optional = true }
url = { version = "2.5", optional = true }
uuid = { version = "1.10", features = ["v4", "v7"], optional = true }
