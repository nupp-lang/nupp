# OpenSSL's configuration target for Windows ARM64 with LLVM MinGW, which
# upstream lacks: its ARM64 Windows targets are MSVC's. This is upstream's
# mingw64 for ARM64. openssl.sh passes it with --config and builds no-asm.
# Its name starts with mingw, as upstream's build files require of a target
# whose shared libraries are DLLs with import libraries.
my %targets = (
    "mingwarm64" => {
        inherit_from     => [ "mingw-common" ],
        CC               => "clang",
        sys_id           => "MINGWARM64",
        bn_ops           => add("SIXTY_FOUR_BIT"),
        asm_arch         => undef,
        uplink_arch      => undef,
        shared_ldflag    => "",
        shared_rcflag    => "",
        multilib         => "-arm64",
    },
);
