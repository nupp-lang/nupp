edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[lib]
path = "src/lib.rs"

[features]
default = []
uuid = ["dep:getrandom", "dep:uuid"]

[dependencies]
getrandom = { version = "0.4", optional = true }
uuid = { version = "1", optional = true }
