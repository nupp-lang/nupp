[package]
name = "nupp-vm"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

# The Nupp runtime of the runtime plan: NaN-boxed values, a variable-size
# non-moving heap with an incremental collector, one-stack frames, the
# interpreter, the image loader and verifier, and the host services on the
# parking surface, with optional Cranelift code generation (P5).

build = "build.rs"

[lib]
path = "src/lib.rs"

[[bin]]
name = "nupp-vm"
path = "src/main.rs"

[features]
default = ["jit", "c-headers", "native-ffi", "compression", "net", "http", "regex", "markdown"]
# The native facilities a program may reach. A program binary's runtime links
# the ones its program does; the compiler's links all of them.
compression = ["dep:nupp-native-compression"]
net = ["dep:nupp-native-net", "dep:nupp-native-tls", "dep:ring"]
http = ["dep:nupp-native-http", "dep:url"]
regex = ["dep:regex"]
markdown = ["dep:pulldown-cmark"]
# Optional in-process C declaration inspection for compiler hosts.
c-headers = ["dep:libloading", "dep:serde_json"]
# Dynamic native C calls and callback trampolines.
native-ffi = ["dep:libffi", "dep:libloading"]
# The typed tier: Cranelift lowering of the bytecode (P5). Off, the crate is
# the interpreter alone, which is what the browser build and a bootstrap
# without Cranelift need.
compiled-runtime = []
jit = ["compiled-runtime", "dep:cranelift-codegen", "dep:cranelift-frontend", "dep:cranelift-jit", "dep:cranelift-module", "dep:cranelift-native"]
aot = ["jit", "aot-linked", "dep:cranelift-object"]
# Run prebuilt native objects without shipping any code generator.
aot-linked = ["compiled-runtime"]
# Count executed opcodes by name (OP_STATS=1 at run time); off by default
# because the check costs the dispatch loop a branch per opcode.
opstats = []
# Executables choose their allocator; the embedding library never declares one.
allocator-mimalloc = ["dep:mimalloc"]
allocator-jemalloc = ["dep:tikv-jemallocator"]
allocation-metrics = ["dep:serde_json"]

[dependencies]
libloading = { version = "0.8.9", optional = true }
serde_json = { version = "1", optional = true }
nupp-native-platform = { path = "../platform", features = ["uuid"] }
nupp-native-checksum = { path = "../checksum" }
nupp-native-files = { path = "../files" }
nupp-native-compression = { path = "../compression", optional = true }
nupp-native-net = { path = "../net", optional = true }
nupp-native-tls = { path = "../tls", optional = true }
nupp-native-http = { path = "../http", optional = true }
nupp-native-abi = { path = "../abi" }
nupp-extension = { path = "../extension" }
url = { version = "2.5", optional = true }
nupp-native-process = { path = "../process" }
cranelift-codegen = { version = "0.135", optional = true }
cranelift-frontend = { version = "0.135", optional = true }
cranelift-jit = { version = "0.135", optional = true }
cranelift-module = { version = "0.135", optional = true }
cranelift-native = { version = "0.135", optional = true }
cranelift-object = { version = "0.135", optional = true }
sha2 = "0.10"
crc32fast = "1.5"
# `nupp.text.regex`: matching beyond Lua patterns (`src/nregex.rs`).
regex = { version = "1.13", optional = true }
# `nupp doc`: CommonMark with tables rendered to HTML (`src/nmarkdown.rs`).
# Added 2026-10-16 at 0.13.4 to replace lunamark, which needed LPeg; only the
# HTML writer is enabled, not the command-line tool's getopts.
pulldown-cmark = { version = "0.13.4", optional = true, default-features = false, features = ["html"] }
libc = "0.2"

# Initial experiment targets. Other targets retain the default allocator.
# Disable native malloc interposition and jemalloc background threads.
[target.'cfg(all(any(target_arch = "aarch64", target_arch = "x86_64"), any(target_os = "macos", all(target_os = "linux", target_env = "gnu"))))'.dependencies]
mimalloc = { version = "0.1.52", optional = true, default-features = false }
tikv-jemallocator = { version = "0.7.0", optional = true, default-features = false }

# Full ARM64 runtimes already link ring through TLS. Minimal/no-net runtimes
# and other architectures keep the existing sha2 implementation.
[target.'cfg(all(target_arch = "aarch64", target_endian = "little"))'.dependencies]
ring = { version = "0.17.14", optional = true, default-features = false }

[target.'cfg(not(target_family = "wasm"))'.dependencies]
libffi = { version = "5.1.1", optional = true }

[dev-dependencies]
nupp-counter-extension = { path = "../counter-extension" }

[build-dependencies]
cc = "1"

[lints.rust]
unsafe_op_in_unsafe_fn = "allow"
