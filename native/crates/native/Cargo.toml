[package]
name = "nupp-native"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[lib]
name = "nupp_native"
path = "src/lib.rs"
crate-type = ["rlib", "cdylib", "staticlib"]

[features]
default = ["base"]
base = []
uuid = ["nupp-native-platform/uuid"]
gpu = ["base", "dep:nupp-native-gpu"]
uri = ["base", "dep:url"]
http = ["base", "dep:nupp-native-http"]
process = ["base", "dep:nupp-native-process"]
net = ["base", "dep:nupp-native-net"]
tls = ["net", "dep:nupp-native-tls"]
filesystem = ["base", "dep:nupp-native-files"]
files = ["filesystem", "nupp-native-files/lane"]
compression = ["base", "dep:nupp-native-compression"]
# The AOT code generator: LLVM and lld, linked in (NUPP_LLVM_PREFIX).
codegen = ["base", "aotrt", "dep:nupp-native-codegen", "nupp-native-codegen/llvm"]
# The runtime LLVM-compiled Lua-builder entries call (c/ks_rt.c).
aotrt = ["base"]

[dependencies]
nupp-native-abi = { path = "../abi" }
nupp-native-gpu = { path = "../gpu", optional = true }
nupp-native-http = { path = "../http", optional = true }
nupp-native-net = { path = "../net", optional = true }
nupp-native-tls = { path = "../tls", optional = true }
nupp-native-files = { path = "../files", optional = true, default-features = false }
nupp-native-platform = { path = "../platform" }
nupp-native-process = { path = "../process", optional = true }
nupp-native-runtime = { path = "../runtime" }
nupp-native-compression = { path = "../compression", optional = true }
nupp-native-codegen = { path = "../codegen", optional = true }
url = { version = "2.5.7", optional = true }

[build-dependencies]
cc = "1"
