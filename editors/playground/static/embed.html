<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Nupp Playground (embed)</title>
<meta name="description" content="Embeddable Nupp editor — checks with the real compiler as you type.">
<link rel="icon" href="./nupp.svg" type="image/svg+xml">
<link rel="stylesheet" href="./style.css">
</head>
<body class="is-busy is-embed">
<div class="embed-toolbar">
  <label class="example-picker">
    <span>Example</span>
    <!-- Options come from src/examples.js, the same list index.html builds
         its menu from. -->
    <select id="example-select" class="select"></select>
  </label>
</div>
<div id="source-editor" class="editor-host"></div>
<div id="status" class="embed-status">starting…</div>
<script type="module" src="./app.js"></script>
</body>
</html>
