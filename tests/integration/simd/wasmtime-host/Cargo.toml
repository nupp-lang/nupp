[package]
name = "nupp-simd-wasmtime-host"
version = "0.1.0"
edition = "2024"
publish = false

[lib]
crate-type = ["cdylib"]

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
wasmtime = { version = "48", default-features = false, features = ["anyhow", "cranelift", "runtime", "std"] }

[workspace]

[profile.release]
panic = "unwind"
strip = false
