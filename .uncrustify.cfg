# The blank lines clang-format cannot place. scripts/format-c runs clang-format,
# then Uncrustify, then clang-format again to restore the layout.
#
# A blank line goes before and after each if, for, while, switch and do
# statement, and before each return that follows other statements, except where
# the statement opens or closes its block. `else` stays on the line after the
# closing brace it follows.

# Uncrustify indents as it goes; match clang-format so the pass after this one
# has little to undo.
indent_columns = 2
indent_with_tabs = 0

nl_before_if = add
nl_after_if = add
nl_before_for = add
nl_after_for = add
nl_before_while = add
nl_after_while = add
nl_before_switch = add
nl_after_switch = add
nl_before_do = add
nl_after_do = add
nl_before_return = true

# Separate leading comments from preceding code. Two newlines leave one blank line.
nl_before_c_comment = 2
nl_before_block_comment = 2
nl_before_cpp_comment = 2
