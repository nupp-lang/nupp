name: Compiler matrix

on:
  # Every branch, and the trunk above all.
  #
  # This was briefly `branches-ignore: main`, which was right only while a
  # ruleset stood in front of the trunk: a check run belongs to a commit rather
  # than to a branch, so the branch run was the one the trunk push presented,
  # and running the same matrix again over the same commit object bought
  # nothing. There is no ruleset now. Nothing else asks a question about a
  # commit pushed straight to `main`, so if this does not, nothing does.
  #
  # Worktree branches are here too, so a task can find out before it lands
  # rather than after.
  push:
    branches:
      - "**"
    # A pre-release tag (`v0.0.15-vm.1`) names a commit its branch push already
    # tested; running the matrix again over the same commit buys nothing.
    tags:
      - "*"
      - "!v*-*"
  # Retained for a contribution from a fork, where no push to this repository
  # happens and this is the only event there is. A pull request from a branch of
  # this repository is the same commit its push already started a run for, so
  # `classify` declines that event and every job behind it is skipped: running
  # both doubled the queue for one answer, and the two runs could not even
  # share a cache, since a pull request's merge ref is a cache scope of its own.
  pull_request:
  workflow_dispatch:
    inputs:
      macos:
        description: Run the full macOS lanes, not only its gates and native core
        type: boolean
        default: false
  # The affected-surface classifier is deliberately conservative, but it is a
  # judgement all the same. Run the whole matrix nightly whatever changed, so a
  # gap in the classification is found by this backstop rather than by a user.
  # A failure here is a bug and blocks the next release; it is not a warning.
  schedule:
    - cron: "0 7 * * *"

permissions:
  contents: read

# Grouped per ref, so a newer push to the same ref cancels the older run.
#
# This was briefly grouped per commit, to keep a result against every commit in
# the trunk's history rather than only against the tip. It cost more than it
# bought: a per-commit group is a group of one, so nothing ever supersedes
# anything, and the macOS leg takes an hour and a half against commits that land
# every few minutes. The queue grows without bound, and the answer a run finally
# gives is about a commit twenty commits behind the tip -- which leaves the tip,
# the one commit anybody is going to act on, the last thing to be tested.
#
# What is given up is the ability to say "this commit was green and the next one
# was red" directly. A cancelled run means a later run covers both commits, so a
# failure there is bisected rather than read off. That is the cheaper half of the
# trade, because the trunk is fixed forward: what matters is that the tip is
# tested promptly, and under the per-commit shape it never was.
#
# A worktree branch loses nothing by this. The old shape kept its run alive on
# the grounds that it is the only thing standing between that commit and the
# trunk, but a second push to the same branch has already replaced the commit
# that run was answering about; the branch's tip is the only answer its task
# wants, and that is the run that survives.
#
# The event name is in the key so a push cannot cancel the nightly backstop
# declared above: a scheduled run's `github.ref` is `refs/heads/main` too.
#
# A trunk push lets the run in progress finish. When several agents land on
# one trunk minutes apart, cancelling in progress meant no run ever finished
# and the trunk had no answer at all. Without it a group still holds at most
# one pending run, and a newer push replaces that one, so the queue stays
# bounded: one run finishing, and the tip waiting behind it.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ !(github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == format('refs/heads/{0}', github.event.repository.default_branch))) }}

# The VM compiler bootstraps the tree, built from the pinned stage-zero image
# when no restored one is current, and runs everything. It runs interpreted:
# a check of one compiler module and what it imports took 37.7 s with the
# compiled code linked in and 40.1 s without, and the link costs a runner
# longer than that seven percent returns.
env:
  NUPP_VM_AUTO_LINK: "0"

jobs:
  # Everything a run can decide before it provisions anything. This is the job
  # that must stay cheap: every other job waits on it, so a minute here is a
  # minute added to every path through the graph.
  classify:
    name: Classify the change
    # A pull request from a branch of this repository repeats its push.
    if: >-
      github.event_name != 'pull_request'
      || github.event.pull_request.head.repo.full_name != github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    # The trunk's last green run is only on the API.
    permissions:
      contents: read
      actions: read
    outputs:
      docs-site: ${{ steps.classify.outputs.docs-site }}
      fast-checks: ${{ steps.classify.outputs.fast-checks }}
      linux-integration: ${{ steps.classify.outputs.linux-integration }}
      macos-integration: ${{ steps.classify.outputs.macos-integration }}
      windows-integration: ${{ steps.classify.outputs.windows-integration }}
      gpu-linux: ${{ steps.classify.outputs.gpu-linux }}
      gpu-windows: ${{ steps.classify.outputs.gpu-windows }}
      fixpoint: ${{ steps.classify.outputs.fixpoint }}
      proofs: ${{ steps.classify.outputs.proofs }}
      linux-legs: ${{ steps.matrix.outputs.linux-legs }}
      macos-legs: ${{ steps.matrix.outputs.macos-legs }}
      windows-legs: ${{ steps.matrix.outputs.windows-legs }}
      build-linux: ${{ steps.matrix.outputs.build-linux }}
      build-macos: ${{ steps.matrix.outputs.build-macos }}
      build-windows: ${{ steps.matrix.outputs.build-windows }}
      selection: ${{ steps.classify.outputs.selection }}
    steps:
      - name: Check out the repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Restore the provisioned toolchain
        uses: actions/cache/restore@v4
        with:
          path: .nupp-cache/toolchain
          key: >-
            nupp-toolchain-${{ runner.os }}-${{ runner.arch }}-${{
            hashFiles('scripts/toolchain.pins', 'scripts/toolchain') }}
          restore-keys: |
            nupp-toolchain-${{ runner.os }}-${{ runner.arch }}-

      # The classifier is plain Lua so that the suite can assert on it. This is
      # the only thing this job provisions, and on a cache hit it is a second.
      - name: Provide a Lua interpreter
        run: echo "$(./scripts/toolchain luajit)/bin" >> "$GITHUB_PATH"

      - name: Name the changed paths
        id: changed
        env:
          EVENT: ${{ github.event_name }}
          REF: ${{ github.ref }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PUSH_BEFORE: ${{ github.event.before }}
          HEAD_SHA: ${{ github.sha }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          usable() {
            [ -n "$1" ] \
              && [ "$1" != "0000000000000000000000000000000000000000" ] \
              && git cat-file -e "$1^{commit}" 2>/dev/null
          }

          # The trunks are the default branch and `main`: where work lands, and
          # so what a branch is measured against.
          trunk=false
          case "$REF" in
            refs/heads/main|"refs/heads/$DEFAULT_BRANCH") trunk=true ;;
          esac

          base=""
          if [ "$EVENT" = pull_request ]; then
            base=$PR_BASE
          elif [ "$EVENT" = push ] && [ "$trunk" = true ]; then
            # A trunk is compared against the last commit of its own that a
            # run of this workflow passed.
            #
            # `before` is the tempting answer and it is wrong twice. A newer
            # push cancels the run of the one before it, so a compiler change
            # followed a minute later by a documentation change would be
            # answered by a run that looked only at documentation; and a run
            # that fails leaves a `before` whose failure the next narrow run
            # never looks at again. Against the last green commit neither can
            # happen: everything since then is in the diff until a run passes
            # with it there. While the trunk is red that is a wide diff, which
            # is what a red trunk should cost.
            for sha in $(gh api \
                "repos/$GITHUB_REPOSITORY/actions/workflows/compiler.yml/runs?branch=${REF#refs/heads/}&event=push&status=success&per_page=30" \
                --jq '.workflow_runs[].head_sha' 2>/dev/null || true); do
              if usable "$sha" && git merge-base --is-ancestor "$sha" "$HEAD_SHA"; then
                base=$sha
                break
              fi
            done
          elif [ "$EVENT" = push ]; then
            # A branch is compared against the trunk it will become, never
            # against its own previous tip.
            #
            # What this run authorises is pushing `HEAD_SHA` to a trunk, so the
            # question is what this commit changes about that trunk -- not what
            # its last commit changed about the one before it. Narrowing
            # against `before` opens a real hole: a commit that fails the GPU
            # job, then a commit touching only documentation, and the second
            # run skips GPU, goes green, and carries the first one's failure
            # onto the trunk. Comparing against the merge base costs the same
            # and cannot do that.
            #
            # It is also the honest answer for the case that happens most here:
            # a task worktree pushed once when its work is done, whose `before`
            # is all zeros because the branch is new.
            #
            # Which trunk is not said anywhere, so it is the one this branch
            # left most recently. Measuring every branch against `main` made
            # each branch of another trunk a change to everything.
            distance=""
            for name in "$DEFAULT_BRANCH" main; do
              git fetch --no-tags origin "$name" 2>/dev/null || continue
              candidate=$(git merge-base FETCH_HEAD "$HEAD_SHA" 2>/dev/null || true)
              usable "$candidate" || continue
              ahead=$(git rev-list --count "$candidate..$HEAD_SHA")
              if [ -z "$distance" ] || [ "$ahead" -lt "$distance" ]; then
                base=$candidate
                distance=$ahead
              fi
            done
            # A branch with no common history with a trunk has no merge base,
            # and `before` is then better than nothing.
            if ! usable "$base"; then
              base=$PUSH_BEFORE
            fi
          fi

          # A tag, a schedule and a manual dispatch have no diff to narrow, and
          # neither does a branch whose merge base could not be found or a
          # trunk no run has passed on. An empty list means "everything",
          # which the classifier decides rather than this shell.
          if usable "$base"; then
            echo "comparing against $base"
            git diff --name-only --no-renames "$base" "$HEAD_SHA" > changed-paths.txt
          else
            : > changed-paths.txt
          fi
          echo "--- changed paths ---"
          cat changed-paths.txt

      # C is checked only when something that decides its formatting or its
      # lint changed: a C source or header, its CMake, the tools'
      # configuration, their pins or the scripts that run them. An empty list
      # is "everything", as it is for the classifier, so a run with no diff
      # still checks.
      - name: Name the C changes
        id: c-changed
        run: |
          if [ ! -s changed-paths.txt ] || grep -Eq \
              '\.(c|h|cmake)$|(^|/)CMakeLists\.txt$|^\.(clang-format|clang-tidy|uncrustify\.cfg|gersemirc)$|^scripts/(format-c|lint-c)$|^scripts/toolchain(\.pins)?$' \
              changed-paths.txt; then
            echo "check=true" >> "$GITHUB_OUTPUT"
          else
            echo "check=false" >> "$GITHUB_OUTPUT"
          fi

      # Uncrustify is cached by its pin alone, as scripts/toolchain keys it, so
      # a change to the toolchain rules does not build it again.
      - name: Cache Uncrustify
        if: steps.c-changed.outputs.check == 'true'
        uses: actions/cache@v4
        with:
          path: .nupp-cache/toolchain/uncrustify
          key: >-
            nupp-uncrustify-${{ runner.os }}-${{ runner.arch }}-${{
            hashFiles('scripts/toolchain.pins') }}

      - name: Check C formatting
        if: steps.c-changed.outputs.check == 'true'
        run: ./scripts/format-c --check

      # The upstream headers the lint compiles against, unpacked and
      # configured once per pin (scripts/lint-c).
      - name: Cache the C lint's headers
        if: steps.c-changed.outputs.check == 'true'
        uses: actions/cache@v4
        with:
          path: build/c-lint/sources
          key: >-
            nupp-c-lint-${{ runner.os }}-${{ runner.arch }}-${{
            hashFiles('scripts/toolchain.pins', 'scripts/lint-c') }}

      - name: Lint C
        if: steps.c-changed.outputs.check == 'true'
        run: ./scripts/lint-c

      - name: Classify the affected surfaces
        id: classify
        # With the NUPP_LINUX_ONLY variable 'true', every run but the nightly
        # one leaves out macOS and Windows. Unset, every platform runs.
        env:
          NUPP_CI_LINUX_ONLY: >-
            ${{ vars.NUPP_LINUX_ONLY == 'true'
            && github.event_name != 'schedule' }}
          # A push leaves macOS out unless its commit asks for it, and so does a
          # pull request without `ci:macos`. The change was already tested on a
          # Mac before it was pushed (AGENTS.md, Verification); the nightly run
          # is the macOS backstop.
          NUPP_CI_NO_MACOS: >-
            ${{ (github.event_name == 'push'
            && !contains(github.event.head_commit.message, '[ci macos]'))
            || (github.event_name == 'pull_request'
            && !contains(github.event.pull_request.labels.*.name, 'ci:macos')) }}
        run: luajit .github/scripts/classify-changes.lua < changed-paths.txt

      # The classifier and the workflow have to agree about which jobs exist.
      # They are two files, so the only thing that keeps them agreeing is this
      # check, which runs before anything expensive is provisioned.
      - name: Validate selected-job aggregation
        run: python3 .github/scripts/test-required-ci.py

      - name: Validate the workflow against the classifier
        run: luajit .github/scripts/validate-ci-coverage.lua

      # Each platform's legs as data, and which platforms need a compiler built.
      - name: Compose the integration matrices
        id: matrix
        env:
          SELECTED_LINUX: ${{ steps.classify.outputs.linux-integration }}
          SELECTED_MACOS: ${{ steps.classify.outputs.macos-integration }}
          SELECTED_WINDOWS: ${{ steps.classify.outputs.windows-integration }}
          # The full macOS lanes: nightly, a dispatch asking for them, a pushed
          # commit saying `[ci macos]`, or a pull request labeled `ci:macos`.
          MACOS_FULL: >-
            ${{ github.event_name == 'schedule'
            || (github.event_name == 'workflow_dispatch' && inputs.macos)
            || contains(github.event.head_commit.message, '[ci macos]')
            || contains(github.event.pull_request.labels.*.name, 'ci:macos') }}
          # The core's regression legs: a change the classifier gives the
          # `core` surface, or one whose reach it cannot narrow.
          SELECTED_CORE: >-
            ${{ contains(steps.classify.outputs.selection, '"core"')
            || contains(steps.classify.outputs.selection, '"everything"')
            || contains(steps.classify.outputs.selection, '"unclassified"') }}
          SELECTED_LINUX_COMPILER: >-
            ${{ steps.classify.outputs.fast-checks == 'true'
            || steps.classify.outputs.docs-site == 'true'
            || steps.classify.outputs.fixpoint == 'true' }}
        run: luajit .github/scripts/compose-integration-matrix.lua

      # Only on a cold cache, where this job has just built LuaJIT from source
      # and every job behind it is about to do the same. A build job saves the
      # same key, so whichever arrives second warns and keeps the first entry.
      - name: Save the provisioned toolchain
        if: always()
        uses: actions/cache/save@v4
        continue-on-error: true
        with:
          path: .nupp-cache/toolchain
          key: >-
            nupp-toolchain-${{ runner.os }}-${{ runner.arch }}-${{
            hashFiles('scripts/toolchain.pins', 'scripts/toolchain') }}

  # The compiler for these sources, once per platform. Every job below runs
  # it, and each used to rebuild it for itself: on a compiler change that was
  # the same six minutes of lowering in every job at once. This job is the one
  # that pays; the rest restore what it saves (`.github/actions/prepare`).
  #
  # Every Linux job that runs the compiler runs on ARM64. The native core that
  # replaces the Rust VM encodes ARM64 and nothing else yet, so the Linux legs
  # moved while the VM still ran there, and the flip is a runtime switch rather
  # than a new runner and a new runtime at once. Linux x64 users stay on the
  # last release before the flip until an x86 encoder exists. The classifier
  # and `required-ci`, which run no compiler, stay where they were.
  build-linux:
    name: Build the compiler / Linux arm64
    needs: classify
    if: needs.classify.outputs.build-linux == 'true'
    runs-on: ubuntu-24.04-arm
    # A cold start lowers the compiler twice from the pinned stage zero.
    timeout-minutes: 75
    steps:
      - name: Check out the repository
        uses: actions/checkout@v5

      - name: Build the compiler
        uses: ./.github/actions/prepare
        with:
          save: "true"

  build-macos:
    name: Build the compiler / macOS arm64
    needs: classify
    if: needs.classify.outputs.build-macos == 'true'
    runs-on: macos-15
    timeout-minutes: 75
    steps:
      - name: Check out the repository
        uses: actions/checkout@v5

      - name: Build the compiler
        uses: ./.github/actions/prepare
        with:
          save: "true"

  build-windows:
    name: Build the compiler / Windows x64
    needs: classify
    if: needs.classify.outputs.build-windows == 'true'
    runs-on: windows-2022
    timeout-minutes: 90
    steps:
      - name: Check out the repository
        uses: actions/checkout@v5

      - name: Build the compiler
        uses: ./.github/actions/prepare
        with:
          save: "true"

  # The test runner for these sources, once per platform, for the reason the
  # compiler is built once: every leg runs it, and building it is twenty-five
  # minutes and most of a runner's memory (`.github/actions/test-runner`). It
  # is a job of its own rather than the tail of the build so that what needs
  # only the compiler -- the fast checks, the documentation, the fixpoint --
  # does not wait for it.
  runner-linux:
    name: Build the test runner / Linux arm64
    needs: [classify, build-linux]
    if: needs.classify.outputs.linux-integration == 'true'
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 75
    steps:
      - name: Check out the repository
        uses: actions/checkout@v5

      - name: Prepare the compiler
        uses: ./.github/actions/prepare

      # The newest suite timings any leg of this platform saved, carried in
      # the runner's cache so every leg deals its shards from the same record
      # (`.github/scripts/run-suite-shard.sh`). Never an exact match: the key
      # only names this run.
      - name: Restore the recorded suite timings
        uses: actions/cache/restore@v4
        with:
          path: build/test-runner/.nupp-test-times.json
          key: nupp-test-times-${{ runner.os }}-runner-${{ github.sha }}
          restore-keys: |
            nupp-test-times-${{ runner.os }}-

      - name: Build the test runner
        uses: ./.github/actions/test-runner
        with:
          save: "true"

  runner-macos:
    name: Build the test runner / macOS arm64
    needs: [classify, build-macos]
    if: needs.classify.outputs.macos-integration == 'true'
    runs-on: macos-15
    timeout-minutes: 120
    steps:
      - name: Check out the repository
        uses: actions/checkout@v5

      - name: Prepare the compiler
        uses: ./.github/actions/prepare

      # The newest suite timings any leg of this platform saved, carried in
      # the runner's cache so every leg deals its shards from the same record
      # (`.github/scripts/run-suite-shard.sh`). Never an exact match: the key
      # only names this run.
      - name: Restore the recorded suite timings
        uses: actions/cache/restore@v4
        with:
          path: build/test-runner/.nupp-test-times.json
          key: nupp-test-times-${{ runner.os }}-runner-${{ github.sha }}
          restore-keys: |
            nupp-test-times-${{ runner.os }}-

      - name: Build the test runner
        uses: ./.github/actions/test-runner
        with:
          save: "true"

  runner-windows:
    name: Build the test runner / Windows x64
    needs: [classify, build-windows]
    if: needs.classify.outputs.windows-integration == 'true'
    runs-on: windows-2022
    timeout-minutes: 120
    steps:
      - name: Check out the repository
        uses: actions/checkout@v5

      - name: Prepare the compiler
        uses: ./.github/actions/prepare

      # The newest suite timings any leg of this platform saved, carried in
      # the runner's cache so every leg deals its shards from the same record
      # (`.github/scripts/run-suite-shard.sh`). Never an exact match: the key
      # only names this run.
      - name: Restore the recorded suite timings
        uses: actions/cache/restore@v4
        with:
          path: build/test-runner/.nupp-test-times.json
          key: nupp-test-times-${{ runner.os }}-runner-${{ github.sha }}
          restore-keys: |
            nupp-test-times-${{ runner.os }}-

      - name: Build the test runner
        uses: ./.github/actions/test-runner
        with:
          save: "true"

  # Formatting and the checker: what a change can get wrong without running.
  # The suites that used to follow them here are legs of the Linux platform
  # now, beside this job rather than behind it.
  fast-checks:
    name: Fast checks
    needs: [classify, build-linux]
    if: needs.classify.outputs.fast-checks == 'true'
    runs-on: ubuntu-24.04-arm
    # Formatting the tree takes twenty minutes when a formatter or parser change
    # has emptied the format cache, and the check four.
    timeout-minutes: 60
    steps:
      - name: Check out the repository
        uses: actions/checkout@v5

      - name: Prepare the compiler
        uses: ./.github/actions/prepare

      - name: Restore the content-validated compiler cache
        uses: actions/cache/restore@v4
        with:
          path: build/cache
          key: >-
            nupp-buildcache-${{ runner.os }}-${{ runner.arch }}-${{
            hashFiles('src/**', 'nupp.lua', 'scripts/toolchain.pins') }}
          restore-keys: |
            nupp-buildcache-${{ runner.os }}-${{ runner.arch }}-

      # The pre-push hook asks the same question of the files a push changes.
      # Ask it of the whole tree here, because a rewrite landed by a `--no-verify`
      # push is otherwise found by whichever unrelated change comes next.
      - name: Check the formatting
        run: |
          ./bin/nupp fmt --write
          if ! git diff --quiet; then
            echo "nupp fmt --write rewrote committed source:"
            git --no-pager diff --stat
            git --no-pager diff
            exit 1
          fi

      # Import spelling is the `inline-module-path` lint's question rather than
      # the formatter's, so the tree is held to it here.
      - name: Check the compiler
        run: ./bin/nupp check --deny inline-module-path

      # Saved whatever the two steps above concluded. The entries validate
      # their own content, so a stale one is a miss and cannot change an
      # answer, and a run that fails the check still keeps what the next run
      # would otherwise redo.
      - name: Save the content-validated compiler cache
        if: always()
        uses: actions/cache/save@v4
        continue-on-error: true
        with:
          path: build/cache
          key: >-
            nupp-buildcache-${{ runner.os }}-${{ runner.arch }}-${{
            hashFiles('src/**', 'nupp.lua', 'scripts/toolchain.pins') }}

  # One leg of one platform: its native gates, or a shard of one of its lanes
  # (`.github/scripts/compose-integration-matrix.lua` is the list). A leg
  # waits only on its own platform's test runner, so nothing here is behind
  # the fast checks, and no platform is behind another -- which is why there
  # are three jobs. They share one list of steps: the two below alias this
  # one's.
  integration-linux:
    name: ${{ matrix.name }}
    needs: [classify, runner-linux]
    if: needs.classify.outputs.linux-integration == 'true'
    runs-on: ubuntu-24.04-arm
    # A timeout is here to end a hang, so it has to sit above the work rather
    # than across it. A killed job also skips its post steps.
    timeout-minutes: ${{ matrix.timeout }}
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.classify.outputs.linux-legs) }}
    steps: &leg-steps
      - name: Check out the repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      # uritest holds the portable URL parser to node's `URL` as the browser
      # oracle, so node has to follow the current WHATWG standard. The image's
      # node 22 predates fixes the parser already has: a trailing `..` under a
      # non-special host, and a relative reference against an opaque path.
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 26

      # This is a parser/checker oracle, not a build dependency. Pinning the
      # source keeps a language change from being conflated with an upstream
      # corpus change, and sparse checkout avoids fetching the rest of Teal.
      - name: Check out the Teal 0.8.0 tl.lua oracle
        if: matrix.kind == 'gates'
        uses: actions/checkout@v5
        with:
          repository: teal-language/tl
          ref: 8ea89e75751e6cea0547f3838e0e244497d88bd6
          path: .ci-corpus/teal
          sparse-checkout: tl.lua
          sparse-checkout-cone-mode: false

      - name: Prepare the compiler
        uses: ./.github/actions/prepare

      - name: Restore the test runner
        uses: ./.github/actions/test-runner

      # Where a dying Windows worker leaves what it was holding: the library
      # each native case built and its phase trace. Both are written by the
      # suite itself, which is why they arrive at all -- four rounds of Windows
      # crashes were diagnosed out of these and none out of a minidump. The test
      # shells are named by the test-runner action, which needs them first.
      - name: Name the Windows test shells
        if: runner.os == 'Windows'
        shell: bash
        run: |
          set -euo pipefail
          dumps="$RUNNER_TEMP/nupp-worker-dumps"
          mkdir -p "$dumps"
          {
            echo "NUPP_TEST_AOT_TRACE=1"
            echo "NUPP_TEST_AOT_ARTIFACTS=$(cygpath -w "$dumps")"
          } >> "$GITHUB_ENV"

      # Already answered on Linux by the fast checks. The other platforms are
      # asked because a checker answer is not promised to be platform-free.
      - name: Check the compiler
        if: matrix.kind == 'gates' && runner.os != 'Linux'
        shell: bash
        run: ./bin/nupp check

      # The Windows Rust ABI is selected through rustup, then shared by the VM
      # runtime and its providers. Exercise that contract, and the nested
      # launcher fixtures, where a failure names its last case rather than
      # appearing in a lane as many unrelated unrun suites. The lanes leave
      # this group out rather than running it a second time unchanged.
      - name: Run the Windows native and launcher preflight
        if: matrix.kind == 'gates' && runner.os == 'Windows'
        shell: bash
        env:
          NUPP_TEST_TRACE_CASES: 1
        run: ./bin/nupp test --fresh --scope=all --jobs=1 --group=windows-preflight

      # Name the Rust-native release boundary: each resource owner's stress
      # and cancellation tests on the retained platform itself.
      - name: Gate the Rust-native platform artifacts
        if: matrix.kind == 'gates'
        shell: bash
        run: |
          # Cargo run directly asks for the compiler cache itself.
          if [ "$RUNNER_OS" = macOS ]; then
            export RUSTC_WRAPPER="$PWD/scripts/sccache-wrapper"
          else
            export RUSTC_WRAPPER=sccache
          fi
          .github/scripts/test-rust-native-platform.sh

      # Keep the external corpus and the C importer explicit. A configured
      # corpus used to be absent and silently skipped, while an import-c failure
      # could be buried among thousands of unrelated cases. The lanes exclude
      # this group rather than repeating it.
      - name: Run the tl.lua oracle and import-c fixtures
        if: matrix.kind == 'gates'
        shell: bash
        run: |
          compiler_root=$PWD
          if command -v cygpath >/dev/null 2>&1; then
            compiler_root=$(cygpath -m "$compiler_root")
          fi
          export NUPP_COMPILER_ROOT="$compiler_root"
          export NUPP_LUA_CORPUS="$compiler_root/.ci-corpus/teal/tl.lua"
          ./bin/nupp test --fresh --scope=all --jobs=1 --group=external-corpus

      # Three minutes of starting child processes, and the only thing that can
      # change what they answer is bench code. `measurement` is the surface every
      # such path reaches -- the runner, its CLI, `src/nupp/bench/`, `bench/` and
      # this suite itself -- so the classifier turning it off means nothing that
      # could have moved the result went unrun.
      #
      # The rest of the bench surface is not gated. The `keep` intrinsic's
      # lowering, the allocation account, the statistics and the fork merge rules
      # live in `benchtest`, which the lanes run on every change, because a
      # compiler change can break those without touching anything named above.
      - name: Run the benchmark runner suite
        if: >-
          matrix.kind == 'gates' && runner.os == 'Linux'
          && contains(needs.classify.outputs.selection, '"measurement"')
        shell: bash
        run: ./bin/nupp test --fresh --scope=all --jobs=1 --group=measurement

      # The Nupp-authored interpreter core: the handler sources lowered to CLIF,
      # compiled into an object by the glue, and the runtime's native contract
      # tests run against it. Linux and macOS ARM64; Windows waits on the
      # object's unwind and stack-walking behavior there. The lanes exclude
      # the group.
      - name: Run the native core suites
        if: matrix.kind == 'native-core'
        shell: bash
        run: >-
          .github/scripts/run-suite-shard.sh
          ${{ matrix.shard }} ${{ matrix.shards }} ${{ matrix.batch }} ${{ matrix.jobs }}
          ${{ matrix.select }}

      # The bridge's own C under AddressSanitizer and UndefinedBehaviorSanitizer:
      # its contracts, then the guest cases that reach the most of it -- C
      # calls through the bridge's imports, aggregates through libffi, an
      # interposed getentropy failing, and Markdown through a C library. One
      # shard runs it; the guests' generated code is not instrumented
      # (scripts/core-bridge).
      - name: Run the bridge under the sanitizers
        if: matrix.kind == 'core' && matrix.shard == 1
        shell: bash
        run: |
          ./scripts/core-bridge --sanitize --test
          NUPP_CORE_BRIDGE_SANITIZE=1 ./bin/nupp run tests/core/guests/acceptance.nupp \
            --target ${{ matrix.target }} cbridge ffiaggregates entropyfailure markdown

      # The native core's own guest programs and runtime units, run on the core
      # through the C bridge in normal and spill mode, against the committed
      # baseline in tests/core/guests/inventory.json: a new or changed failure,
      # a missing result or a known failure that now passes fails the leg, and
      # the known failures are reported as such. macOS ARM64 only until the
      # core runs on another target; the leg names the triple it runs for.
      - name: Run the core guests and units
        if: matrix.kind == 'core'
        shell: bash
        run: >-
          ./bin/nupp run tests/core/guests/acceptance.nupp --ci --target ${{ matrix.target }}
          --part ${{ matrix.shard }}/${{ matrix.shards }} --jobs ${{ matrix.jobs }}

      # One shard of one lane. `core_pattern` already pipes to systemd-coredump
      # on the Linux image, but the soft limit is zero, so the kernel writes
      # nothing and the shell still says "core dumped". Raising it here is what
      # makes the step below able to ask a crashed worker anything at all.
      - name: Run the compiler suite
        if: matrix.kind == 'lane'
        shell: bash
        run: |
          ulimit -c unlimited 2>/dev/null || true
          .github/scripts/run-suite-shard.sh \
            ${{ matrix.shard }} ${{ matrix.shards }} ${{ matrix.batch }} ${{ matrix.jobs }} \
            ${{ matrix.select }}

      # A run that stops making progress is cancelled by the job timeout with
      # nothing said about where it stood: every macOS leg from a7deafd88 on
      # sat at "shell suites joining" for an hour with one Nupp worker that
      # had finished its suites and never exited. Steps still run after a
      # cancellation, so this one lists what the run left running and samples
      # each test process, which names the call it is blocked in.
      - name: Report a stalled run
        if: (failure() || cancelled()) && runner.os == 'macOS'
        continue-on-error: true
        shell: bash
        run: |
          ps -axo pid,ppid,pgid,stat,etime,command \
            | grep -E 'nupp-test|tests/run|vm-cli|bin/nupp' | grep -v grep || true
          for pid in $(pgrep -f 'nupp-test|tests/run|internal-runner' || true); do
            echo "=== sample $pid"
            sample "$pid" 2 -file /dev/stdout 2>/dev/null | head -60 || true
          done

      # A worker killed by a signal says which suite it was in, and on Linux it
      # is killed by SIGSEGV in a different set of suites every run -- so the
      # name says where it was, not what went wrong. The core says that.
      # Retrieved through `coredumpctl` because `core_pattern` hands cores to
      # systemd rather than leaving them in a directory. Only runs when a
      # step above failed, and never fails the job itself: this reports on a
      # failure, it is not one.
      - name: Report a crashed worker
        if: failure() && runner.os == 'Linux'
        continue-on-error: true
        shell: bash
        run: |
          set -uo pipefail
          echo "core_pattern: $(cat /proc/sys/kernel/core_pattern 2>/dev/null)"
          coredumpctl list --no-pager 2>&1 | tail -12 || true
          command -v gdb >/dev/null 2>&1 \
            || sudo apt-get install -y -q gdb >/dev/null 2>&1 || true
          for pid in $(coredumpctl list --no-pager --no-legend 2>/dev/null \
              | awk '$NF ~ /present/ || $0 ~ /luajit|nupp/ {print $5}' | tail -3); do
            echo "=== core for pid $pid ==="
            coredumpctl info "$pid" --no-pager 2>&1 | head -30
            coredumpctl debug "$pid" --debugger=gdb \
              --debugger-arguments='-batch -q -ex "thread apply all bt 25"' \
              2>&1 | head -60
          done
          exit 0

      # What the suite saved, named in the log so a reader knows what the
      # artifact holds before downloading it. `aot-libraries.txt` beside these
      # says which case built each library and which tier its detector chose,
      # which is the question a saved library on its own cannot answer: the
      # runner pool is mixed, and a case that passed may simply never have run
      # the code being examined.
      - name: Report Windows worker crashes
        if: failure() && runner.os == 'Windows'
        continue-on-error: true
        shell: pwsh
        run: |
          $dumpDirectory = Join-Path $env:RUNNER_TEMP 'nupp-worker-dumps'
          New-Item -ItemType Directory -Force $dumpDirectory | Out-Null
          Get-ChildItem $dumpDirectory | Format-Table Name, Length

      - name: Upload Windows worker crash diagnostics
        if: failure() && runner.os == 'Windows'
        uses: actions/upload-artifact@v4
        with:
          name: windows-worker-crashes-${{ matrix.id }}
          path: ${{ runner.temp }}/nupp-worker-dumps
          if-no-files-found: ignore
          retention-days: 7

      # Saved whatever the suite concluded. A failing run still measured every
      # suite that ran, and the next run's deal is better for having it than
      # for relearning it from nothing. The runner job restores the newest of
      # these for the next run's legs.
      - name: Save the recorded suite timings
        if: always() && matrix.kind != 'gates'
        uses: actions/cache/save@v4
        continue-on-error: true
        with:
          path: build/test-runner/.nupp-test-times.json
          key: nupp-test-times-${{ runner.os }}-${{ matrix.id }}-${{ github.sha }}

  integration-macos:
    name: ${{ matrix.name }}
    needs: [classify, runner-macos]
    if: needs.classify.outputs.macos-integration == 'true'
    runs-on: macos-15
    timeout-minutes: ${{ matrix.timeout }}
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.classify.outputs.macos-legs) }}
    steps: *leg-steps

  integration-windows:
    name: ${{ matrix.name }}
    needs: [classify, runner-windows]
    if: needs.classify.outputs.windows-integration == 'true'
    runs-on: windows-2022
    timeout-minutes: ${{ matrix.timeout }}
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.classify.outputs.windows-legs) }}
    steps: *leg-steps

  # Byte-identical self-hosting, which is about the compiler's own sources and
  # not about a platform. It was the last step of every matrix entry, where it
  # only ever ran if everything before it was green -- so the one check that
  # says the compiler reproduces itself was the one most often not reached.
  fixpoint:
    name: Self-hosting fixpoint
    needs: [classify, build-linux]
    if: needs.classify.outputs.fixpoint == 'true'
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 75
    steps:
      - name: Check out the repository
        uses: actions/checkout@v5

      - name: Prepare the compiler
        uses: ./.github/actions/prepare

      - name: Verify the self-hosting fixpoint
        run: ./bin/nupp fixpoint

  # Documentation generation, its links, and the generated assets a site build
  # produces. This is the whole obligation of a documentation-only change: it
  # provisions no platform matrix, no native toolchain and no GPU adapter.
  docs-site:
    name: Documentation and site
    needs: [classify, build-linux]
    if: needs.classify.outputs.docs-site == 'true'
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 60
    steps:
      - name: Check out the repository
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Validate native Pages artifacts
        run: node --test tests/tools/packaging/pages-cache.test.mjs

      - name: Prepare the compiler
        uses: ./.github/actions/prepare

      - name: Build the documentation
        run: ./bin/nupp build --target docs

      # On the runner the compiler carries, so a documentation change builds
      # no test runner: eight suites cost less than building one.
      - name: Regenerate and verify the documentation
        run: ./bin/nupp test --internal-runner --fresh --scope=all --group=docs

  gpu-conformance:
    name: GPU conformance / CI Lavapipe Vulkan
    needs: classify
    if: needs.classify.outputs.gpu-linux == 'true'
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 30
    steps:
      - name: Check out the repository
        uses: actions/checkout@v5

      - name: Restore the provisioned toolchain
        uses: actions/cache@v4
        with:
          path: .nupp-cache/toolchain
          key: >-
            nupp-toolchain-${{ runner.os }}-${{ runner.arch }}-${{
            hashFiles('scripts/bootstrap-seeds.json', 'scripts/wgpu-native.pins.json') }}
          restore-keys: |
            nupp-toolchain-${{ runner.os }}-${{ runner.arch }}-

      - name: Install the software Vulkan adapter
        run: |
          sudo apt-get update
          sudo apt-get install -y libvulkan1 mesa-vulkan-drivers
          icd=$(find /usr/share/vulkan/icd.d -name 'lvp_icd*.json' -type f | head -n 1)
          test -n "$icd"
          printf 'NUPP_GPU_ICD=%s\n' "$icd" >> "$GITHUB_ENV"

      - name: Restore compiled GPU test modules
        uses: actions/cache@v4
        with:
          path: build/cache
          key: >-
            nupp-wgpu-modules-${{ runner.os }}-${{ runner.arch }}-${{
            hashFiles('scripts/bootstrap-seeds.json') }}-${{
            hashFiles('src/nupp/runtime/provider/wgpu*.nupp',
            'src/nupp/runtime/provider/gpudevice.nupp',
            'src/nupp/runtime/provider/gpucosts.nupp',
            'tests/stdlib/io/gpu/gpudevicetest.lua') }}
          restore-keys: |
            nupp-wgpu-modules-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('scripts/bootstrap-seeds.json') }}-

      - name: Run exact GPU dispatch and readback
        id: gpu_conformance
        run: .github/scripts/test-gpu-conformance.sh

      - name: Upload GPU conformance receipt
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: wgpu-conformance-${{ runner.os }}-${{ runner.arch }}
          path: build/wgpu-conformance/*.json
          if-no-files-found: warn

  gpu-conformance-windows:
    name: GPU conformance / Windows DX12
    needs: classify
    if: needs.classify.outputs.gpu-windows == 'true'
    runs-on: windows-2022
    timeout-minutes: 45
    steps:
      - name: Check out the repository
        uses: actions/checkout@v5

      - name: Restore the provisioned toolchain
        uses: actions/cache@v4
        with:
          path: .nupp-cache/toolchain
          key: >-
            nupp-toolchain-${{ runner.os }}-${{ runner.arch }}-${{
            hashFiles('scripts/bootstrap-seeds.json', 'scripts/wgpu-native.pins.json') }}
          restore-keys: |
            nupp-toolchain-${{ runner.os }}-${{ runner.arch }}-

      # Adapter absence is a failure: Vulkan cannot silently substitute for
      # the retained Windows DX12 contract.
      - name: Restore compiled GPU test modules
        uses: actions/cache@v4
        with:
          path: build/cache
          key: >-
            nupp-wgpu-modules-${{ runner.os }}-${{ runner.arch }}-${{
            hashFiles('scripts/bootstrap-seeds.json') }}-${{
            hashFiles('src/nupp/runtime/provider/wgpu*.nupp',
            'src/nupp/runtime/provider/gpudevice.nupp',
            'src/nupp/runtime/provider/gpucosts.nupp',
            'tests/stdlib/io/gpu/gpudevicetest.lua') }}
          restore-keys: |
            nupp-wgpu-modules-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('scripts/bootstrap-seeds.json') }}-

      - name: Run exact DX12 dispatch and readback
        id: gpu_conformance
        shell: bash
        run: .github/scripts/test-gpu-conformance-windows.sh

      - name: Upload GPU conformance receipt
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: wgpu-conformance-${{ runner.os }}-${{ runner.arch }}
          path: build/wgpu-conformance/*.json
          if-no-files-found: warn

  proofs:
    name: C proofs
    needs: classify
    if: needs.classify.outputs.proofs == 'true'
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 10
    steps:
      - name: Check out the repository
        uses: actions/checkout@v5

      - name: Install CBMC
        run: |
          package="$RUNNER_TEMP/cbmc.deb"
          curl --fail --silent --show-error --location --output "$package" \
            https://github.com/diffblue/cbmc/releases/download/cbmc-6.11.0/ubuntu-24.04-arm64-cbmc-6.11.0-Linux.deb
          echo "9eb8f41a7dcda8eac6338b8367d77831431f767691e4535209925bd85e315ae7  $package" | sha256sum --check
          dpkg-deb --extract "$package" "$RUNNER_TEMP/cbmc"
          echo "$RUNNER_TEMP/cbmc/usr/bin" >> "$GITHUB_PATH"

      - name: Run the C proofs
        run: |
          if [ "$(./scripts/stage0-runtime)" = vm ]; then
            seed=$(./scripts/toolchain stage0-seed)
            export NUPP_VM_BINARY="$seed/runtime" NUPP_VM_CLI_IMAGE="$seed/compiler.image"
          fi
          ./bin/nupp task proofs

  # The one status a ruleset should require. Its meaning does not change when
  # the jobs above are reorganized, renamed, or split, and it cannot pass by a
  # job being skipped: a job the classifier selected and that did not succeed
  # fails this, and so does a classification that failed to happen at all.
  required-ci:
    name: required-ci
    # Declined with `classify`, for the same event and the same reason: a run
    # that tested nothing has no status to give.
    if: >-
      always() && (github.event_name != 'pull_request'
      || github.event.pull_request.head.repo.full_name != github.repository)
    needs:
      - classify
      - build-linux
      - build-macos
      - build-windows
      - runner-linux
      - runner-macos
      - runner-windows
      - fast-checks
      - integration-linux
      - integration-macos
      - integration-windows
      - fixpoint
      - docs-site
      - gpu-conformance
      - gpu-conformance-windows
      - proofs
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    # The run's queue delay and its per-job durations are only on the API, and
    # a workflow cannot read its own run without being told it may.
    permissions:
      contents: read
      actions: read
    steps:
      - name: Check out the repository
        uses: actions/checkout@v5

      - name: Require every selected job to have succeeded
        env:
          NEEDS: ${{ toJSON(needs) }}
          SELECTION: ${{ needs.classify.outputs.selection }}
        run: .github/scripts/require-selected-jobs.py

      # One row per required run, so queue delay, execution time and the failed
      # step are answerable from retained data rather than from whichever run
      # somebody happens to still have open.
      - name: Record the run
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          SELECTION: ${{ needs.classify.outputs.selection }}
        run: .github/scripts/record-required-run.sh

      - name: Upload the run record
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: required-ci-record-${{ github.run_id }}-${{ github.run_attempt }}
          path: build/ci-record
          if-no-files-found: warn
          retention-days: 90
