name: Compiler matrix

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  compiler:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux x64
            os: ubuntu-24.04
          - name: macOS arm64
            os: macos-15
          - name: Windows x64
            os: windows-2022
    steps:
      - name: Check out the repository
        uses: actions/checkout@v5

      - name: Build LuaJIT and lua-cjson
        if: runner.os != 'Windows'
        shell: bash
        run: .github/scripts/setup-luajit-posix.sh

      - name: Build LuaJIT and lua-cjson
        if: runner.os == 'Windows'
        shell: pwsh
        run: .github/scripts/setup-luajit-windows.ps1

      - name: Bootstrap the compiler
        shell: bash
        run: ./bin/nupp build

      - name: Diagnose a Windows native-library load failure
        if: failure() && runner.os == 'Windows'
        shell: pwsh
        run: |
          Get-ChildItem build/lib
          dumpbin /dependents build/lib/nupp_native.dll

      - name: Install the development rocks
        shell: bash
        run: ./bin/nupp build --target docs

      - name: Check the compiler
        shell: bash
        run: ./bin/nupp check

      - name: Run the compiler suite
        if: runner.os != 'Windows'
        shell: bash
        run: ./bin/nupp test --jobs=1

      - name: Run the compiler suite
        if: runner.os == 'Windows'
        shell: bash
        env:
          NUPP_TEST_BASH: ${{ env.NUPP_CI_BASH }}
          NUPP_TEST_SH: ${{ env.NUPP_CI_SH }}
        run: ./bin/nupp test --jobs=1

      - name: Verify the self-hosting fixpoint
        shell: bash
        run: ./bin/nupp fixpoint

      # The AOT lane body is written in compiler vector extensions, and what a
      # select, a mask lane and a horizontal test lower to is completely
      # different on NEON, SSE2 and AVX2. Every measurement before this ran on
      # one architecture, so this is the first time the lowering is executed
      # anywhere else. It needs only a C compiler, which is what lets it run
      # here rather than only where a host Nupp and LuaJIT are set up.
      - name: Compare the AOT lane and scalar bodies
        if: runner.os != 'Windows'
        shell: bash
        run: bench/kernel-subset-spike/crosscheck.sh

      # A 32-byte vector is two SSE registers and one AVX2 register, so the two
      # are different instruction sequences and passing one says nothing about
      # the other. Every x86-64 runner has AVX2; arm64 has one vector width and
      # nothing to select.
      - name: Compare them again at the AVX2 feature tier
        if: runner.os == 'Linux'
        shell: bash
        env:
          NUPP_CHECK_CFLAGS: -march=x86-64-v3
        run: bench/kernel-subset-spike/crosscheck.sh

      - name: Run every native provider test
        shell: bash
        run: >-
          cargo test --locked --manifest-path runtime/native/Cargo.toml
          --all-features
