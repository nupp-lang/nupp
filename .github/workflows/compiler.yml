name: Compiler matrix

on:
  # Restricted to the trunk because an unfiltered `push` fires alongside
  # `pull_request` for every branch in this repository, which ran the whole
  # matrix twice for each commit of a pull request and told us nothing the
  # second time.
  push:
    branches:
      - main
    tags:
      - "*"
  pull_request:

permissions:
  contents: read

# A pull request is only ever asked about its tip, so a superseded run is work
# nobody is waiting on. The trunk is not cancelled: every commit that lands
# there keeps its own answer, which is what makes a later bisection possible.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  gpu-conformance:
    name: GPU conformance / CI Lavapipe Vulkan
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out the repository
        uses: actions/checkout@v5

      - name: Restore the provisioned toolchain
        uses: actions/cache@v4
        with:
          path: |
            .nupp-cache/toolchain
            build/rust
          key: >-
            nupp-gpu-${{ runner.os }}-${{ runner.arch }}-${{
            hashFiles('scripts/toolchain.pins', 'scripts/toolchain',
            'Cargo.lock', 'Cargo.toml', 'native/**/Cargo.toml',
            'native/**/*.rs', 'native/**/*.c', 'native/**/*.h') }}
          restore-keys: |
            nupp-gpu-${{ runner.os }}-${{ runner.arch }}-

      - name: Install the software Vulkan adapter
        run: |
          sudo apt-get update
          sudo apt-get install -y libvulkan1 mesa-vulkan-drivers
          icd=$(find /usr/share/vulkan/icd.d -name 'lvp_icd*.json' -type f | head -n 1)
          test -n "$icd"
          printf 'NUPP_GPU_ICD=%s\n' "$icd" >> "$GITHUB_ENV"

      - name: Provision the compiler
        run: ./scripts/toolchain --all

      - name: Run exact GPU dispatch and readback
        id: gpu_conformance
        continue-on-error: true
        run: .github/scripts/test-gpu-conformance.sh

      # A failed conformance step would otherwise skip actions/cache's post
      # save the toolchain for every diagnostic commit. Preserve the expensive
      # compiler build before turning the captured outcome back
      # into the job's verdict.
      - name: Save a failed conformance toolchain
        if: steps.gpu_conformance.outcome == 'failure'
        uses: actions/cache/save@v4
        with:
          path: |
            .nupp-cache/toolchain
            build/rust
          key: >-
            nupp-gpu-${{ runner.os }}-${{ runner.arch }}-${{
            hashFiles('scripts/toolchain.pins', 'scripts/toolchain',
            'Cargo.lock', 'Cargo.toml', 'native/**/Cargo.toml',
            'native/**/*.rs', 'native/**/*.c', 'native/**/*.h') }}

      - name: Report GPU conformance failure
        if: steps.gpu_conformance.outcome == 'failure'
        run: exit 1

  portable-compiler:
    name: Portable compiler on official Lua 5.1.5
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out the repository
        uses: actions/checkout@v5

      - name: Restore the pinned build tools
        uses: actions/cache@v4
        with:
          path: |
            ${{ runner.temp }}/nupp-ci-tools
            .rocks
          key: >-
            nupp-tools-${{ runner.os }}-${{ runner.arch }}-${{
            hashFiles('scripts/toolchain.pins') }}

      - name: Restore the provisioned toolchain
        uses: actions/cache@v4
        with:
          path: .nupp-cache/toolchain
          key: >-
            nupp-toolchain-${{ runner.os }}-${{ runner.arch }}-${{
            hashFiles('scripts/toolchain.pins', 'scripts/toolchain') }}
          restore-keys: |
            nupp-toolchain-${{ runner.os }}-${{ runner.arch }}-

      - name: Provision the pinned toolchain
        shell: bash
        run: ./scripts/toolchain --all

      - name: Bootstrap the compiler
        shell: bash
        run: ./bin/nupp build

      - name: Run the portable compiler in the six-library host
        shell: bash
        run: .github/scripts/test-portable-compiler.sh

  compiler:
    name: ${{ matrix.name }} / LuaJIT ${{ matrix.luajit }}
    runs-on: ${{ matrix.os }}
    # A timeout is here to end a hang, so it has to sit above the work rather
    # than across it. Windows ran 24m48s and 29m36s on its green runs and was
    # killed at exactly 30 on a slower runner, which reads as a cancelled job
    # and is really a suite that was still going. A killed job also skips its
    # post steps, so it never saved the caches above and would have missed
    # every time.
    timeout-minutes: ${{ matrix.timeout }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux x64
            os: ubuntu-24.04
            timeout: 40
            luajit: 2.1 rolling
            benchmark_artifact: linux-x64-luajit-2.1
          - name: macOS arm64
            os: macos-15
            timeout: 30
            luajit: 2.1 rolling
            benchmark_artifact: macos-arm64-luajit-2.1
          - name: Windows x64
            os: windows-2022
            timeout: 45
            luajit: 2.1 rolling
            benchmark_artifact: windows-x64-luajit-2.1
    steps:
      - name: Check out the repository
        uses: actions/checkout@v5

      # This is a parser/checker oracle, not a build dependency. Pinning the
      # source keeps a language change from being conflated with an upstream
      # corpus change, and sparse checkout avoids fetching the rest of Teal.
      - name: Check out the Teal 0.8.0 tl.lua oracle
        uses: actions/checkout@v5
        with:
          repository: teal-language/tl
          ref: 8ea89e75751e6cea0547f3838e0e244497d88bd6
          path: .ci-corpus/teal
          sparse-checkout: tl.lua
          sparse-checkout-cone-mode: false

      # After the checkout rather than before it: `actions/checkout` cleans the
      # workspace, and `.rocks` is ignored, so anything restored first would be
      # removed again before a step could use it.
      #
      # The key carries both setup scripts because each pins the commits it
      # builds. Editing either rebuilds every platform's tools, which is a few
      # minutes on a change nobody makes weekly, and is the version of this that
      # cannot serve a tree built from different pins.
      - name: Restore the pinned build tools
        uses: actions/cache@v4
        with:
          path: |
            ${{ runner.temp }}/nupp-ci-tools
            .rocks
          key: >-
            nupp-tools-${{ runner.os }}-${{ runner.arch }}-${{
            hashFiles('scripts/toolchain.pins') }}

      # Each entry validates its own content, so an approximate match is useful
      # here where it would not be above: a lock file that moved on rebuilds the
      # crates that changed and reuses the rest.
      - name: Restore the provisioned toolchain
        uses: actions/cache@v4
        with:
          path: .nupp-cache/toolchain
          key: >-
            nupp-toolchain-${{ runner.os }}-${{ runner.arch }}-${{
            hashFiles('scripts/toolchain.pins', 'scripts/toolchain') }}
          restore-keys: |
            nupp-toolchain-${{ runner.os }}-${{ runner.arch }}-

      - name: Install the ABI-compatible Windows Rust toolchain
        if: runner.os == 'Windows'
        shell: bash
        run: |
          channel=$(sed -n 's/^channel = "\([^"]*\)"$/\1/p' rust-toolchain.toml)
          rustup toolchain install "${channel}-x86_64-pc-windows-gnu" --profile minimal

      - name: Provision the pinned toolchain
        if: runner.os != 'Windows'
        shell: bash
        run: ./scripts/toolchain --all

      - name: Provision the pinned toolchain
        if: runner.os == 'Windows'
        shell: bash
        run: ./scripts/toolchain --all

      # LuaJIT 3.0 has not been released. Its matrix entries belong beside
      # these when it has a source revision to pin; accepting an unversioned
      # development branch here would make two runs of one commit test
      # different interpreters. The rolling 2.1 pin must retain the syntax
      # backports generated Nupp uses.
      - name: Verify the LuaJIT matrix member
        shell: bash
        run: |
          set -euo pipefail
          . ./scripts/luajit.sh
          export NUPP_LUAJIT_FLOOR="$LUAJIT_FLOOR"
          luajit=$(./scripts/toolchain luajit)
          "$luajit/bin/luajit" -e '
            local floor = assert(tonumber(os.getenv("NUPP_LUAJIT_FLOOR")))
            local rolling = jit.version:match("^LuaJIT 2%.1%.(%d+)")
            assert(rolling, "expected LuaJIT 2.1 rolling, got " .. jit.version)
            assert(tonumber(rolling) >= floor,
              ("LuaJIT 2.1.%s is below the 2.1.%d floor"):format(rolling, floor))
            print(jit.version)
          '
          echo "$luajit/bin" >> "$GITHUB_PATH"

      - name: Bootstrap the compiler
        shell: bash
        run: ./bin/nupp build

      - name: Install the portable Lua matrix
        if: runner.os == 'Linux'
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y lua5.1 lua5.2 lua5.3 lua5.4

      - name: Run the portable generated-output corpus
        if: runner.os == 'Linux'
        shell: bash
        run: |
          luajit=$(./scripts/toolchain luajit)
          scripts/portable-lua-corpus.sh \
            lua5.1 lua5.2 lua5.3 lua5.4 "$luajit/bin/luajit"

      - name: Build the same library for LuaJIT and Lua 5.1
        if: runner.os == 'Linux'
        shell: bash
        run: scripts/dual-dialect-library.sh lua5.1

      - name: Diagnose a Windows native-library load failure
        if: failure() && runner.os == 'Windows'
        shell: pwsh
        run: |
          Get-ChildItem build/lib
          dumpbin /dependents build/lib/nupp_native_v2_dev.dll

      - name: Install the development rocks
        shell: bash
        run: |
          ./bin/nupp build --target bootstrapCompiler
          ./bin/nupp build --target docs

      - name: Check the compiler
        shell: bash
        run: ./bin/nupp check

      # Name the Rust-native release boundary before the broad suite. This runs
      # each resource owner's stress/cancellation tests, the aggregate C ABI
      # smoke, and C consumers of the executable, static application archive,
      # and static/dynamic embedding SDKs on the retained platform itself.
      - name: Gate the Rust-native platform artifacts
        shell: bash
        run: .github/scripts/test-rust-native-platform.sh

      # Fail close to provisioning, and name the last case if the Windows
      # loader or native networking layer terminates the test process. Exercise
      # the nested launcher fixtures here too: in the full suite that process is
      # one long-lived shard, so a failure otherwise appears twenty minutes later
      # as many unrelated unrun suites.
      - name: Run the Windows native and launcher preflight
        if: runner.os == 'Windows'
        shell: bash
        run: |
          set -euo pipefail
          bash_path=$(command -v bash)
          sh_path=$(dirname "$bash_path")/sh.exe
          test -f "$sh_path"
          NUPP_TEST_BASH=$(cygpath -w "$bash_path") \
          NUPP_TEST_SH=$(cygpath -w "$sh_path") \
          NUPP_TEST_TRACE_CASES=1 \
          ./bin/nupp test --jobs=1 netnativetest
          NUPP_TEST_BASH=$(cygpath -w "$bash_path") \
          NUPP_TEST_SH=$(cygpath -w "$sh_path") \
          ./bin/nupp test --jobs=1 runnertest soatest worktreetest

      # Keep the external corpus and the C importer explicit. The full suite
      # below reaches both too, but a configured corpus used to be absent and
      # silently skipped, while an import-c failure could be buried among
      # thousands of unrelated cases.
      - name: Run the tl.lua oracle and import-c fixtures
        shell: bash
        run: |
          compiler_root=$PWD
          if command -v cygpath >/dev/null 2>&1; then
            compiler_root=$(cygpath -m "$compiler_root")
          fi
          export NUPP_COMPILER_ROOT="$compiler_root"
          export NUPP_LUA_CORPUS="$compiler_root/.ci-corpus/teal/tl.lua"
          export NUPP_NATIVE_V2_LIBRARY
          NUPP_NATIVE_V2_LIBRARY=$(./scripts/toolchain \
            native-rust base,files,http,net,process,tls,uri,uuid)
          # `tests/run` refuses to start on Windows without these, the same way
          # the whole-suite step below names them. This step reaches the runner
          # directly rather than through `nupp test`, so it has to name them
          # too, or the Windows job ends here having run no test at all.
          if [ "$RUNNER_OS" = Windows ]; then
            bash_path=$(command -v bash)
            sh_path=$(dirname "$bash_path")/sh.exe
            test -f "$sh_path"
            export NUPP_TEST_BASH NUPP_TEST_SH
            NUPP_TEST_BASH=$(cygpath -w "$bash_path")
            NUPP_TEST_SH=$(cygpath -w "$sh_path")
          fi
          ./bin/nupp build --target testRunner
          ./tests/run --jobs=1 corpustest importctest

      # These are measurements rather than a noisy shared-runner pass/fail
      # threshold. One immutable, platform-qualified artifact per commit keeps
      # the reification speedup bisectable without pretending hosted runner
      # timing is stable enough for an absolute wall-clock gate.
      - name: Measure reification performance
        shell: bash
        run: |
          set -euo pipefail
          results=build/ci-benchmarks
          mkdir -p "$results"
          {
            printf 'commit=%s\n' "$GITHUB_SHA"
            printf 'runner=%s/%s\n' "$RUNNER_OS" "$RUNNER_ARCH"
            luajit -e 'print(jit.version .. " " .. jit.os .. "/" .. jit.arch)'
          } > "$results/metadata.txt"
          luajit bench/reification.lua | tee "$results/reification.txt"
          ./bin/nupp run bench/aos.nupp | tee "$results/aos.txt"

      - name: Upload reification measurements
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: >-
            reification-${{ matrix.benchmark_artifact }}-${{ github.sha }}
          path: build/ci-benchmarks
          if-no-files-found: error
          retention-days: 90

      # The AOT lane body is written in compiler vector extensions, and what a
      # select, a mask lane and a horizontal test lower to is completely
      # different on NEON, SSE2 and AVX2. Every measurement and every
      # differential before this ran on one architecture, so this is the first
      # time the lowering is executed anywhere else. It needs only a built
      # compiler and a C compiler, so it runs here rather than only where a host
      # LuaJIT is set up.
      #
      # Deliberately before the suite. It does not depend on the suite passing,
      # and a step placed after one that is red for an unrelated reason is a step
      # that never runs -- which is what happened the first time this landed.
      - name: Compare the AOT lane and scalar bodies
        shell: bash
        run: bench/kernel-subset-spike/crosscheck.sh

      # The step above targets the tier a gang fits -- AVX on x86-64, where a
      # 32-byte vector is one register. This one adds the rest of v3, because a
      # feature tier changes which instructions the same vector operations lower
      # to and passing one says nothing about another.
      - name: Compare them again at the full v3 feature tier
        if: runner.os == 'Linux'
        shell: bash
        env:
          NUPP_CHECK_CFLAGS: -march=x86-64-v3
        run: bench/kernel-subset-spike/crosscheck.sh

      # And at the x86-64 baseline, which is what a build gets when nothing asked
      # for a wider tier -- the 16-byte gangs, compiled for plain SSE2. This is
      # the combination most users get, so it is the one least worth inferring
      # from the others.
      - name: Compare them at the x86-64 baseline
        if: runner.os == 'Linux'
        shell: bash
        env:
          NUPP_CHECK_GANG_FEATURES: baseline
          NUPP_CHECK_CFLAGS: " "
        run: bench/kernel-subset-spike/crosscheck.sh

      # No hosted runner promises AVX-512. Compile the mixed-width differential
      # at that tier without executing it, so the 64-byte vector ABI and every
      # helper call are still held warning-clean by the same -Werror boundary.
      - name: Compile the eight-lane mixed gang at AVX-512
        if: runner.os == 'Linux'
        shell: bash
        env:
          NUPP_CHECK_KERNELS: mixedwidth
          NUPP_CHECK_GANG_FEATURES: avx512f
          NUPP_CHECK_CFLAGS: -mavx512f
          NUPP_CHECK_COMPILE_ONLY: 1
        run: bench/kernel-subset-spike/crosscheck.sh

      # Windows is a supported target for this backend and MSVC is not a
      # supported compiler for it: the generated C needs `vector_size` and
      # `__builtin_convertvector`, which Clang and MinGW GCC have and MSVC has
      # neither of. Nothing about that is Windows-specific, so the way to know it
      # holds is to run the same differential there rather than to reason about
      # it -- which is what this job did not do while Windows was skipped.
      - name: Name the C compiler this Windows runner offers
        if: runner.os == 'Windows'
        shell: bash
        run: |
          for candidate in clang gcc cc; do
            if command -v "$candidate" >/dev/null 2>&1; then
              echo "$candidate: $("$candidate" --version 2>&1 | head -1)"
            else
              echo "$candidate: absent"
            fi
          done

      # Everything so far has been compiled by Clang. `aot=require` will hand
      # the generated C to whatever compiler the user has, so if GCC does not
      # accept it that is better known now than at the point it compiles for
      # someone. The generated C uses `vector_size` and `__builtin_convertvector`
      # and nothing else either compiler lacks.
      - name: Compare them again through GCC
        if: runner.os == 'Linux'
        shell: bash
        env:
          NUPP_NATIVE_CC: gcc
        run: bench/kernel-subset-spike/crosscheck.sh

      # The suite's own `aot = "require"` tests take whichever compiler the
      # runner offers first, which is Clang. Running them again under GCC checks
      # the version parsing, the dialect flags and `-Werror` against the other
      # compiler a user is likely to have. The spike above exercises none of
      # that, because it builds its own command line rather than the build's.
      - name: Build and load an aot = "require" project through GCC
        if: runner.os == 'Linux'
        shell: bash
        env:
          NUPP_NATIVE_CC: gcc
        run: ./bin/nupp test --jobs=1 --shard=aotbuildtest

      # Serialized when the comptime worker's deadline was 2000 ms and parallel
      # shards pushed past it; that deadline is 10000 ms now, chosen with
      # headroom for exactly this contention. Serialized again when the first
      # attempt at this showed `coveragetest` and `aotbuildtest` racing whatever
      # else was building -- which the runner now runs alone. The runner
      # defaults to two shards per core.
      - name: Run the compiler suite
        if: runner.os != 'Windows'
        shell: bash
        # `core_pattern` already pipes to systemd-coredump on this image, but
        # the soft limit is zero, so the kernel writes nothing and the shell
        # still says "core dumped". Raising it here is what makes the step
        # below able to ask a crashed worker anything at all.
        run: |
          ulimit -c unlimited || true
          ./bin/nupp test

      # A worker killed by a signal says which suite it was in, and on Linux it
      # is killed by SIGSEGV in a different set of suites every run -- so the
      # name says where it was, not what went wrong. The core says that.
      # Retrieved through `coredumpctl` because `core_pattern` hands cores to
      # systemd rather than leaving them in a directory. Only runs when the
      # step above failed, and never fails the job itself: this reports on a
      # failure, it is not one.
      - name: Report a crashed worker
        if: failure() && runner.os == 'Linux'
        continue-on-error: true
        shell: bash
        run: |
          set -uo pipefail
          echo "core_pattern: $(cat /proc/sys/kernel/core_pattern 2>/dev/null)"
          coredumpctl list --no-pager 2>&1 | tail -12 || true
          command -v gdb >/dev/null 2>&1 \
            || sudo apt-get install -y -q gdb >/dev/null 2>&1 || true
          for pid in $(coredumpctl list --no-pager --no-legend 2>/dev/null \
              | awk '$NF ~ /present/ || $0 ~ /luajit|nupp/ {print $5}' | tail -3); do
            echo "=== core for pid $pid ==="
            coredumpctl info "$pid" --no-pager 2>&1 | head -30
            coredumpctl debug "$pid" --debugger=gdb \
              --debugger-arguments='-batch -q -ex "thread apply all bt 25"' \
              2>&1 | head -60
          done
          exit 0

      # These name the Git Bash the suite hands its POSIX commands to. They were
      # set by a provisioning script that no longer exists, and an undefined
      # `env` expands to the empty string rather than failing, so the suite spent
      # two days launching `""` and reporting no tests at all. Resolve them in
      # the step that uses them: this shell is that bash, so nothing has to be
      # carried between steps to be dropped again.
      - name: Run the compiler suite
        if: runner.os == 'Windows'
        shell: bash
        run: |
          set -euo pipefail
          bash_path=$(command -v bash)
          sh_path=$(dirname "$bash_path")/sh.exe
          test -f "$sh_path"
          NUPP_TEST_BASH=$(cygpath -w "$bash_path") \
          NUPP_TEST_SH=$(cygpath -w "$sh_path") \
          ./bin/nupp test

      - name: Verify the self-hosting fixpoint
        shell: bash
        run: ./bin/nupp fixpoint
