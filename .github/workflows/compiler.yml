name: Compiler matrix

on:
  # Restricted to the trunk because an unfiltered `push` fires alongside
  # `pull_request` for every branch in this repository, which ran the whole
  # matrix twice for each commit of a pull request and told us nothing the
  # second time.
  push:
    branches:
      - main
    tags:
      - "*"
  pull_request:
  merge_group:
  workflow_dispatch:
  # The affected-surface classifier is deliberately conservative, but it is a
  # judgement all the same. Run the whole matrix nightly whatever changed, so a
  # gap in the classification is found by this backstop rather than by a user.
  # A failure here is a bug and blocks the next release; it is not a warning.
  schedule:
    - cron: "0 7 * * *"

permissions:
  contents: read

# A pull request and a merge-queue entry are only ever asked about their tip, so
# a superseded run is work nobody is waiting on. The trunk is grouped per commit
# rather than per branch: the previous shape kept one pending run, so a newer
# push discarded an older push's answer, and the commit in between then had no
# result at all -- which is the opposite of what a retained trunk history is for.
concurrency:
  group: >-
    ${{ github.workflow }}-${{ github.event_name == 'push'
    && github.event.after || github.ref }}
  cancel-in-progress: ${{ github.event_name != 'push' }}

jobs:
  # Everything a run can decide before it provisions anything. This is the job
  # that must stay cheap: the platform matrices wait on it, so a minute here is
  # a minute added to every path through the graph.
  classify:
    name: Classify the change
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      docs-site: ${{ steps.classify.outputs.docs-site }}
      fast-checks: ${{ steps.classify.outputs.fast-checks }}
      linux-integration: ${{ steps.classify.outputs.linux-integration }}
      macos-integration: ${{ steps.classify.outputs.macos-integration }}
      windows-integration: ${{ steps.classify.outputs.windows-integration }}
      portable-compiler: ${{ steps.classify.outputs.portable-compiler }}
      browser-wasm: ${{ steps.classify.outputs.browser-wasm }}
      gpu-linux: ${{ steps.classify.outputs.gpu-linux }}
      gpu-windows: ${{ steps.classify.outputs.gpu-windows }}
      fixpoint: ${{ steps.classify.outputs.fixpoint }}
      integration-matrix: ${{ steps.matrix.outputs.integration }}
      selection: ${{ steps.classify.outputs.selection }}
    steps:
      - name: Check out the repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Restore the provisioned toolchain
        uses: actions/cache/restore@v4
        with:
          path: .nupp-cache/toolchain
          key: >-
            nupp-toolchain-${{ runner.os }}-${{ runner.arch }}-${{
            hashFiles('scripts/toolchain.pins', 'scripts/toolchain') }}
          restore-keys: |
            nupp-toolchain-${{ runner.os }}-${{ runner.arch }}-

      # The classifier is plain Lua so that the suite can assert on it. This is
      # the only thing this job provisions, and on a cache hit it is a second.
      - name: Provide a Lua interpreter
        run: echo "$(./scripts/toolchain luajit)/bin" >> "$GITHUB_PATH"

      - name: Name the changed paths
        id: changed
        env:
          EVENT: ${{ github.event_name }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PUSH_BEFORE: ${{ github.event.before }}
          MERGE_BASE: ${{ github.event.merge_group.base_sha }}
        run: |
          set -euo pipefail
          base=""
          case "$EVENT" in
            pull_request) base=$PR_BASE ;;
            merge_group) base=$MERGE_BASE ;;
            push) base=$PUSH_BEFORE ;;
          esac
          # A tag, a schedule, a manual dispatch, and the first push to a new
          # branch all have no diff to narrow. An empty list means "everything",
          # which the classifier decides rather than this shell.
          if [ -z "$base" ] || [ "$base" = "0000000000000000000000000000000000000000" ] \
              || ! git cat-file -e "$base^{commit}" 2>/dev/null; then
            : > changed-paths.txt
          else
            git diff --name-only "$base" "${{ github.sha }}" > changed-paths.txt
          fi
          echo "--- changed paths ---"
          cat changed-paths.txt

      - name: Classify the affected surfaces
        id: classify
        run: luajit .github/scripts/classify-changes.lua < changed-paths.txt

      # The classifier and the workflow have to agree about which jobs exist.
      # They are two files, so the only thing that keeps them agreeing is this
      # check, which runs before anything expensive is provisioned.
      - name: Validate the workflow against the classifier
        run: luajit .github/scripts/validate-ci-coverage.lua

      # Composing the platform matrix here rather than putting three `if`s on
      # three near-identical jobs keeps one copy of a two-hundred-line job and
      # makes the selection itself reviewable as data.
      - name: Compose the integration matrix
        id: matrix
        env:
          SELECTED_LINUX: ${{ steps.classify.outputs.linux-integration }}
          SELECTED_MACOS: ${{ steps.classify.outputs.macos-integration }}
          SELECTED_WINDOWS: ${{ steps.classify.outputs.windows-integration }}
        run: luajit .github/scripts/compose-integration-matrix.lua

  # Formatting, the checker, and every suite a Nupp worker can share a process
  # with: about a hundred suites in well under a minute. Placed ahead of the
  # platform jobs so the failures that need no platform are reported before any
  # platform is provisioned.
  fast-checks:
    name: Fast checks
    needs: classify
    if: needs.classify.outputs.fast-checks == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out the repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Restore the pinned build tools
        uses: actions/cache@v4
        with:
          path: |
            ${{ runner.temp }}/nupp-ci-tools
            .rocks
          key: >-
            nupp-tools-${{ runner.os }}-${{ runner.arch }}-${{
            hashFiles('scripts/toolchain.pins') }}

      - name: Restore the provisioned toolchain
        uses: actions/cache@v4
        with:
          path: .nupp-cache/toolchain
          key: >-
            nupp-toolchain-${{ runner.os }}-${{ runner.arch }}-${{
            hashFiles('scripts/toolchain.pins', 'scripts/toolchain') }}
          restore-keys: |
            nupp-toolchain-${{ runner.os }}-${{ runner.arch }}-

      - name: Restore the content-validated compiler cache
        uses: actions/cache/restore@v4
        with:
          path: build/cache
          key: >-
            nupp-buildcache-${{ runner.os }}-${{ runner.arch }}-${{
            hashFiles('src/**', 'nupp.lua', 'scripts/toolchain.pins') }}
          restore-keys: |
            nupp-buildcache-${{ runner.os }}-${{ runner.arch }}-

      - name: Provision the pinned toolchain
        run: ./scripts/toolchain --all

      - name: Bootstrap the compiler
        run: ./bin/nupp build

      - name: Install the development rocks
        run: |
          ./bin/nupp build --target bootstrapCompiler
          ./bin/nupp build --target docs

      # The pre-push hook asks the same question of the files a push changes.
      # Ask it of the whole tree here, because a rewrite landed by a `--no-verify`
      # push is otherwise found by whichever unrelated change comes next.
      - name: Check the formatting
        run: |
          ./bin/nupp fmt --write
          if ! git diff --quiet; then
            echo "nupp fmt --write rewrote committed source:"
            git --no-pager diff --stat
            git --no-pager diff
            exit 1
          fi

      - name: Check the compiler
        run: ./bin/nupp check

      - name: Run the shared-process suites
        run: ./bin/nupp test --lane=shared

      # Saved explicitly rather than through the action's post step, so a run
      # that fails a suite still keeps the compiler build the next run would
      # otherwise redo. The entries validate their own content, so a stale one
      # is a miss and cannot change an answer.
      - name: Save the content-validated compiler cache
        if: always()
        uses: actions/cache/save@v4
        with:
          path: build/cache
          key: >-
            nupp-buildcache-${{ runner.os }}-${{ runner.arch }}-${{
            hashFiles('src/**', 'nupp.lua', 'scripts/toolchain.pins') }}

  integration:
    name: ${{ matrix.name }} / LuaJIT 2.1 rolling
    needs: [classify, fast-checks]
    if: >-
      !cancelled() && needs.classify.result == 'success'
      && needs.fast-checks.result == 'success'
      && needs.classify.outputs.integration-matrix != '[]'
    runs-on: ${{ matrix.os }}
    # A timeout is here to end a hang, so it has to sit above the work rather
    # than across it. The Rust-native artifact gate precedes the broad suite;
    # a cold runner must have time for both. A killed job also skips its post
    # steps, so it never saves the cache and would miss again next time.
    timeout-minutes: ${{ matrix.timeout }}
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.classify.outputs.integration-matrix) }}
    steps:
      - name: Check out the repository
        uses: actions/checkout@v5

      # This is a parser/checker oracle, not a build dependency. Pinning the
      # source keeps a language change from being conflated with an upstream
      # corpus change, and sparse checkout avoids fetching the rest of Teal.
      - name: Check out the Teal 0.8.0 tl.lua oracle
        uses: actions/checkout@v5
        with:
          repository: teal-language/tl
          ref: 8ea89e75751e6cea0547f3838e0e244497d88bd6
          path: .ci-corpus/teal
          sparse-checkout: tl.lua
          sparse-checkout-cone-mode: false

      # After the checkout rather than before it: `actions/checkout` cleans the
      # workspace, and `.rocks` is ignored, so anything restored first would be
      # removed again before a step could use it.
      #
      # The key carries both setup scripts because each pins the commits it
      # builds. Editing either rebuilds every platform's tools, which is a few
      # minutes on a change nobody makes weekly, and is the version of this that
      # cannot serve a tree built from different pins.
      - name: Restore the pinned build tools
        uses: actions/cache@v4
        with:
          path: |
            ${{ runner.temp }}/nupp-ci-tools
            .rocks
          key: >-
            nupp-tools-${{ runner.os }}-${{ runner.arch }}-${{
            hashFiles('scripts/toolchain.pins') }}

      # Each entry validates its own content, so an approximate match is useful
      # here where it would not be above: a lock file that moved on rebuilds the
      # crates that changed and reuses the rest.
      - name: Restore the provisioned toolchain
        uses: actions/cache@v4
        with:
          path: .nupp-cache/toolchain
          key: >-
            nupp-toolchain-${{ runner.os }}-${{ runner.arch }}-${{
            hashFiles('scripts/toolchain.pins', 'scripts/toolchain') }}
          restore-keys: |
            nupp-toolchain-${{ runner.os }}-${{ runner.arch }}-

      # One identity for the Rust artifacts, shared by every job that builds
      # them: the lock file, the toolchain file and the native sources. The
      # feature sets differ between the GPU jobs and the platform gate, and the
      # store is content-addressed, so a job that asked for a different set
      # rebuilds what it needs and reuses the rest rather than starting empty.
      - name: Restore the Rust build outputs
        uses: actions/cache@v4
        with:
          path: build/rust
          key: >-
            nupp-rust-${{ runner.os }}-${{ runner.arch }}-${{
            hashFiles('Cargo.lock', 'Cargo.toml', 'rust-toolchain.toml',
            'native/**/Cargo.toml', 'native/**/*.rs', 'native/**/*.c',
            'native/**/*.h') }}
          restore-keys: |
            nupp-rust-${{ runner.os }}-${{ runner.arch }}-

      - name: Restore the content-validated compiler cache
        uses: actions/cache/restore@v4
        with:
          path: build/cache
          key: >-
            nupp-buildcache-${{ runner.os }}-${{ runner.arch }}-${{
            hashFiles('src/**', 'nupp.lua', 'scripts/toolchain.pins') }}
          restore-keys: |
            nupp-buildcache-${{ runner.os }}-${{ runner.arch }}-

      # Suite durations are what the process lanes are packed from. A clean
      # runner without them packs blind and the busiest shard decides the wall
      # clock, so this is a scheduling input, not a correctness one: an
      # approximate match is exactly as useful as an exact one.
      - name: Restore the recorded suite timings
        uses: actions/cache/restore@v4
        with:
          path: build/.nupp-test-times.json
          key: >-
            nupp-test-times-${{ runner.os }}-${{ runner.arch }}-${{ github.sha }}
          restore-keys: |
            nupp-test-times-${{ runner.os }}-${{ runner.arch }}-

      - name: Install the ABI-compatible Windows Rust toolchain
        if: runner.os == 'Windows'
        shell: bash
        run: |
          channel=$(sed -n 's/^channel = "\([^"]*\)"$/\1/p' rust-toolchain.toml)
          rustup toolchain install "${channel}-x86_64-pc-windows-gnu" --profile minimal

      - name: Provision the pinned toolchain
        shell: bash
        run: ./scripts/toolchain --all

      # LuaJIT 3.0 has not been released. Its matrix entries belong beside
      # these when it has a source revision to pin; accepting an unversioned
      # development branch here would make two runs of one commit test
      # different interpreters. The rolling 2.1 pin must retain the syntax
      # backports generated Nupp uses.
      - name: Verify the LuaJIT matrix member
        shell: bash
        run: |
          set -euo pipefail
          . ./scripts/luajit.sh
          export NUPP_LUAJIT_FLOOR="$LUAJIT_FLOOR"
          luajit=$(./scripts/toolchain luajit)
          "$luajit/bin/luajit" -e '
            local floor = assert(tonumber(os.getenv("NUPP_LUAJIT_FLOOR")))
            local rolling = jit.version:match("^LuaJIT 2%.1%.(%d+)")
            assert(rolling, "expected LuaJIT 2.1 rolling, got " .. jit.version)
            assert(tonumber(rolling) >= floor,
              ("LuaJIT 2.1.%s is below the 2.1.%d floor"):format(rolling, floor))
            print(jit.version)
          '
          echo "$luajit/bin" >> "$GITHUB_PATH"

      - name: Bootstrap the compiler
        shell: bash
        run: ./bin/nupp build

      - name: Install the portable Lua matrix
        if: runner.os == 'Linux'
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y lua5.1 lua5.2 lua5.3 lua5.4

      - name: Run the portable generated-output corpus
        if: runner.os == 'Linux'
        shell: bash
        run: |
          luajit=$(./scripts/toolchain luajit)
          scripts/portable-lua-corpus.sh \
            lua5.1 lua5.2 lua5.3 lua5.4 "$luajit/bin/luajit"

      - name: Build the same library for LuaJIT and Lua 5.1
        if: runner.os == 'Linux'
        shell: bash
        run: scripts/dual-dialect-library.sh lua5.1

      - name: Diagnose a Windows native-library load failure
        if: failure() && runner.os == 'Windows'
        shell: pwsh
        run: |
          Get-ChildItem build/lib
          dumpbin /dependents build/lib/nupp_native_v2_dev.dll

      - name: Install the development rocks
        shell: bash
        run: |
          ./bin/nupp build --target bootstrapCompiler
          ./bin/nupp build --target docs

      # Already answered on Linux by the fast gate, which every path through
      # this graph passes through before reaching here. The other platforms are
      # asked because a checker answer is not promised to be platform-free.
      - name: Check the compiler
        if: runner.os != 'Linux'
        shell: bash
        run: ./bin/nupp check

      # The Windows host ABI is selected through rustup, then shared by the
      # Rust provider, application host, and embedding SDK. Exercise that
      # contract before the expensive native and full-suite gates so a test
      # fixture cannot accidentally model Windows as an invented Unix host.
      #
      # Fail close to provisioning, and name the last case if the Windows
      # loader or native networking layer terminates the test process. Exercise
      # the nested launcher fixtures here too: in the full suite that process is
      # one long-lived shard, so a failure otherwise appears twenty minutes later
      # as many unrelated unrun suites. The broad suite below leaves this group
      # out rather than running it a second time unchanged.
      - name: Run the Windows native and launcher preflight
        if: runner.os == 'Windows'
        shell: bash
        env:
          NUPP_TEST_TRACE_CASES: 1
        run: |
          set -euo pipefail
          bash_path=$(command -v bash)
          sh_path=$(dirname "$bash_path")/sh.exe
          test -f "$sh_path"
          NUPP_TEST_BASH=$(cygpath -w "$bash_path") \
          NUPP_TEST_SH=$(cygpath -w "$sh_path") \
          ./bin/nupp test --jobs=1 --group=windows-preflight

      # Name the Rust-native release boundary before the broad suite. This runs
      # each resource owner's stress/cancellation tests, the aggregate C ABI
      # smoke, and C consumers of the executable, static application archive,
      # and static/dynamic embedding SDKs on the retained platform itself.
      - name: Gate the Rust-native platform artifacts
        shell: bash
        run: .github/scripts/test-rust-native-platform.sh

      # Keep the external corpus and the C importer explicit. A configured
      # corpus used to be absent and silently skipped, while an import-c failure
      # could be buried among thousands of unrelated cases. The broad suite
      # below excludes this group rather than repeating it.
      - name: Run the tl.lua oracle and import-c fixtures
        shell: bash
        run: |
          compiler_root=$PWD
          if command -v cygpath >/dev/null 2>&1; then
            compiler_root=$(cygpath -m "$compiler_root")
          fi
          export NUPP_COMPILER_ROOT="$compiler_root"
          export NUPP_LUA_CORPUS="$compiler_root/.ci-corpus/teal/tl.lua"
          export NUPP_NATIVE_V2_LIBRARY
          NUPP_NATIVE_V2_LIBRARY=$(./scripts/toolchain \
            native-rust base,files,http,net,process,tls,uri,uuid)
          # `tests/run` refuses to start on Windows without these, the same way
          # the whole-suite step below names them. This step reaches the runner
          # directly rather than through `nupp test`, so it has to name them
          # too, or the Windows job ends here having run no test at all.
          if [ "$RUNNER_OS" = Windows ]; then
            bash_path=$(command -v bash)
            sh_path=$(dirname "$bash_path")/sh.exe
            test -f "$sh_path"
            export NUPP_TEST_BASH NUPP_TEST_SH
            NUPP_TEST_BASH=$(cygpath -w "$bash_path")
            NUPP_TEST_SH=$(cygpath -w "$sh_path")
          fi
          ./bin/nupp build --target testRunner
          ./tests/run --jobs=1 --group=external-corpus

      # The AOT lane body is written in compiler vector extensions, and what a
      # select, a mask lane and a horizontal test lower to is completely
      # different on NEON, SSE2 and AVX2. Every measurement and every
      # differential before this ran on one architecture, so this is the first
      # time the lowering is executed anywhere else. It needs only a built
      # compiler and a C compiler, so it runs here rather than only where a host
      # LuaJIT is set up.
      #
      # Deliberately before the suite. It does not depend on the suite passing,
      # and a step placed after one that is red for an unrelated reason is a step
      # that never runs -- which is what happened the first time this landed.
      - name: Compare the AOT lane and scalar bodies
        shell: bash
        run: bench/kernel-subset-spike/crosscheck.sh

      # The step above targets the tier a gang fits -- AVX on x86-64, where a
      # 32-byte vector is one register. This one adds the rest of v3, because a
      # feature tier changes which instructions the same vector operations lower
      # to and passing one says nothing about another.
      - name: Compare them again at the full v3 feature tier
        if: runner.os == 'Linux'
        shell: bash
        env:
          NUPP_CHECK_CFLAGS: -march=x86-64-v3
        run: bench/kernel-subset-spike/crosscheck.sh

      # And at the x86-64 baseline, which is what a build gets when nothing asked
      # for a wider tier -- the 16-byte gangs, compiled for plain SSE2. This is
      # the combination most users get, so it is the one least worth inferring
      # from the others.
      - name: Compare them at the x86-64 baseline
        if: runner.os == 'Linux'
        shell: bash
        env:
          NUPP_CHECK_GANG_FEATURES: baseline
          NUPP_CHECK_CFLAGS: " "
        run: bench/kernel-subset-spike/crosscheck.sh

      # No hosted runner promises AVX-512. Compile the mixed-width differential
      # at that tier without executing it, so the 64-byte vector ABI and every
      # helper call are still held warning-clean by the same -Werror boundary.
      - name: Compile the eight-lane mixed gang at AVX-512
        if: runner.os == 'Linux'
        shell: bash
        env:
          NUPP_CHECK_KERNELS: mixedwidth
          NUPP_CHECK_GANG_FEATURES: avx512f
          NUPP_CHECK_CFLAGS: -mavx512f
          NUPP_CHECK_COMPILE_ONLY: 1
        run: bench/kernel-subset-spike/crosscheck.sh

      # Windows is a supported target for this backend and MSVC is not a
      # supported compiler for it: the generated C needs `vector_size` and
      # `__builtin_convertvector`, which Clang and MinGW GCC have and MSVC has
      # neither of. Nothing about that is Windows-specific, so the way to know it
      # holds is to run the same differential there rather than to reason about
      # it -- which is what this job did not do while Windows was skipped.
      - name: Name the C compiler this Windows runner offers
        if: runner.os == 'Windows'
        shell: bash
        run: |
          for candidate in clang gcc cc; do
            if command -v "$candidate" >/dev/null 2>&1; then
              echo "$candidate: $("$candidate" --version 2>&1 | head -1)"
            else
              echo "$candidate: absent"
            fi
          done

      # Everything so far has been compiled by Clang. `aot=require` will hand
      # the generated C to whatever compiler the user has, so if GCC does not
      # accept it that is better known now than at the point it compiles for
      # someone. The generated C uses `vector_size` and `__builtin_convertvector`
      # and nothing else either compiler lacks.
      - name: Compare them again through GCC
        if: runner.os == 'Linux'
        shell: bash
        env:
          NUPP_NATIVE_CC: gcc
        run: bench/kernel-subset-spike/crosscheck.sh

      # The suite's own `aot = "require"` tests take whichever compiler the
      # runner offers first, which is Clang. Running them again under GCC checks
      # the version parsing, the dialect flags and `-Werror` against the other
      # compiler a user is likely to have. This is the one repetition that is
      # not repetition: the compiler being different is the thing under test.
      - name: Build and load an aot = "require" project through GCC
        if: runner.os == 'Linux'
        shell: bash
        env:
          NUPP_NATIVE_CC: gcc
        run: ./bin/nupp test --jobs=1 --shard=aotbuildtest

      # Serialized when the comptime worker's deadline was 2000 ms and parallel
      # shards pushed past it; that deadline is 10000 ms now, chosen with
      # headroom for exactly this contention. Serialized again when the first
      # attempt at this showed `coveragetest` and `aotbuildtest` racing whatever
      # else was building -- which the runner now runs alone. The runner
      # defaults to two shards per core.
      #
      # `--exclude-group` names what earlier steps in this job already ran. The
      # shared lane is excluded on Linux only, where the fast gate this job
      # depends on has already run it against the same revision.
      - name: Run the compiler suite
        if: runner.os != 'Windows'
        shell: bash
        # `core_pattern` already pipes to systemd-coredump on this image, but
        # the soft limit is zero, so the kernel writes nothing and the shell
        # still says "core dumped". Raising it here is what makes the step
        # below able to ask a crashed worker anything at all.
        run: |
          set -euo pipefail
          ulimit -c unlimited || true
          lane=""
          if [ "$RUNNER_OS" = Linux ]; then
            lane="--lane=isolated"
          fi
          ./bin/nupp test $lane --exclude-group=external-corpus

      # A worker killed by a signal says which suite it was in, and on Linux it
      # is killed by SIGSEGV in a different set of suites every run -- so the
      # name says where it was, not what went wrong. The core says that.
      # Retrieved through `coredumpctl` because `core_pattern` hands cores to
      # systemd rather than leaving them in a directory. Only runs when the
      # step above failed, and never fails the job itself: this reports on a
      # failure, it is not one.
      - name: Report a crashed worker
        if: failure() && runner.os == 'Linux'
        continue-on-error: true
        shell: bash
        run: |
          set -uo pipefail
          echo "core_pattern: $(cat /proc/sys/kernel/core_pattern 2>/dev/null)"
          coredumpctl list --no-pager 2>&1 | tail -12 || true
          command -v gdb >/dev/null 2>&1 \
            || sudo apt-get install -y -q gdb >/dev/null 2>&1 || true
          for pid in $(coredumpctl list --no-pager --no-legend 2>/dev/null \
              | awk '$NF ~ /present/ || $0 ~ /luajit|nupp/ {print $5}' | tail -3); do
            echo "=== core for pid $pid ==="
            coredumpctl info "$pid" --no-pager 2>&1 | head -30
            coredumpctl debug "$pid" --debugger=gdb \
              --debugger-arguments='-batch -q -ex "thread apply all bt 25"' \
              2>&1 | head -60
          done
          exit 0

      - name: Collect Windows worker crash dumps
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $dumpDirectory = Join-Path $env:RUNNER_TEMP 'nupp-worker-dumps'
          New-Item -ItemType Directory -Force $dumpDirectory | Out-Null
          foreach ($application in @('luajit.exe', 'nupp-test.exe')) {
            $key = "HKLM:\SOFTWARE\Microsoft\Windows\Windows Error Reporting\LocalDumps\$application"
            New-Item -Force $key | Out-Null
            New-ItemProperty -Path $key -Name DumpFolder -PropertyType ExpandString -Value $dumpDirectory -Force | Out-Null
            New-ItemProperty -Path $key -Name DumpType -PropertyType DWord -Value 1 -Force | Out-Null
            New-ItemProperty -Path $key -Name DumpCount -PropertyType DWord -Value 3 -Force | Out-Null
          }

      - name: Run the compiler suite
        if: runner.os == 'Windows'
        shell: bash
        env:
          NUPP_TEST_AOT_TRACE: 1
          NUPP_TEST_AOT_ARTIFACTS: ${{ runner.temp }}/nupp-worker-dumps
        run: |
          set -euo pipefail
          bash_path=$(command -v bash)
          sh_path=$(dirname "$bash_path")/sh.exe
          test -f "$sh_path"
          NUPP_TEST_BASH=$(cygpath -w "$bash_path") \
          NUPP_TEST_SH=$(cygpath -w "$sh_path") \
          ./bin/nupp test \
            --exclude-group=external-corpus,windows-preflight

      - name: Report Windows worker crashes
        if: failure() && runner.os == 'Windows'
        continue-on-error: true
        shell: pwsh
        run: |
          $dumpDirectory = Join-Path $env:RUNNER_TEMP 'nupp-worker-dumps'
          New-Item -ItemType Directory -Force $dumpDirectory | Out-Null
          $events = Get-WinEvent -FilterHashtable @{
            LogName = 'Application'
            Id = 1000, 1001
            StartTime = (Get-Date).AddHours(-2)
          } -ErrorAction SilentlyContinue | Where-Object { $_.Message -match 'luajit|nupp-test' }
          $events | Format-List TimeCreated, Id, Message | Out-String | Tee-Object -FilePath (Join-Path $dumpDirectory 'events.txt')
          $interpreter = (Get-Command luajit).Source
          Copy-Item $interpreter $dumpDirectory
          $runtime = Join-Path (Split-Path $interpreter) 'lua51.dll'
          if (Test-Path $runtime) { Copy-Item $runtime $dumpDirectory }
          foreach ($event in $events) {
            $xml = [xml]$event.ToXml()
            foreach ($entry in $xml.Event.EventData.Data) {
              if ($entry.Name -eq 'ModulePath') {
                $modulePath = [string]$entry.'#text'
                if (($modulePath.StartsWith($env:GITHUB_WORKSPACE) -or $modulePath.StartsWith($env:TEMP)) -and (Test-Path $modulePath -PathType Leaf)) {
                  Copy-Item $modulePath $dumpDirectory -Force
                }
              }
            }
          }
          Get-ChildItem $dumpDirectory | Format-Table Name, Length

      - name: Upload Windows worker crash diagnostics
        if: failure() && runner.os == 'Windows'
        uses: actions/upload-artifact@v4
        with:
          name: windows-worker-crashes
          path: ${{ runner.temp }}/nupp-worker-dumps
          if-no-files-found: ignore
          retention-days: 7

      # Saved whatever the suite concluded. A failing run still measured every
      # suite that ran, and the next run's shard packing is better for having
      # it than for relearning it from nothing.
      - name: Save the recorded suite timings
        if: always()
        uses: actions/cache/save@v4
        with:
          path: build/.nupp-test-times.json
          key: >-
            nupp-test-times-${{ runner.os }}-${{ runner.arch }}-${{ github.sha }}

      # Linux has already saved this key from the fast gate, where the same
      # revision built the same compiler; that save warns and keeps the first
      # entry, which is the right outcome. macOS and Windows have their own
      # key and this is the only job that fills it.
      - name: Save the content-validated compiler cache
        if: always()
        uses: actions/cache/save@v4
        continue-on-error: true
        with:
          path: build/cache
          key: >-
            nupp-buildcache-${{ runner.os }}-${{ runner.arch }}-${{
            hashFiles('src/**', 'nupp.lua', 'scripts/toolchain.pins') }}

  # Byte-identical self-hosting, which is about the compiler's own sources and
  # not about a platform. It was the last step of every matrix entry, where it
  # only ever ran if everything before it was green -- so the one check that
  # says the compiler reproduces itself was the one most often not reached.
  fixpoint:
    name: Self-hosting fixpoint
    needs: [classify, fast-checks]
    if: >-
      !cancelled() && needs.classify.result == 'success'
      && needs.fast-checks.result == 'success'
      && needs.classify.outputs.fixpoint == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Check out the repository
        uses: actions/checkout@v5

      - name: Restore the pinned build tools
        uses: actions/cache@v4
        with:
          path: |
            ${{ runner.temp }}/nupp-ci-tools
            .rocks
          key: >-
            nupp-tools-${{ runner.os }}-${{ runner.arch }}-${{
            hashFiles('scripts/toolchain.pins') }}

      - name: Restore the provisioned toolchain
        uses: actions/cache@v4
        with:
          path: .nupp-cache/toolchain
          key: >-
            nupp-toolchain-${{ runner.os }}-${{ runner.arch }}-${{
            hashFiles('scripts/toolchain.pins', 'scripts/toolchain') }}
          restore-keys: |
            nupp-toolchain-${{ runner.os }}-${{ runner.arch }}-

      - name: Provision the pinned toolchain
        run: ./scripts/toolchain --all

      - name: Verify the self-hosting fixpoint
        run: ./bin/nupp fixpoint

  portable-compiler:
    name: Portable compiler on official Lua 5.1.5
    needs: [classify, fast-checks]
    if: >-
      !cancelled() && needs.classify.result == 'success'
      && needs.fast-checks.result == 'success'
      && needs.classify.outputs.portable-compiler == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out the repository
        uses: actions/checkout@v5

      - name: Restore the pinned build tools
        uses: actions/cache@v4
        with:
          path: |
            ${{ runner.temp }}/nupp-ci-tools
            .rocks
          key: >-
            nupp-tools-${{ runner.os }}-${{ runner.arch }}-${{
            hashFiles('scripts/toolchain.pins') }}

      - name: Restore the provisioned toolchain
        uses: actions/cache@v4
        with:
          path: .nupp-cache/toolchain
          key: >-
            nupp-toolchain-${{ runner.os }}-${{ runner.arch }}-${{
            hashFiles('scripts/toolchain.pins', 'scripts/toolchain') }}
          restore-keys: |
            nupp-toolchain-${{ runner.os }}-${{ runner.arch }}-

      - name: Provision the pinned toolchain
        shell: bash
        run: ./scripts/toolchain --all

      - name: Bootstrap the compiler
        shell: bash
        run: ./bin/nupp build

      # The Wasm acceptance workflow is path-filtered, but a checker or
      # optimizer change anywhere in the compiler can invalidate source shown
      # on the homepage. Keep the menu corpus here, using the same strict,
      # optimized Lua 5.1 settings as the playground Worker.
      - name: Compile every homepage playground example
        shell: bash
        run: >-
          ./bin/nupp build --strict --dialect lua51 -O1
          -o build/ci-playground-examples
          editors/playground/src/examples/*.nupp

      - name: Run the portable compiler in the six-library host
        shell: bash
        run: .github/scripts/test-portable-compiler.sh

  # Documentation generation, its links, and the generated assets a site build
  # produces. This is the whole obligation of a documentation-only change: it
  # provisions no platform matrix, no native toolchain and no GPU adapter.
  docs-site:
    name: Documentation and site
    needs: classify
    if: needs.classify.outputs.docs-site == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out the repository
        uses: actions/checkout@v5

      - name: Restore the pinned build tools
        uses: actions/cache@v4
        with:
          path: |
            ${{ runner.temp }}/nupp-ci-tools
            .rocks
          key: >-
            nupp-tools-${{ runner.os }}-${{ runner.arch }}-${{
            hashFiles('scripts/toolchain.pins') }}

      - name: Restore the provisioned toolchain
        uses: actions/cache@v4
        with:
          path: .nupp-cache/toolchain
          key: >-
            nupp-toolchain-${{ runner.os }}-${{ runner.arch }}-${{
            hashFiles('scripts/toolchain.pins', 'scripts/toolchain') }}
          restore-keys: |
            nupp-toolchain-${{ runner.os }}-${{ runner.arch }}-

      - name: Provision the pinned toolchain
        run: ./scripts/toolchain --all

      - name: Bootstrap the compiler
        run: ./bin/nupp build

      - name: Install the development rocks
        run: |
          ./bin/nupp build --target bootstrapCompiler
          ./bin/nupp build --target docs

      - name: Regenerate and verify the documentation
        run: ./bin/nupp test --group=docs

  # Emscripten, a Node parity run, the Lua 5.1 Wasm AOT fixtures, the browser
  # templates in Chromium, and the generated Pages artifact. Called rather than
  # path-filtered: the sixty-line list of paths that used to bring it into a
  # pull request was maintained by hand, and a new source file reaching the
  # playground was simply not on it.
  browser-wasm:
    name: Browser and Wasm
    needs: [classify, fast-checks]
    if: >-
      !cancelled() && needs.classify.result == 'success'
      && needs.fast-checks.result == 'success'
      && needs.classify.outputs.browser-wasm == 'true'
    uses: ./.github/workflows/wasm-playground.yml

  gpu-conformance:
    name: GPU conformance / CI Lavapipe Vulkan
    needs: classify
    if: needs.classify.outputs.gpu-linux == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out the repository
        uses: actions/checkout@v5

      - name: Restore the provisioned toolchain
        uses: actions/cache@v4
        with:
          path: .nupp-cache/toolchain
          key: >-
            nupp-toolchain-${{ runner.os }}-${{ runner.arch }}-${{
            hashFiles('scripts/toolchain.pins', 'scripts/toolchain') }}
          restore-keys: |
            nupp-toolchain-${{ runner.os }}-${{ runner.arch }}-

      # One identity for the Rust artifacts, shared by every job that builds
      # them: the lock file, the toolchain file and the native sources. The
      # feature sets differ between the GPU jobs and the platform gate, and the
      # store is content-addressed, so a job that asked for a different set
      # rebuilds what it needs and reuses the rest rather than starting empty.
      - name: Restore the Rust build outputs
        uses: actions/cache@v4
        with:
          path: build/rust
          key: >-
            nupp-rust-${{ runner.os }}-${{ runner.arch }}-${{
            hashFiles('Cargo.lock', 'Cargo.toml', 'rust-toolchain.toml',
            'native/**/Cargo.toml', 'native/**/*.rs', 'native/**/*.c',
            'native/**/*.h') }}
          restore-keys: |
            nupp-rust-${{ runner.os }}-${{ runner.arch }}-

      - name: Install the software Vulkan adapter
        run: |
          sudo apt-get update
          sudo apt-get install -y libvulkan1 mesa-vulkan-drivers
          icd=$(find /usr/share/vulkan/icd.d -name 'lvp_icd*.json' -type f | head -n 1)
          test -n "$icd"
          printf 'NUPP_GPU_ICD=%s\n' "$icd" >> "$GITHUB_ENV"

      - name: Provision the compiler
        run: ./scripts/toolchain --all

      - name: Run exact GPU dispatch and readback
        id: gpu_conformance
        continue-on-error: true
        run: .github/scripts/test-gpu-conformance.sh

      # A failed conformance step would otherwise skip actions/cache's post
      # save the toolchain for every diagnostic commit. Preserve the expensive
      # compiler build before turning the captured outcome back
      # into the job's verdict.
      - name: Save a failed conformance build
        if: steps.gpu_conformance.outcome == 'failure'
        uses: actions/cache/save@v4
        continue-on-error: true
        with:
          path: build/rust
          key: >-
            nupp-rust-${{ runner.os }}-${{ runner.arch }}-${{
            hashFiles('Cargo.lock', 'Cargo.toml', 'rust-toolchain.toml',
            'native/**/Cargo.toml', 'native/**/*.rs', 'native/**/*.c',
            'native/**/*.h') }}

      - name: Report GPU conformance failure
        if: steps.gpu_conformance.outcome == 'failure'
        run: exit 1

  gpu-conformance-windows:
    name: GPU conformance / Windows DX12
    needs: classify
    if: needs.classify.outputs.gpu-windows == 'true'
    runs-on: windows-2022
    timeout-minutes: 45
    steps:
      - name: Check out the repository
        uses: actions/checkout@v5

      - name: Restore the provisioned toolchain
        uses: actions/cache@v4
        with:
          path: .nupp-cache/toolchain
          key: >-
            nupp-toolchain-${{ runner.os }}-${{ runner.arch }}-${{
            hashFiles('scripts/toolchain.pins', 'scripts/toolchain') }}
          restore-keys: |
            nupp-toolchain-${{ runner.os }}-${{ runner.arch }}-

      # One identity for the Rust artifacts, shared by every job that builds
      # them: the lock file, the toolchain file and the native sources. The
      # feature sets differ between the GPU jobs and the platform gate, and the
      # store is content-addressed, so a job that asked for a different set
      # rebuilds what it needs and reuses the rest rather than starting empty.
      - name: Restore the Rust build outputs
        uses: actions/cache@v4
        with:
          path: build/rust
          key: >-
            nupp-rust-${{ runner.os }}-${{ runner.arch }}-${{
            hashFiles('Cargo.lock', 'Cargo.toml', 'rust-toolchain.toml',
            'native/**/Cargo.toml', 'native/**/*.rs', 'native/**/*.c',
            'native/**/*.h') }}
          restore-keys: |
            nupp-rust-${{ runner.os }}-${{ runner.arch }}-

      - name: Install the ABI-compatible Windows Rust toolchain
        shell: bash
        run: |
          channel=$(sed -n 's/^channel = "\([^"]*\)"$/\1/p' rust-toolchain.toml)
          rustup toolchain install "${channel}-x86_64-pc-windows-gnu" --profile minimal

      - name: Provision the pinned toolchain
        shell: bash
        run: ./scripts/toolchain --all

      # Adapter absence is a failure: Vulkan cannot silently substitute for
      # the retained Windows DX12 contract.
      - name: Run exact DX12 dispatch and readback
        id: gpu_conformance
        shell: bash
        run: .github/scripts/test-gpu-conformance-windows.sh

  # The one status a ruleset should require. Its meaning does not change when
  # the jobs above are reorganized, renamed, or split, and it cannot pass by a
  # job being skipped: a job the classifier selected and that did not succeed
  # fails this, and so does a classification that failed to happen at all.
  required-ci:
    name: required-ci
    if: always()
    needs:
      - classify
      - fast-checks
      - integration
      - fixpoint
      - portable-compiler
      - browser-wasm
      - docs-site
      - gpu-conformance
      - gpu-conformance-windows
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    # The run's queue delay and its per-job durations are only on the API, and
    # a workflow cannot read its own run without being told it may.
    permissions:
      contents: read
      actions: read
    steps:
      - name: Check out the repository
        uses: actions/checkout@v5

      - name: Require every selected job to have succeeded
        env:
          NEEDS: ${{ toJSON(needs) }}
          SELECTION: ${{ needs.classify.outputs.selection }}
        run: .github/scripts/require-selected-jobs.py

      # One row per required run, so queue delay, execution time and the failed
      # step are answerable from retained data rather than from whichever run
      # somebody happens to still have open.
      - name: Record the run
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          SELECTION: ${{ needs.classify.outputs.selection }}
        run: .github/scripts/record-required-run.sh

      - name: Upload the run record
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: required-ci-record-${{ github.run_id }}-${{ github.run_attempt }}
          path: build/ci-record
          if-no-files-found: warn
          retention-days: 90
