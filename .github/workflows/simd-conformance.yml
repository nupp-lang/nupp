name: SIMD execution conformance

on:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

jobs:
  platforms:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      targets: ${{ steps.targets.outputs.targets }}
      wasm: ${{ steps.targets.outputs.wasm }}
    steps:
      - uses: actions/checkout@v5
      - id: targets
        run: |
          python3 - <<'PY' >> "$GITHUB_OUTPUT"
          import json
          print("targets=" + json.dumps(json.load(open(".github/simd-platforms.json"))))
          print("wasm=" + json.dumps(json.load(open(".github/simd-wasm-shards.json"))))
          PY

  execute:
    name: ${{ matrix.target.name }} / ${{ matrix.compiler }} / ${{ matrix.target.tier }}
    needs: platforms
    runs-on: ${{ matrix.target.os }}
    timeout-minutes: 150
    strategy:
      fail-fast: false
      matrix:
        target: ${{ fromJSON(needs.platforms.outputs.targets) }}
        compiler: [clang, gcc]
    steps:
      - name: Check out the repository
        uses: actions/checkout@v5

      - name: Restore the provisioned toolchain
        uses: actions/cache@v4
        with:
          path: .nupp-cache/toolchain
          key: >-
            nupp-toolchain-${{ runner.os }}-${{ runner.arch }}-${{
            hashFiles('scripts/toolchain.pins', 'scripts/toolchain') }}
          restore-keys: |
            nupp-toolchain-${{ runner.os }}-${{ runner.arch }}-

      - name: Restore the content-validated compiler cache
        uses: actions/cache/restore@v4
        with:
          path: build/cache
          key: >-
            nupp-buildcache-${{ runner.os }}-${{ runner.arch }}-${{
            hashFiles('src/**', 'nupp.lua', 'scripts/toolchain.pins') }}
          restore-keys: |
            nupp-buildcache-${{ runner.os }}-${{ runner.arch }}-

      - name: Install the ABI-compatible Windows Rust toolchain
        if: runner.os == 'Windows'
        shell: bash
        run: |
          channel=$(sed -n 's/^channel = "\([^"]*\)"$/\1/p' rust-toolchain.toml)
          rustup toolchain install "${channel}-x86_64-pc-windows-gnu" --profile minimal

      - name: Provision the pinned toolchain
        shell: bash
        run: ./scripts/toolchain --all

      - name: Select the real compiler dialect
        shell: bash
        env:
          NUPP_SIMD_COMPILER_FAMILY: ${{ matrix.compiler }}
        run: .github/scripts/prepare-simd-compilers.sh

      - name: Execute the full shared SIMD corpus at this tier
        shell: bash
        env:
          NUPP_SIMD_TIERS: ${{ matrix.target.tier }}
        run: tests/simd/run-matrix.sh

      # Keep the source, executable identities and actual execution proof. Object
      # files and rebuildable compiler caches add volume without new evidence.
      - name: Retain execution or unavailable-hardware evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: simd-${{ matrix.target.artifact }}-${{ matrix.compiler }}-${{ matrix.target.tier }}-${{ github.sha }}
          path: |
            build/simd-matrix/**/*.json
            build/simd-matrix/**/*.log
            build/simd-matrix/**/*.txt
            build/simd-matrix/**/*.tsv
            build/simd-matrix/**/*.sha256
            build/simd-matrix/**/*.nupp
            build/simd-matrix/**/*.lua
            build/simd-matrix/**/*.c
            build/simd-matrix/**/*.so
            build/simd-matrix/**/*.dylib
            build/simd-matrix/**/*.dll
          if-no-files-found: warn
          retention-days: 7

  wasm:
    name: Wasm / ${{ matrix.shard.element }} / ${{ matrix.shard.batch }}
    needs: platforms
    runs-on: ubuntu-24.04
    timeout-minutes: 150
    strategy:
      fail-fast: false
      matrix:
        shard: ${{ fromJSON(needs.platforms.outputs.wasm) }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: emscripten-core/setup-emsdk@v15
        with:
          version: 6.0.8
          actions-cache-folder: emsdk-cache
      - uses: actions/cache@v4
        with:
          path: .nupp-cache/toolchain
          key: >-
            nupp-toolchain-${{ runner.os }}-${{ runner.arch }}-${{
            hashFiles('scripts/toolchain.pins', 'scripts/toolchain') }}
          restore-keys: |
            nupp-toolchain-${{ runner.os }}-${{ runner.arch }}-
      - uses: actions/cache/restore@v4
        with:
          path: build/cache
          key: >-
            nupp-buildcache-${{ runner.os }}-${{ runner.arch }}-${{
            hashFiles('src/**', 'nupp.lua', 'scripts/toolchain.pins') }}
          restore-keys: |
            nupp-buildcache-${{ runner.os }}-${{ runner.arch }}-
      - name: Provision the pinned toolchain
        run: ./scripts/toolchain --all
      - name: Fetch verified Lua 5.1.5 sources
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/nupp-portable-compiler"
          archive="$RUNNER_TEMP/nupp-portable-compiler/lua-5.1.5.tar.gz"
          curl -fsSL https://www.lua.org/ftp/lua-5.1.5.tar.gz -o "$archive"
          printf '%s  %s\n' \
            2640fc56a795f29d28ef15e13c34a47e223960b0240e8cb0a82d9b0738695333 \
            "$archive" | sha256sum -c -
          tar -xzf "$archive" -C "$RUNNER_TEMP/nupp-portable-compiler"
      - name: Execute identical SIMD128 and scalar-C corpora
        env:
          NUPP_SIMD_TYPES: ${{ matrix.shard.element }}
          NUPP_SIMD_LANES: ${{ matrix.shard.lanes }}
        run: tests/simd/run-wasm.sh
      - name: Retain both execution routes
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: simd-wasm-shard-${{ matrix.shard.element }}-${{ matrix.shard.batch }}-${{ github.sha }}
          path: |
            build/simd-wasm/**/*.json
            build/simd-wasm/**/*.log
            build/simd-wasm/**/*.txt
            build/simd-wasm/**/*.nupp
            build/simd-wasm/**/*.lua
            build/simd-wasm/**/*.c
            build/simd-wasm/**/*.mjs
            build/simd-wasm/**/*.wasm
          if-no-files-found: warn
          retention-days: 7

  wasm-complete:
    name: Complete Wasm inventory
    needs: wasm
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v4
        with:
          pattern: simd-wasm-shard-*-${{ github.sha }}
          path: build/simd-wasm-shards
      - name: Verify every type and legal width executed on both routes
        run: node tests/simd/aggregate-wasm.mjs build/simd-wasm-shards .github/simd-wasm-shards.json "${{ github.sha }}"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: simd-wasm-complete-${{ github.sha }}
          path: build/simd-wasm-shards/full-summary.json
          if-no-files-found: warn
          retention-days: 7
