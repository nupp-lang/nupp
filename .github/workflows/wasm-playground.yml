name: Test LuaJIT browser

# Which changes reach this is decided by `.github/scripts/classify-changes.lua`
# and expressed by the `browser-wasm` job of the Compiler matrix. The reusable
# guest workflow owns the runtime, archive, browser and packaged-app matrix.
on:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

jobs:
  candidate:
    uses: ./.github/workflows/browser-guest.yml
