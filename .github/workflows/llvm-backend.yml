name: LLVM backend

# The AOT suites through the LLVM backend (`NUPP_AOT_BACKEND=llvm`), which the
# compiler matrix does not select until the C lowering is gone. The pinned LLVM
# comes from .github/actions/pinned-llvm, which builds it once per pin and
# platform and keeps it.

# Each run costs hours of runner time, most of it building LLVM when its cache
# was evicted, so a push runs it only when its commit message says
# `[llvm ci]`; otherwise every job is skipped.
on:
  push:
  workflow_dispatch:

# Reading and storing the pinned LLVM artifact.
permissions:
  contents: read
  actions: read

# Queued rather than cancelled: a cancelled cold run never saves the LLVM it
# spent an hour building. GitHub keeps only the newest pending run.
concurrency:
  group: llvm-backend-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # Each platform's link kit, built where that platform's libraries are. The
  # LLVM legs link programs for the other platform with it. A kit needs no LLVM.
  kits:
    name: ${{ matrix.name }} link kit
    if: ${{ github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[llvm ci]') }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS arm64
            os: macos-15
            platform: aarch64-apple-darwin
          - name: Linux x64
            os: ubuntu-24.04
            platform: x86_64-unknown-linux-gnu
    steps:
      - name: Check out the repository
        uses: actions/checkout@v5

      - name: Restore the provisioned toolchain
        uses: actions/cache/restore@v4
        with:
          path: .nupp-cache/toolchain
          key: >-
            nupp-toolchain-${{ runner.os }}-${{ runner.arch }}-${{
            hashFiles('scripts/toolchain.pins', 'scripts/toolchain') }}
          restore-keys: |
            nupp-toolchain-${{ runner.os }}-${{ runner.arch }}-

      - name: Build the link kit archive
        shell: bash
        run: ./scripts/toolchain kit-archive "" "$RUNNER_TEMP/kit-${{ matrix.platform }}.tar.gz"

      - name: Upload the link kit
        uses: actions/upload-artifact@v4
        with:
          name: kit-${{ matrix.platform }}
          path: ${{ runner.temp }}/kit-${{ matrix.platform }}.tar.gz
          if-no-files-found: error

  llvm:
    name: ${{ matrix.name }} / LLVM route
    needs: kits
    # A kit that failed to build fails the cross step, not the suites; a kit
    # job skipped because the run was not asked for skips this too.
    if: ${{ !cancelled() && needs.kits.result != 'skipped' }}
    runs-on: ${{ matrix.os }}
    # A cold runner builds LLVM before any suite runs.
    timeout-minutes: 300
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS arm64
            os: macos-15
            cross: x86_64-unknown-linux-gnu
          - name: Linux x64
            os: ubuntu-24.04
            cross: aarch64-apple-darwin
          - name: Windows x64
            os: windows-2022
            cross: ''
    steps:
      - name: Check out the repository
        uses: actions/checkout@v5

      - name: Restore the pinned build tools
        uses: actions/cache/restore@v4
        with:
          path: |
            ${{ runner.temp }}/nupp-ci-tools
            .rocks
          key: >-
            nupp-tools-${{ runner.os }}-${{ runner.arch }}-${{
            hashFiles('scripts/toolchain.pins') }}

      - name: Restore the provisioned toolchain
        uses: actions/cache/restore@v4
        with:
          path: .nupp-cache/toolchain
          key: >-
            nupp-toolchain-${{ runner.os }}-${{ runner.arch }}-${{
            hashFiles('scripts/toolchain.pins', 'scripts/toolchain') }}
          restore-keys: |
            nupp-toolchain-${{ runner.os }}-${{ runner.arch }}-

      - name: Install the ABI-compatible Windows Rust toolchain
        if: runner.os == 'Windows'
        shell: bash
        run: |
          channel=$(sed -n 's/^channel = "\([^"]*\)"$/\1/p' rust-toolchain.toml)
          rustup toolchain install "${channel}-x86_64-pc-windows-gnu" --profile minimal

      # After the toolchain, so this LLVM wins over whatever an older
      # toolchain cache entry carried.
      - name: Fetch or build the pinned LLVM
        uses: ./.github/actions/pinned-llvm

      - name: Provision the pinned toolchain
        shell: bash
        run: ./scripts/toolchain --all

      - name: Bootstrap the compiler
        shell: bash
        run: ./bin/nupp build

      - name: Install the development rocks
        shell: bash
        run: ./bin/nupp build --target bootstrapCompiler

      # The test runner refuses to start on Windows without naming Git Bash.
      - name: Name Git Bash for the test runner
        if: runner.os == 'Windows'
        shell: bash
        run: |
          bash_path=$(command -v bash)
          echo "NUPP_TEST_BASH=$(cygpath -w "$bash_path")" >> "$GITHUB_ENV"
          echo "NUPP_TEST_SH=$(cygpath -w "$(dirname "$bash_path")/sh.exe")" >> "$GITHUB_ENV"

      - name: Run the AOT suites through LLVM
        env:
          NUPP_AOT_BACKEND: llvm
        shell: bash
        run: ./bin/nupp test --group=aot

      # A crash in an isolated piece reports no case. Rerun the suite a case at
      # a time under gdb so the one that crashes is named, with its backtrace.
      - name: Name the AOT case that crashed
        if: failure() && runner.os == 'Linux'
        shell: bash
        env:
          NUPP_AOT_BACKEND: llvm
        run: |
          set +e
          sudo apt-get install -y gdb > /dev/null 2>&1
          . ./scripts/luajit.sh
          select_luajit "$PWD"
          ulimit -c 0
          for name in $(sed -n 's/^function M\.\([A-Za-z0-9_]*\)(.*/\1/p' tests/aotbuildtest.lua); do
            timeout 600 luajit tests/run.lua --case="aotbuildtest/$name" > /tmp/case.log 2>&1
            status=$?
            if [ "$status" -ge 128 ] && [ "$status" -ne 124 ]; then
              echo "::group::crash in $name (status $status)"
              tail -20 /tmp/case.log
              gdb -batch -ex run -ex bt -ex 'info sharedlibrary' \
                --args luajit tests/run.lua --case="aotbuildtest/$name" 2>&1 | tail -80
              echo "::endgroup::"
            fi
          done
          exit 1

      - name: Run the standalone and static suites through LLVM
        env:
          NUPP_AOT_BACKEND: llvm
        shell: bash
        run: ./bin/nupp test projecttest hostembeddingtest aotincrementaltest

      - name: Run the SIMD differentials through LLVM
        env:
          NUPP_AOT_BACKEND: llvm
        shell: bash
        run: >-
          ./bin/nupp test simdprimitivedifferentialtest simdnativealgorithmdifferentialtest
          simdreducerdifferentialtest

      # Wasm through nupp alone: no Emscripten on this runner is asked for.
      - name: Run the Wasm SIMD suites through LLVM
        env:
          NUPP_AOT_BACKEND: llvm
        shell: bash
        run: ./bin/nupp test simdwasmtimeconformancetest simdwasmalgorithmdifferentialtest

      # Whatever the suites said, so a suite failure does not hide whether
      # the other platform's program links and runs.
      - name: Download the other platform's link kit
        if: ${{ !cancelled() && matrix.cross != '' }}
        uses: actions/download-artifact@v4
        with:
          name: kit-${{ matrix.cross }}
          path: ${{ runner.temp }}/kit-archive

      - name: Link a standalone AOT program for ${{ matrix.cross }}
        if: ${{ !cancelled() && matrix.cross != '' }}
        env:
          NUPP_AOT_BACKEND: llvm
        shell: bash
        run: |
          kit="$RUNNER_TEMP/kit"
          mkdir -p "$kit"
          tar -xzf "$RUNNER_TEMP/kit-archive/kit-${{ matrix.cross }}.tar.gz" -C "$kit"
          cd tests/fixtures/cross-aot
          NUPP_KIT_DIR="$kit" ../../../bin/nupp build --platform "${{ matrix.cross }}"
          mkdir -p "$RUNNER_TEMP/cross"
          cp "build/default/${{ matrix.cross }}/default" "$RUNNER_TEMP/cross/program"

      - name: Upload the program for ${{ matrix.cross }}
        if: ${{ !cancelled() && matrix.cross != '' }}
        uses: actions/upload-artifact@v4
        with:
          name: cross-program-${{ matrix.cross }}
          path: ${{ runner.temp }}/cross/program
          if-no-files-found: error

  # Each program runs where it was linked for, not where it was linked.
  cross-run:
    name: Run the ${{ matrix.name }} program linked elsewhere
    needs: llvm
    if: ${{ !cancelled() && needs.llvm.result != 'skipped' }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS arm64
            os: macos-15
            platform: aarch64-apple-darwin
          - name: Linux x64
            os: ubuntu-24.04
            platform: x86_64-unknown-linux-gnu
    steps:
      - name: Download the program
        uses: actions/download-artifact@v4
        with:
          name: cross-program-${{ matrix.platform }}
          path: cross

      # Output for an explicit platform is unsigned; a release signs it.
      - name: Run it
        shell: bash
        run: |
          chmod +x cross/program
          if [ "$RUNNER_OS" = macOS ]; then codesign --force --sign - cross/program; fi
          answer=$(cross/program)
          printf '%s\n' "$answer"
          [ "$answer" = "$(printf '15\t4')" ]
