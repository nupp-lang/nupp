name: Windows AOT diagnosis

# Temporary: the Windows compiler suite stops making progress once AOT code is
# compiled by LLVM, and the runner prints nothing until the end. Each suite that
# builds AOT code runs alone here under a bound, and a suite that exceeds it is
# run a case at a time so the one that hangs is named. Runs only when this file
# changes; delete it once the hang is found.
on:
  push:
    paths:
      - '.github/workflows/windows-aot-diagnosis.yml'

permissions:
  contents: read
  actions: read

jobs:
  diagnose:
    name: Windows x64 / AOT suites one at a time
    runs-on: windows-2022
    timeout-minutes: 60
    steps:
      - name: Check out the repository
        uses: actions/checkout@v5

      - name: Restore the pinned build tools
        uses: actions/cache/restore@v4
        with:
          path: |
            ${{ runner.temp }}/nupp-ci-tools
            .rocks
          key: >-
            nupp-tools-${{ runner.os }}-${{ runner.arch }}-${{
            hashFiles('scripts/toolchain.pins') }}

      - name: Restore the provisioned toolchain
        uses: actions/cache/restore@v4
        with:
          path: .nupp-cache/toolchain
          key: >-
            nupp-toolchain-${{ runner.os }}-${{ runner.arch }}-${{
            hashFiles('scripts/toolchain.pins', 'scripts/toolchain') }}
          restore-keys: |
            nupp-toolchain-${{ runner.os }}-${{ runner.arch }}-

      - name: Install the ABI-compatible Windows Rust toolchain
        shell: bash
        run: |
          channel=$(sed -n 's/^channel = "\([^"]*\)"$/\1/p' rust-toolchain.toml)
          rustup toolchain install "${channel}-x86_64-pc-windows-gnu" --profile minimal

      - name: Fetch or build the pinned LLVM
        uses: ./.github/actions/pinned-llvm

      - name: Provision the pinned toolchain
        shell: bash
        env:
          NUPP_REQUIRE_CODEGEN: '1'
        run: ./scripts/toolchain --all

      - name: Bootstrap the compiler
        shell: bash
        run: ./bin/nupp build

      - name: Install the development rocks
        shell: bash
        run: ./bin/nupp build --target bootstrapCompiler

      # #71: an i686 browser-guest build does not finish here. Its compile and
      # link in one process, each announced, bounded, so the log names the one
      # that stops -- or shows the process not exiting after both.
      - name: Compile and link the i686 runtime, step by step
        shell: bash
        run: |
          set +e
          export NUPP_PROBE_OUT="$RUNNER_TEMP/i686"
          mkdir -p "$NUPP_PROBE_OUT"
          timeout -k 15 240 ./bin/nupp run .github/scripts/diagnose-i686-link.lua
          echo "exit status $?"

      # Windows AOT suites run far longer than elsewhere. Where one small
      # build's time goes, cold and then unchanged.
      - name: Time one AOT build's phases
        shell: bash
        run: |
          set +e
          work="$RUNNER_TEMP/timed"
          mkdir -p "$work/src"
          printf '%s\n' 'return {include = {"src"}, build = {targets = {native = {kind = "modules",' \
            '    entries = {"kernel"}, outDir = "build/native", aot = "require"}}}}' > "$work/nupp.lua"
          printf '%s\n' 'local span = require("nupp.mem.span")' '@aot' \
            'local function scale(exclusive out: span.WriteSpan<number>, borrows a: span.Span<number>): nil' \
            '    assert(#out == #a)' '    for i = 1, #out do' '        out[i] = a[i] * 2' '    end' 'end' \
            'return {scale = scale}' > "$work/src/kernel.nupp"
          cd "$work"
          for run in cold warm; do
            start=$(date +%s%N)
            timeout -k 15 300 "$GITHUB_WORKSPACE/bin/nupp" build --json > "$RUNNER_TEMP/timed-$run.json" 2>"$RUNNER_TEMP/timed-$run.err"
            status=$?
            echo "== $run: status $status after $(( ($(date +%s%N) - start) / 1000000 ))ms"
            luajit -e '
              local text = io.open(arg[1]):read("*a")
              for name, ms in text:gmatch([["name":"([^"]+)","durationMs":([%d.]+)]]) do
                if tonumber(ms) > 200 then print(("  %-16s %8.0f ms"):format(name, tonumber(ms))) end
              end
              print("  total", text:match([["totalMs":([%d.]+)]]))' "$RUNNER_TEMP/timed-$run.json" 2>/dev/null \
              || head -c 600 "$RUNNER_TEMP/timed-$run.json"
            tail -3 "$RUNNER_TEMP/timed-$run.err"
          done
          start=$(date +%s%N); "$GITHUB_WORKSPACE/bin/nupp" --version; echo "== nupp --version: $(( ($(date +%s%N) - start) / 1000000 ))ms"

      - name: Run each AOT suite alone, bounded
        shell: bash
        run: |
          set +e
          bash_path=$(command -v bash)
          export NUPP_TEST_BASH NUPP_TEST_SH
          NUPP_TEST_BASH=$(cygpath -w "$bash_path")
          NUPP_TEST_SH=$(cygpath -w "$(dirname "$bash_path")/sh.exe")
          suites="projecttest"
          for suite in $suites; do
            start=$(date +%s)
            timeout -k 15 600 ./bin/nupp test --jobs=1 "$suite" > "$RUNNER_TEMP/$suite.log" 2>&1
            status=$?
            took=$(( $(date +%s) - start ))
            echo "== $suite: status $status after ${took}s: $(grep -E 'tests,' "$RUNNER_TEMP/$suite.log" | tail -1)"
            if [ "$status" -ne 0 ] && [ "$status" -ne 124 ] && [ "$status" -ne 137 ]; then
              sed -n '/^Failures:/,/tests,/p' "$RUNNER_TEMP/$suite.log" | head -80
            fi
            if [ "$status" -eq 124 ] || [ "$status" -eq 137 ]; then
              echo "::group::$suite case by case"
              for case in $(./bin/nupp test "$suite" --list-cases 2>/dev/null | head -3); do
                cstart=$(date +%s)
                timeout -k 15 300 ./bin/nupp test --jobs=1 "$suite" --case="$case" > "$RUNNER_TEMP/case.log" 2>&1
                cstatus=$?
                echo "$case: status $cstatus after $(( $(date +%s) - cstart ))s"
                if [ "$cstatus" -eq 124 ] || [ "$cstatus" -eq 137 ]; then
                  echo "::error::$case hangs"
                  tail -30 "$RUNNER_TEMP/case.log"
                fi
              done
              echo "::endgroup::"
            fi
            # Whatever a killed run left behind must not hold the next one.
            taskkill //F //IM luajit.exe > /dev/null 2>&1
            taskkill //F //IM nupp.exe > /dev/null 2>&1
          done
          exit 0
