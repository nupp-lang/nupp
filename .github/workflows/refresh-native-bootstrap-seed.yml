name: Refresh native bootstrap execution seeds

# The caller publishes this prerelease and its verified compiler image first.
# This workflow only repackages each pinned runtime with that same image.
on:
  workflow_dispatch:
    inputs:
      tag:
        description: Existing immutable prerelease tag (published with latest=false)
        required: true
        type: string
      source_revision:
        description: Full 40-character native source commit targeted by the tag
        required: true
        type: string
      image_sha256:
        description: SHA-256 of the decompressed nupp-stage0-TAG.image.gz asset
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: native-bootstrap-refresh-${{ inputs.tag }}
  cancel-in-progress: false

jobs:
  package:
    name: Repackage pinned runtime / ${{ matrix.host }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-15
            host: aarch64-apple-darwin
          - os: ubuntu-24.04
            host: x86_64-unknown-linux-gnu
          - os: windows-2022
            host: x86_64-pc-windows-gnu
    defaults:
      run:
        shell: bash
    env:
      GH_TOKEN: ${{ github.token }}
      SEED_TAG: ${{ inputs.tag }}
      SOURCE_REVISION: ${{ inputs.source_revision }}
      IMAGE_SHA256: ${{ inputs.image_sha256 }}
      SEED_HOST: ${{ matrix.host }}
      NUPP_TOOLCHAIN_DIR: build/bootstrap-seed-refresh-cache
      NUPP_VM_AUTO_REBUILD: "0"
      NO_JIT: "1"
      NO_AOT: "1"
      SIMD_INTERPRET: "1"
    steps:
      - name: Check out the exact native source revision
        uses: actions/checkout@v5
        with:
          ref: ${{ inputs.source_revision }}
          fetch-depth: 1

      - name: Select Python for the existing seed packer
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # Match the native workflows' Git Bash/GNU environment. No Rust
      # toolchain is installed: the pinned executable is the only runtime.
      - name: Select the Windows GNU shell environment
        if: runner.os == 'Windows'
        run: |
          set -euo pipefail
          echo "NUPP_TEST_BASH=$(cygpath -w "$(command -v bash)")" >> "$GITHUB_ENV"
          echo "NUPP_TEST_SH=$(cygpath -w /usr/bin/sh.exe)" >> "$GITHUB_ENV"
          echo "CONFIG_SHELL=$(cygpath -m -s /usr/bin/sh.exe)" >> "$GITHUB_ENV"
          echo "NUPP_CC=gcc" >> "$GITHUB_ENV"
          echo "NUPP_CXX=g++" >> "$GITHUB_ENV"

      - name: Verify inputs and release, fetch the pinned pair, and package
        run: |
          set -euo pipefail
          [[ "$SEED_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+-[A-Za-z0-9][A-Za-z0-9._-]*$ ]]
          [[ "$SOURCE_REVISION" =~ ^[0-9a-f]{40}$ ]]
          [[ "$IMAGE_SHA256" =~ ^[0-9a-f]{64}$ ]]
          test "$(git rev-parse HEAD)" = "$SOURCE_REVISION"
          command -v gh
          command -v jq
          command -v python3
          test -f scripts/bootstrap-seed
          test -f scripts/bootstrap-seeds.json

          # Native jq otherwise writes CRLF through Git Bash, including raw
          # scalar values used below in exact digest and revision comparisons.
          jq() {
            if test "$RUNNER_OS" = Windows; then
              command jq --binary "$@"
            else
              command jq "$@"
            fi
          }

          out=build/bootstrap-seed-refresh
          mkdir -p "$out/input" "$out/metadata"
          image_asset="nupp-stage0-${SEED_TAG}.image.gz"
          archive_asset="nupp-seed-${SEED_HOST}-${SOURCE_REVISION}.tar.gz"
          image="$out/input/compiler.image"
          archive="$out/$archive_asset"

          sha256() {
            if command -v shasum >/dev/null 2>&1; then
              shasum -a 256 "$1" | cut -d' ' -f1
            elif command -v sha256sum >/dev/null 2>&1; then
              sha256sum "$1" | cut -d' ' -f1
            else
              openssl dgst -sha256 < "$1" | sed 's/.*= *//'
            fi
          }

          # Resolve annotated tags as well as lightweight tags through the API.
          # Never trust release.target_commitish, which may be a moving branch.
          verify_tag() {
            local object kind revision depth
            object=$(gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$SEED_TAG")
            kind=$(jq -er '.object.type' <<< "$object")
            revision=$(jq -er '.object.sha' <<< "$object")
            depth=0
            while test "$kind" = tag; do
              test "$depth" -lt 8
              object=$(gh api "repos/$GITHUB_REPOSITORY/git/tags/$revision")
              kind=$(jq -er '.object.type' <<< "$object")
              revision=$(jq -er '.object.sha' <<< "$object")
              depth=$((depth + 1))
            done
            test "$kind" = commit
            test "$revision" = "$SOURCE_REVISION"
          }

          verify_tag
          gh api "repos/$GITHUB_REPOSITORY/releases/tags/$SEED_TAG" > "$out/metadata/release-before.json"
          jq -e --arg tag "$SEED_TAG" --arg archive "$archive_asset" \
            '.tag_name == $tag and .prerelease == true and .draft == false
             and ([.assets[] | select(.name == $archive)] | length == 0)' \
            "$out/metadata/release-before.json"
          image_asset_id=$(jq -er --arg name "$image_asset" \
            '[.assets[] | select(.name == $name)] | if length == 1 then .[0].id else error("expected exactly one compiler image asset") end' \
            "$out/metadata/release-before.json")
          release_id=$(jq -er '.id' "$out/metadata/release-before.json")

          gh release download "$SEED_TAG" --repo "$GITHUB_REPOSITORY" \
            --pattern "$image_asset" --dir "$out/input"
          gzip -dc "$out/input/$image_asset" > "$image"
          test "$(sha256 "$image")" = "$IMAGE_SHA256"

          # This component only downloads, verifies, and executes the pinned
          # pair. Do not invoke --all, vm-cli build, Cargo, or an AOT build.
          seed=$(./scripts/toolchain stage0-seed | tr -d '\r')
          if test "$RUNNER_OS" = Windows; then
            seed=$(cygpath -u "$seed")
          fi
          jq -e --arg host "$SEED_HOST" \
            '.format == "nupp-bootstrap-seed-1" and .host == $host' "$seed/manifest.json"
          runtime_sha=$(jq -er --arg host "$SEED_HOST" '.hosts[$host].runtimeSha256' scripts/bootstrap-seeds.json)
          test "$(sha256 "$seed/runtime")" = "$runtime_sha"

          python3 scripts/bootstrap-seed pack \
            --runtime "$seed/runtime" --image "$image" \
            --source-revision "$SOURCE_REVISION" --output "$archive" \
            | tee "$out/metadata/pack.json"
          jq -e --arg host "$SEED_HOST" --arg runtime "$runtime_sha" --arg image "$IMAGE_SHA256" \
            '.host == $host and .runtimeSha256 == $runtime and .imageSha256 == $image' \
            "$out/metadata/pack.json"

          # Recheck the exact target, release, image asset and destination name
          # immediately before upload. gh upload has no --clobber, so a race
          # with a duplicate upload also fails without replacing the asset.
          verify_tag
          gh api "repos/$GITHUB_REPOSITORY/releases/tags/$SEED_TAG" > "$out/metadata/release-checked.json"
          jq -e --arg tag "$SEED_TAG" --arg archive "$archive_asset" \
            --arg image "$image_asset" --argjson imageId "$image_asset_id" --argjson releaseId "$release_id" \
            '.id == $releaseId and .tag_name == $tag and .prerelease == true and .draft == false
             and ([.assets[] | select(.name == $archive)] | length == 0)
             and ([.assets[] | select(.name == $image and .id == $imageId)] | length == 1)' \
            "$out/metadata/release-checked.json"
          gh release upload "$SEED_TAG" "$archive" --repo "$GITHUB_REPOSITORY"

          verify_tag
          gh api "repos/$GITHUB_REPOSITORY/releases/tags/$SEED_TAG" > "$out/metadata/release-after.json"
          jq -e --arg tag "$SEED_TAG" --argjson releaseId "$release_id" \
            '.id == $releaseId and .tag_name == $tag and .prerelease == true and .draft == false' \
            "$out/metadata/release-after.json"
          archive_url=$(jq -er --arg name "$archive_asset" \
            '[.assets[] | select(.name == $name)] | if length == 1 then .[0].browser_download_url else error("uploaded seed asset missing or duplicated") end' \
            "$out/metadata/release-after.json")
          compressed_sha=$(sha256 "$out/input/$image_asset")
          jq --arg url "$archive_url" --arg tag "$SEED_TAG" \
            --arg revision "$SOURCE_REVISION" --arg imageAsset "$image_asset" \
            --arg compressedSha "$compressed_sha" --arg workflowRevision "$GITHUB_SHA" \
            --argjson releaseId "$release_id" --arg host "$SEED_HOST" \
            --slurpfile pins scripts/bootstrap-seeds.json \
            '.url = $url | . + {tag: $tag, sourceRevision: $revision,
              workflowRevision: $workflowRevision, releaseId: $releaseId,
              imageAsset: $imageAsset, compressedImageSha256: $compressedSha,
              previousPin: $pins[0].hosts[$host]}' \
            "$out/metadata/pack.json" > "$out/metadata/receipt.json"
          cat "$out/metadata/receipt.json"

      - name: Retain seed digests and provenance
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: native-bootstrap-refresh-${{ matrix.host }}-${{ inputs.source_revision }}
          path: build/bootstrap-seed-refresh/metadata/
          if-no-files-found: warn
