name: Bootstrap execution seeds

on:
  push:
    branches: [codex/native-bootstrap-seed]
  workflow_dispatch:
    inputs:
      source:
        description: Historical runner source for initial seed assembly
        default: 9a2e592d9a1f07a017f4f360b5764ee68b0d54ae
        required: true
      transition_run:
        description: Verified transitional artifact run, or build to manufacture a pair
        default: "40515906870"
        required: false

permissions:
  contents: read
  actions: read

jobs:
  seed:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            host: x86_64-unknown-linux-gnu
          - os: windows-2022
            host: x86_64-pc-windows-gnu
    runs-on: ${{ matrix.os }}
    timeout-minutes: 120
    env:
      SEED_SOURCE: ${{ inputs.source || '9a2e592d9a1f07a017f4f360b5764ee68b0d54ae' }}
      NUPP_VM_AUTO_REBUILD: "0"
      SEED_HOST: ${{ matrix.host }}
      TRANSITION_RUN: ${{ inputs.transition_run || '40515906870' }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v5
      # A historical checkout must stay outside the consumer's source walk.
      - uses: actions/checkout@v5
        if: env.TRANSITION_RUN == 'build'
        with:
          ref: ${{ env.SEED_SOURCE }}
          path: .seed-source

      - name: Select Windows GNU tools
        if: runner.os == 'Windows'
        run: |
          channel=$(sed -n 's/^channel = "\([^"]*\)"$/\1/p' rust-toolchain.toml)
          rustup toolchain install "${channel}-x86_64-pc-windows-gnu" --profile minimal
          echo "RUSTUP_TOOLCHAIN=${channel}-x86_64-pc-windows-gnu" >> "$GITHUB_ENV"
          echo "CONFIG_SHELL=$(cygpath -m -s /usr/bin/sh.exe)" >> "$GITHUB_ENV"
          echo "CC=gcc" >> "$GITHUB_ENV"
          echo "CXX=g++" >> "$GITHUB_ENV"

      # This old, exact source is used only to manufacture the transitional
      # seed. The consuming checkout below never builds a Rust execution loop.
      - name: Build the transitional execution seed from its exact source
        if: env.TRANSITION_RUN == 'build'
        run: |
          set -euo pipefail
          mkdir -p release
          cd .seed-source
          seed_image=$(sh scripts/toolchain stage0-image)
          env NO_JIT=1 NO_AOT=1 NO_THREADED=1 SIMD_INTERPRET=1 \
            python3 scripts/vm-cli build --seed-image "$seed_image" --no-cache 2>&1 | tee ../release/transition-build.log
          env NO_JIT=1 NO_AOT=1 NO_THREADED=1 SIMD_INTERPRET=1 \
            python3 scripts/vm-cli runtime --link --no-cache 2>&1 | tee ../release/transition-runtime.log
          generation=$(cat .nupp/vm-cli/current)
          cp ".nupp/vm-cli/$generation/compiler.image" ../release/compiler.image
          seed_root="$PWD"
          [ "$RUNNER_OS" != Windows ] || seed_root=$(cygpath -m "$PWD")
          env -u NO_THREADED NO_JIT=1 NO_AOT=1 SIMD_INTERPRET=1 \
            NUPP_COMPILER_ROOT="$seed_root" NUPP_VM_BINARY="$seed_root/build/native-runtime/runtime" \
            build/native-runtime/runtime run ../release/compiler.image \
            nupp.compiler.clif.lower compileRuntime "$seed_root" "$seed_root/build/native-runtime/layouts.json" \
            --output ../release/native-compiler.clif
          cmp ../release/native-compiler.clif build/native-runtime/runtime.clif

      - name: Pack and verify the immutable runtime/image pair
        if: env.TRANSITION_RUN == 'build'
        env:
          SEED_HOST: ${{ matrix.host }}
        run: |
          set -euo pipefail
          python3 scripts/bootstrap-seed pack --runtime .seed-source/build/native-runtime/runtime \
            --image release/compiler.image --source-revision "$SEED_SOURCE" \
            --output "release/transition-$SEED_HOST.tar.gz" > release/transition-pin.json
          python3 - <<'PY'
          import json
          from pathlib import Path
          pin = json.loads(Path('release/transition-pin.json').read_text())
          host = pin.pop('host')
          Path('release/local-pins.json').write_text(json.dumps({'format': 'nupp-bootstrap-seed-1', 'hosts': {host: pin}}))
          PY

      - name: Retrieve the verified transitional pair
        if: env.TRANSITION_RUN != 'build'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh run download "$TRANSITION_RUN" -n "bootstrap-seed-$SEED_HOST" -D prior-release
          python3 - <<'PYREUSE'
          import hashlib, json, os, shutil
          from pathlib import Path
          Path('release').mkdir()
          for name in ['transition-pin.json', 'compiler.image', 'transition-' + os.environ['SEED_HOST'] + '.tar.gz']:
              shutil.copyfile(Path('prior-release') / name, Path('release') / name)
          pin = json.loads(Path('release/transition-pin.json').read_text())
          host = pin.pop('host')
          assert host == os.environ['SEED_HOST']
          archive = Path('release/transition-' + host + '.tar.gz')
          assert hashlib.sha256(archive.read_bytes()).hexdigest() == pin['sha256']
          pin['url'] = archive.resolve().as_uri()
          Path('release/local-pins.json').write_text(json.dumps({'format': 'nupp-bootstrap-seed-1', 'hosts': {host: pin}}))
          PYREUSE

      - name: Cold bootstrap the consuming checkout without a source-built runner
        run: |
          set -euo pipefail
          consumer_root="$PWD"
          [ "$RUNNER_OS" != Windows ] || consumer_root=$(cygpath -m "$PWD")
          export NUPP_BOOTSTRAP_SEED_MANIFEST="$consumer_root/release/local-pins.json"
          export NUPP_TOOLCHAIN_DIR="$consumer_root/build/cold-seed-cache"
          test ! -e .nupp/vm-cli/current
          python3 - <<'PYPROVENANCE'
          import hashlib, json, os, subprocess
          from pathlib import Path
          paths = ['release/compiler.image', 'release/transition-' + os.environ['SEED_HOST'] + '.tar.gz',
                   'scripts/vm-cli', 'scripts/bootstrap-seed']
          Path('release/provenance.json').write_text(json.dumps({
              'consumer': subprocess.check_output(['git', 'rev-parse', 'HEAD'], text=True).strip(),
              'seed': os.environ['SEED_SOURCE'],
              'sha256': {name: hashlib.sha256(Path(name).read_bytes()).hexdigest() for name in paths}
          }, indent=2) + '\n')
          PYPROVENANCE
          set +e
          python3 scripts/vm-cli build --seed image --no-aot --no-cache 2>&1 | tee release/cold-build.log
          cold_status=${PIPESTATUS[0]}
          set -e
          if [ "$cold_status" -ne 0 ]; then
            # Diagnostic only: a Rust-reference result cannot satisfy the gate.
            python3 - <<'PYDIAGNOSTIC' > release/reference-after-failure.log 2>&1 || true
          import os, subprocess
          from pathlib import Path
          package = subprocess.check_output(['python3', 'scripts/bootstrap-seed', 'fetch'], text=True).strip()
          env = dict(os.environ, NO_JIT='1', NO_AOT='1', NO_THREADED='1', SIMD_INTERPRET='1', NUPP_COMPILER_ROOT=str(Path.cwd()))
          subprocess.run([str(Path(package) / 'runtime'), 'run', 'build/vm-cli/compiler.image',
                          'nupp.compiler.clif.lower', 'compileRuntime', str(Path.cwd()),
                          str(Path('build/vm-cli/native/layouts.json').resolve()),
                          '--output', 'release/reference-after-failure.clif'], env=env)
          PYDIAGNOSTIC
            exit "$cold_status"
          fi
          ./bin/nupp test bootstrapseedtest rustabitest --jobs=1 --json > release/cold-tests.json
          ./bin/nupp fixpoint 2>&1 | tee release/fixpoint.log
          generation=$(cat .nupp/vm-cli/current)
          env -u NO_THREADED NO_JIT=1 NO_AOT=1 SIMD_INTERPRET=1 \
            NUPP_COMPILER_ROOT="$consumer_root" \
            ".nupp/vm-cli/$generation/runtime" run ".nupp/vm-cli/$generation/compiler.image" \
            nupp.compiler.clif.lower compileRuntime "$consumer_root" \
            "$consumer_root/build/vm-cli/native/layouts.json" \
            --output release/final-native-compiler.clif
          cmp release/final-native-compiler.clif build/vm-cli/native/runtime.clif
          python3 scripts/bootstrap-seed pack --runtime ".nupp/vm-cli/$generation/runtime" \
            --image ".nupp/vm-cli/$generation/compiler.image" --source-revision "$GITHUB_SHA" \
            --output "release/nupp-seed-${{ matrix.host }}.tar.gz" > release/pin.json
          python3 scripts/vm-cli link 2>&1 | tee release/aot-link.log
          ./bin/nupp --help > release/aot-help.log
          python3 scripts/vm-cli status > release/installed.json

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: bootstrap-seed-${{ matrix.host }}
          path: release/
          if-no-files-found: error
