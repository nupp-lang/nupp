name: Native bootstrap cold acceptance

on:
  workflow_dispatch:
    inputs:
      platform:
        description: Platform cold consumer gates
        type: choice
        options: [all, windows, linux]
        default: all

permissions:
  contents: read

jobs:
  seed:
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(inputs.platform == 'windows' && '[{"os":"windows-2022","host":"x86_64-pc-windows-gnu"}]' || inputs.platform == 'linux' && '[{"os":"ubuntu-24.04","host":"x86_64-unknown-linux-gnu"}]' || '[{"os":"ubuntu-24.04","host":"x86_64-unknown-linux-gnu"},{"os":"windows-2022","host":"x86_64-pc-windows-gnu"}]') }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 120
    defaults:
      run:
        shell: bash
    env:
      SEED_HOST: ${{ matrix.host }}
      NUPP_VM_AUTO_REBUILD: "0"
    steps:
      - uses: actions/checkout@v5
      - name: Select Windows GNU tools
        if: runner.os == 'Windows'
        run: |
          channel=$(sed -n 's/^channel = "\([^"]*\)"$/\1/p' rust-toolchain.toml)
          rustup toolchain install "${channel}-x86_64-pc-windows-gnu" --profile minimal
          echo "RUSTUP_TOOLCHAIN=${channel}-x86_64-pc-windows-gnu" >> "$GITHUB_ENV"
          echo "NUPP_TEST_BASH=$(cygpath -w "$(command -v bash)")" >> "$GITHUB_ENV"
          echo "NUPP_TEST_SH=$(cygpath -w /usr/bin/sh.exe)" >> "$GITHUB_ENV"
          echo "CONFIG_SHELL=$(cygpath -m -s /usr/bin/sh.exe)" >> "$GITHUB_ENV"
          echo "CC=gcc" >> "$GITHUB_ENV"
          echo "CXX=g++" >> "$GITHUB_ENV"
      - name: Prove a cold build from the published execution seed
        run: python3 .github/scripts/native-bootstrap-cold.py
      - name: Diagnose Windows compiled-call failure
        if: failure() && runner.os == 'Windows'
        continue-on-error: true
        run: |
          gdb=$(command -v gdb || true)
          if [ -z "$gdb" ]; then
            /c/msys64/usr/bin/bash.exe -lc 'pacman -Sy --noconfirm --needed mingw-w64-x86_64-gdb'
            gdb=/c/msys64/mingw64/bin/gdb.exe
          fi
          python3 .github/scripts/native-frame-debug.py "$gdb"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: native-bootstrap-cold-${{ matrix.host }}
          path: build/native-bootstrap-cold/
          if-no-files-found: error
