name: Numeric bootstrap execution seeds

on:
  push:
    branches: [codex/native-numeric-seed]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  seed:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            host: x86_64-unknown-linux-gnu
          - os: windows-2022
            host: x86_64-pc-windows-gnu
    runs-on: ${{ matrix.os }}
    timeout-minutes: 120
    defaults:
      run:
        shell: bash
    env:
      SEED_HOST: ${{ matrix.host }}
      NUPP_VM_AUTO_REBUILD: "0"
    steps:
      - uses: actions/checkout@v5
      # Keep the factory's exact source outside the consumer's source walk.
      - uses: actions/checkout@v5
        with:
          ref: 4e6e9d449519f799e122526cacf505fd1f016b0a
          path: .seed-source
      - name: Select Windows GNU tools
        if: runner.os == 'Windows'
        run: |
          channel=$(sed -n 's/^channel = "\([^"]*\)"$/\1/p' rust-toolchain.toml)
          rustup toolchain install "${channel}-x86_64-pc-windows-gnu" --profile minimal
          echo "RUSTUP_TOOLCHAIN=${channel}-x86_64-pc-windows-gnu" >> "$GITHUB_ENV"
          echo "CONFIG_SHELL=$(cygpath -m -s /usr/bin/sh.exe)" >> "$GITHUB_ENV"
          echo "CC=gcc" >> "$GITHUB_ENV"
          echo "CXX=g++" >> "$GITHUB_ENV"
      - name: Manufacture the matching seed and prove a cold consuming build
        run: python3 .github/scripts/numeric-bootstrap-seed.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: numeric-bootstrap-seed-${{ matrix.host }}
          path: release/
          if-no-files-found: error
