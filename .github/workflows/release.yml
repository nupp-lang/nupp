name: Build standalone binaries

on:
  push:
    branches:
      - main
    tags:
      - "*"
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux x86-64
            os: ubuntu-latest
            artifact: nupp-linux-x86_64
          - name: macOS arm64
            os: macos-14
            artifact: nupp-macos-arm64
          - name: Windows x86-64
            os: windows-latest
            artifact: nupp-windows-x86_64.exe
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Set up the MSVC environment
        if: runner.os == 'Windows'
        uses: step-security/msvc-dev-cmd@v1

      - name: Set up Lua
        uses: leafo/gh-actions-lua@v13
        with:
          luaVersion: "5.1.5"

      - name: Set up LuaRocks
        uses: leafo/gh-actions-luarocks@v6
        with:
          luaRocksVersion: "3.12.2"

      - name: Build Nupp
        env:
          ARTIFACT_NAME: ${{ matrix.artifact }}
        shell: bash
        run: |
          set -euo pipefail
          cargo build --release --manifest-path host/Cargo.toml \
            --target-dir build/bootstrap-host --features cjson
          cargo build --release --manifest-path runtime/native/Cargo.toml \
            --target-dir build/bootstrap-native --no-default-features \
            --features files,process

          case "$RUNNER_OS" in
            Windows)
              bootstrap_host=build/bootstrap-host/release/nupp-host.exe
              native_library=build/bootstrap-native/release/nupp_native.dll
              ;;
            macOS)
              bootstrap_host=build/bootstrap-host/release/nupp-host
              native_library=build/bootstrap-native/release/libnupp_native.dylib
              ;;
            *)
              bootstrap_host=build/bootstrap-host/release/nupp-host
              native_library=build/bootstrap-native/release/libnupp_native.so
              ;;
          esac

          export NUPP_COMPILER_ROOT="$GITHUB_WORKSPACE"
          export NUPP_LUA_DIR="$GITHUB_WORKSPACE/.lua"
          export NUPP_NATIVE_LIBRARY="$GITHUB_WORKSPACE/$native_library"
          "$bootstrap_host" bootstrap/nupp.lua build --target dist

          mkdir -p release
          mv build/dist/nupp "release/$ARTIFACT_NAME"
          chmod +x "release/$ARTIFACT_NAME"

          unset NUPP_NATIVE_LIBRARY
          "release/$ARTIFACT_NAME" check src/nupp/init.nupp

      - name: Upload the standalone binary
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: release/${{ matrix.artifact }}
          if-no-files-found: error

  release:
    name: Add binaries to the release
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download standalone binaries
        uses: actions/download-artifact@v4
        with:
          path: release
          merge-multiple: true

      - name: Create or update the tagged release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" release/* --clobber
          else
            gh release create "$GITHUB_REF_NAME" release/* \
              --generate-notes --verify-tag
          fi
