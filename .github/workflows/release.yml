name: Build standalone binaries

# Nothing below publishes anything outside a tag: the release job is the only
# one that writes, and it is already gated. On every other event this is a
# ten-minute packaging rehearsal running beside a compiler matrix that takes
# three times as long and is what actually decides whether the commit is good,
# so it never shortened anyone's wait -- it only occupied runners. Run it where
# its answer is load-bearing, and on request, so the packaging path can still be
# exercised deliberately before a tag rather than only by one.
on:
  push:
    # A release version and nothing else. Any tag used to start the hour-long
    # build, and one like v0.0.13-dev on the commit that says 0.0.13-dev passed
    # the version check at the end and published an ordinary release.
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  # Each platform builds its own compiler: the compiler's image stamped onto the
  # VM runtime built on that runner, which carries every native facility.
  build:
    name: ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux x86-64
            os: ubuntu-24.04
            artifact: nupp-linux-x86_64
            platform: x86_64-unknown-linux-gnu
          - name: macOS arm64
            os: macos-14
            artifact: nupp-macos-arm64
            platform: aarch64-apple-darwin
          - name: Windows x86-64
            os: windows-2022
            artifact: nupp-windows-x86_64
            platform: x86_64-pc-windows-gnu
    runs-on: ${{ matrix.os }}
    timeout-minutes: 120
    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Install the ABI-compatible Rust toolchain
        if: runner.os == 'Windows'
        shell: bash
        run: |
          channel=$(sed -n 's/^channel = "\([^"]*\)"$/\1/p' rust-toolchain.toml)
          rustup toolchain install "${channel}-x86_64-pc-windows-gnu" --profile minimal

      - name: Build pinned host dependencies
        shell: bash
        run: ./scripts/toolchain --all

      # A tag must prove the exact Rust artifacts on the same runner that will
      # package them. The compiler matrix is a separate workflow and cannot be
      # a dependency of the publishing job.
      - name: Gate the Rust-native platform artifacts
        shell: bash
        run: .github/scripts/test-rust-native-platform.sh

      - name: Verify the binary packaging fixpoint
        shell: bash
        run: ./bin/nupp fixpoint --binary

      - name: Select macOS release signing
        id: macos-signing
        if: runner.os == 'macOS' && startsWith(github.ref, 'refs/tags/')
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        shell: bash
        run: .github/scripts/select-macos-release-signing.sh

      - name: Import the macOS Developer ID certificate
        if: steps.macos-signing.outputs.enabled == 'true'
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
        shell: bash
        run: |
          set -euo pipefail
          certificate="$RUNNER_TEMP/nupp-signing.p12"
          keychain="$RUNNER_TEMP/nupp-signing.keychain-db"
          keychain_password="$(uuidgen)"
          printf '%s' "$APPLE_CERTIFICATE" | base64 -D > "$certificate"
          security create-keychain -p "$keychain_password" "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p "$keychain_password" "$keychain"
          security import "$certificate" -P "$APPLE_CERTIFICATE_PASSWORD" \
            -A -t cert -f pkcs12 -k "$keychain"
          security set-key-partition-list -S apple-tool:,apple: -s \
            -k "$keychain_password" "$keychain"
          security list-keychain -d user -s "$keychain" login.keychain-db

      - name: Build Nupp
        env:
          ARTIFACT_NAME: ${{ matrix.artifact }}
          PLATFORM: ${{ matrix.platform }}
          MACOS_RELEASE_SIGNING: ${{ steps.macos-signing.outputs.enabled }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
        shell: bash
        run: |
          set -euo pipefail
          ./bin/nupp build --target dist
          executable=nupp
          [ "$RUNNER_OS" = Windows ] && executable=nupp.exe
          package="release/package-$PLATFORM"
          mkdir -p "$package/notices"
          cp "build/dist/$executable" "$package/$executable"
          chmod +x "$package/$executable"

          if [[ "$RUNNER_OS" == macOS && "$MACOS_RELEASE_SIGNING" == true ]]; then
            codesign --force --options runtime --timestamp \
              --sign "$APPLE_SIGNING_IDENTITY" "$package/$executable"
          fi

          "$package/$executable" check src/nupp/init.nupp

          cp host/NOTICE.md "$package/NOTICE.md"
          cp host/notices/* "$package/notices/"
          (cd "$package" && { shasum -a 256 "$executable" 2>/dev/null || sha256sum "$executable"; } > SHA256SUMS)
          case "$RUNNER_OS" in
            macOS)
              if [[ "$MACOS_RELEASE_SIGNING" == true ]]; then
                echo 'This archive is Developer ID signed and notarized by release CI.' > "$package/SIGNING.txt"
              else
                printf '%s\n' \
                  'This archive is not Developer ID signed or notarized.' \
                  'macOS may require explicit approval before the executable can run.' \
                  > "$package/SIGNING.txt"
              fi
              ;;
            Windows)
              echo 'Windows release executables are unsigned by policy; Authenticode is not required to run them.' \
                > "$package/SIGNING.txt"
              ;;
            *)
              echo 'Linux executables do not use a platform code signature.' > "$package/SIGNING.txt"
              ;;
          esac
          # Names, contents and modes only: bsdtar and GNU tar otherwise write the
          # clock, the runner's user, macOS extended attributes and AppleDouble
          # `._` files, so no rebuild of a tag could reproduce its digest.
          ./scripts/toolchain archive "$package" "release/$ARTIFACT_NAME.tar.gz" > /dev/null
          mkdir "release/verify-$PLATFORM"
          tar -xzf "release/$ARTIFACT_NAME.tar.gz" -C "release/verify-$PLATFORM"
          (cd "release/verify-$PLATFORM" && { shasum -a 256 -c SHA256SUMS 2>/dev/null || sha256sum -c SHA256SUMS; })
          test -f "release/verify-$PLATFORM/NOTICE.md"
          "release/verify-$PLATFORM/$executable" --help
          # A tag is what a user installs and `nupp --version` is what they are told
          # they installed, and nothing but this makes the two agree: the number is a
          # string in the source, set by the commit the tag names. Checked against the
          # archived binary rather than against the source, so what is verified is the
          # artifact that ships.
          if [ "${GITHUB_REF_TYPE:-}" = tag ]; then
            printed="$("release/verify-$PLATFORM/$executable" --version)"
            expected="nupp ${GITHUB_REF_NAME#v}"
            if [ "$printed" != "$expected" ]; then
              echo "tag $GITHUB_REF_NAME ships $printed; bump nupp.tools.version" >&2
              exit 1
            fi
          fi

      - name: Upload the standalone binary
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: release/${{ matrix.artifact }}.tar.gz
          if-no-files-found: error

      - name: Notarize the macOS distribution
        if: steps.macos-signing.outputs.enabled == 'true'
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        shell: bash
        run: |
          set -euo pipefail
          codesign --verify --strict --verbose=2 release/package-${{ matrix.platform }}/nupp
          ditto -c -k --keepParent release/package-${{ matrix.platform }} \
            "$RUNNER_TEMP/nupp-macos-notarization.zip"
          xcrun notarytool submit "$RUNNER_TEMP/nupp-macos-notarization.zip" \
            --apple-id "$APPLE_ID" \
            --password "$APPLE_APP_PASSWORD" \
            --team-id "$APPLE_TEAM_ID" \
            --wait
          spctl --assess --type execute --verbose=2 release/package-${{ matrix.platform }}/nupp

  # The stage zero: the root CLI image the fixpoint verified, starting from the
  # pinned one, which a cold checkout runs on a runtime built from its own
  # sources (`scripts/toolchain stage0-image`, `scripts/vm-cli build
  # --seed-image`). It is a platform-free graph image, so one runner composes
  # it. Producing it any other way would publish a stage zero nothing had proved
  # is a fixed point of itself.
  stage-zero-image:
    name: VM stage-zero image
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Build pinned host dependencies
        shell: bash
        run: ./scripts/toolchain --all

      - name: Build the VM CLI from these sources
        shell: bash
        run: python3 scripts/vm-cli build

      # The digest is of the image inside the archive, which is what a checkout
      # verifies, and is printed for the pin bump that follows the release.
      - name: Verify the VM fixpoint and compose the stage-zero image
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p release
          label=${GITHUB_REF_NAME:-untagged}
          name="nupp-stage0-${label//\//-}.image"
          ./bin/nupp fixpoint --emit-stage0 "release/$name"
          printf 'STAGE0_IMAGE_SHA256 for this release: %s\n' \
            "$(sha256sum "release/$name" | cut -d' ' -f1)"
          gzip -9 -n "release/$name"

      - name: Upload the stage-zero image
        uses: actions/upload-artifact@v4
        with:
          name: nupp-stage0-image
          path: release/nupp-stage0-*.image.gz
          if-no-files-found: error

  release:
    name: Add binaries to the release
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')
    needs:
      - build
      - stage-zero-image
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Download the binaries and the stage-zero image
        uses: actions/download-artifact@v4
        with:
          path: release
          pattern: nupp-*
          merge-multiple: true

      - name: Create or update the tagged release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            echo "release $GITHUB_REF_NAME already exists; immutable assets are not replaced" >&2
            exit 1
          fi
          gh release create "$GITHUB_REF_NAME" release/* \
            --generate-notes --verify-tag
