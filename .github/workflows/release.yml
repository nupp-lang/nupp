name: Build standalone binaries

on:
  push:
    branches:
      - main
    tags:
      - "*"
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-unix:
    name: ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux x86-64
            os: ubuntu-latest
            artifact: nupp-linux-x86_64
          - name: macOS arm64
            os: macos-14
            artifact: nupp-macos-arm64
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      # Compiling Nupp evaluates `@comptime` code, and the compiler evaluates that by
      # starting a sealed worker through `bin/nupp` -- which is a LuaJIT launcher. A
      # build of the compiler therefore needs the same interpreter the compiler matrix
      # builds, whatever interpreter drives the build itself.
      - name: Build LuaJIT and lua-cjson
        shell: bash
        run: .github/scripts/setup-luajit-posix.sh

      - name: Build Nupp
        env:
          ARTIFACT_NAME: ${{ matrix.artifact }}
        shell: bash
        run: |
          set -euo pipefail
          cargo build --release --manifest-path host/Cargo.toml \
            --target-dir build/bootstrap-host --features cjson
          cargo build --release --manifest-path runtime/native/Cargo.toml \
            --target-dir build/bootstrap-native --no-default-features \
            --features files,process

          case "$RUNNER_OS" in
            macOS) native_library=build/bootstrap-native/release/libnupp_native.dylib ;;
            *)     native_library=build/bootstrap-native/release/libnupp_native.so ;;
          esac

          # Stage 0 through the launcher, which stages the native file provider that
          # listing the compiler's own sources reaches, so no worker has to wait on
          # Cargo. Stage 1 through the stub, so the interpreter every standalone binary
          # carries is the one that compiles the payload it will carry.
          ./bin/nupp build --target compiler
          cat > build/current-compiler.lua <<'LUA'
          package.path = os.getenv("GITHUB_WORKSPACE") .. "/build/?.lua;"
             .. package.path
          dofile(os.getenv("GITHUB_WORKSPACE") .. "/build/nupp/compiler/main.lua")
          LUA
          NUPP_COMPILER_ROOT="$GITHUB_WORKSPACE" \
            NUPP_NATIVE_LIBRARY="$GITHUB_WORKSPACE/$native_library" \
            build/bootstrap-host/release/nupp-host \
            build/current-compiler.lua build --target dist

          mkdir -p release
          mv build/dist/nupp "release/$ARTIFACT_NAME"
          chmod +x "release/$ARTIFACT_NAME"

          "release/$ARTIFACT_NAME" check src/nupp/init.nupp

      - name: Extract the platform-independent payload
        if: runner.os == 'Linux'
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import struct

          binary = Path("release/nupp-linux-x86_64").read_bytes()
          magic, version, reserved, offset, length, digest, trailer = struct.unpack(
              "<8sIIQQ8sQ", binary[-48:]
          )
          assert magic == b"NUPPLOAD" and version == 1 and reserved == 0
          assert trailer == 48 and offset + length == len(binary) - trailer
          Path("release/standalone-payload").write_bytes(
              binary[offset : offset + length]
          )
          PY

      - name: Upload the standalone binary
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: release/${{ matrix.artifact }}
          if-no-files-found: error

      - name: Upload the platform-independent payload
        if: runner.os == 'Linux'
        uses: actions/upload-artifact@v4
        with:
          name: standalone-payload
          path: release/standalone-payload
          if-no-files-found: error

  build-windows:
    name: Windows x86-64
    needs: build-unix
    runs-on: windows-2022
    timeout-minutes: 30
    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Set up the MSVC environment
        uses: step-security/msvc-dev-cmd@v1

      - name: Download the platform-independent payload
        uses: actions/download-artifact@v4
        with:
          name: standalone-payload
          path: release

      - name: Build the Windows host
        shell: pwsh
        run: |
          cargo build --release --manifest-path host/Cargo.toml `
            --target-dir build/release-host `
            --features cjson,lua-utf8,native-files,native-process

      - name: Stamp and smoke-test the standalone binary
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from hashlib import sha256
          from pathlib import Path
          import struct

          stub = Path("build/release-host/release/nupp-host.exe").read_bytes()
          payload = Path("release/standalone-payload").read_bytes()
          trailer = (
              b"NUPPLOAD"
              + struct.pack("<IIQQ", 1, 0, len(stub), len(payload))
              + sha256(payload).digest()[:8]
              + struct.pack("<Q", 48)
          )
          Path("release/nupp-windows-x86_64.exe").write_bytes(
              stub + payload + trailer
          )
          PY
          release/nupp-windows-x86_64.exe --help

      - name: Upload the standalone binary
        uses: actions/upload-artifact@v4
        with:
          name: nupp-windows-x86_64.exe
          path: release/nupp-windows-x86_64.exe
          if-no-files-found: error

  release:
    name: Add binaries to the release
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')
    needs:
      - build-unix
      - build-windows
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download standalone binaries
        uses: actions/download-artifact@v4
        with:
          path: release
          pattern: nupp-*
          merge-multiple: true

      - name: Create or update the tagged release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" release/* --clobber
          else
            gh release create "$GITHUB_REF_NAME" release/* \
              --generate-notes --verify-tag
          fi
