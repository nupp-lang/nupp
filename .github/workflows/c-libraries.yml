name: Pinned C libraries
on:
  workflow_dispatch:
  push:
    paths: &inputs
      - '.github/workflows/c-libraries.yml'
      - '.github/scripts/test-c-libraries.sh'
      - '.github/scripts/test-libuv.sh'
      - '.github/scripts/test-crc-isal.sh'
      - '.github/scripts/test-markdown.sh'
      - 'scripts/toolchain'
      - 'scripts/toolchain.pins'
      - 'scripts/native-libraries'
      - 'scripts/c-libraries/**'
      - 'scripts/test-libffi'
      - 'native/crc/**'
      - 'native/markdown/**'
      - 'native/yaml/**'
      - 'tests/fixtures/markdown/**'
      - 'tests/fixtures/c-libraries/**'
      - 'tests/fixtures/libuv/**'
      - 'tests/tools/toolchain/clibraries.test.mjs'
      - 'notices/*LICENSE*'
      - 'scripts/host-machine'
      - 'scripts/core-bridge'
      - 'scripts/core-bridge-windows.sh'
      - 'native/corebridge/**'
      - 'native/httpcurl/**'
  pull_request:
    paths: *inputs
permissions:
  contents: read
concurrency:
  group: c-libraries-${{ github.ref }}
  cancel-in-progress: true
jobs:
  conformance:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name != github.repository
    strategy:
      fail-fast: false
      matrix:
        # Mac changes are verified locally before they are pushed. The macOS
        # legs run on manual dispatch, and otherwise only when asked, as in
        # the Compiler matrix: a push whose commit says `[ci macos]` or a
        # pull request labeled `ci:macos`.
        include: >-
          ${{ fromJSON(format('[{0},{1},{2}{3}]',
          '{"runner":"ubuntu-24.04","target":"x86_64-unknown-linux-gnu"}',
          '{"runner":"ubuntu-24.04-arm","target":"aarch64-unknown-linux-gnu"}',
          '{"runner":"windows-2022","target":"x86_64-pc-windows-msvc"}',
          (github.event_name == 'workflow_dispatch'
          || (github.event_name == 'push'
          && contains(github.event.head_commit.message, '[ci macos]'))
          || (github.event_name == 'pull_request'
          && contains(github.event.pull_request.labels.*.name, 'ci:macos')))
          && ',{"runner":"macos-15","target":"aarch64-apple-darwin"},{"runner":"macos-15-intel","target":"x86_64-apple-darwin"}'
          || '')) }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/c-assembler
      - name: Select the MSVC SDK
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $vswhere = "${env:ProgramFiles(x86)}/Microsoft Visual Studio/Installer/vswhere.exe"
          $install = & $vswhere -latest -products '*' -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath
          if (!$install) { throw 'MSVC x64 tools are required' }
          $setup = Join-Path $install 'Common7/Tools/VsDevCmd.bat'
          $values = & cmd /c "`"$setup`" -arch=amd64 -host_arch=amd64 >nul && set"
          if ($LASTEXITCODE) { throw 'MSVC SDK setup failed' }
          foreach ($line in $values) {
            if ($line -match '^(PATH|INCLUDE|LIB|LIBPATH|WindowsSDKVersion|VCToolsVersion)=(.*)$') {
              Add-Content $env:GITHUB_ENV "$($Matches[1])=$($Matches[2])"
            }
            if ($line -match '^VCToolsInstallDir=(.*)$') {
              Add-Content $env:GITHUB_ENV "NUPP_NATIVE_MSVC_BIN=$([IO.Path]::Combine($Matches[1], 'bin', 'Hostx64', 'x64'))"
            }
          }
          $nativePerl = $null
          foreach ($candidate in (Get-Command perl.exe -All)) {
            & $candidate.Source -e 'exit($^O eq "MSWin32" ? 0 : 1)'
            if ($LASTEXITCODE -eq 0) { $nativePerl = $candidate.Source; break }
          }
          if (!$nativePerl) { throw 'A native Windows Perl installation is required' }
          Add-Content $env:GITHUB_ENV "NUPP_NATIVE_PERL_BIN=$([IO.Path]::GetDirectoryName($nativePerl))"
      - uses: actions/cache@v4
        with:
          path: .nupp-c-library-cache
          key: c-libraries-${{ matrix.target }}-${{ hashFiles('scripts/toolchain.pins', 'scripts/native-libraries', 'scripts/c-libraries/**', 'native/markdown/**', 'notices/cmark-gfm-LICENSE.txt') }}
      - name: Build and verify upstream C artifacts without Rust
        shell: bash
        env:
          NUPP_NATIVE_TARGET: ${{ matrix.target }}
          NUPP_TOOLCHAIN_DIR: ${{ github.workspace }}/.nupp-c-library-cache
          NUPP_NATIVE_JOBS: '2'
        run: |
          if [ "$RUNNER_OS" = Windows ]; then
            # Git also ships link.exe; OpenSSL must call the MSVC linker.
            export PATH="$(cygpath -u "$NUPP_NATIVE_MSVC_BIN"):$(cygpath -u "$NUPP_NATIVE_PERL_BIN"):$PATH"
          fi
          mkdir -p build/no-rust-tools
          for tool in cargo rustc rustup cargo-c; do
            printf '#!/bin/sh\necho "Unexpected Rust tool invocation" >&2\nexit 99\n' > "build/no-rust-tools/$tool"
            chmod +x "build/no-rust-tools/$tool"
          done
          export PATH="$PWD/build/no-rust-tools:$PATH"
          sh .github/scripts/test-c-libraries.sh
          sh .github/scripts/test-libuv.sh
          sh .github/scripts/test-markdown.sh
      - uses: actions/upload-artifact@v4
        with:
          name: c-library-abi-${{ matrix.target }}
          path: |
            build/c-libraries/abi.json
            build/c-libraries/timing.json
            build/c-libraries/*.identity
            build/libuv/abi.json
            build/libuv/timing.json
            build/libuv/libuv.identity
            build/libuv/libuv-files.sha256
            build/crc-isal/crc.txt
            build/crc-isal/isal.identity
            build/cmark-probe/results.json
            build/cmark-probe/markdown.identity
            build/cmark-probe/markdown-files.sha256
          if-no-files-found: error
  libffi:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name != github.repository
    strategy:
      fail-fast: false
      matrix:
        include: >-
          ${{ fromJSON(format('[{0},{1}{2}]',
          '{"runner":"ubuntu-24.04","target":"x86_64-unknown-linux-gnu"}',
          '{"runner":"ubuntu-24.04-arm","target":"aarch64-unknown-linux-gnu"}',
          (github.event_name == 'workflow_dispatch'
          || (github.event_name == 'push'
          && contains(github.event.head_commit.message, '[ci macos]'))
          || (github.event_name == 'pull_request'
          && contains(github.event.pull_request.labels.*.name, 'ci:macos')))
          && ',{"runner":"macos-15","target":"aarch64-apple-darwin"},{"runner":"macos-15-intel","target":"x86_64-apple-darwin"}'
          || '')) }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/cache@v4
        with:
          path: .nupp-c-library-cache
          key: libffi-${{ matrix.target }}-${{ hashFiles('scripts/toolchain.pins', 'scripts/native-libraries', 'scripts/c-libraries/libffi.sh', 'scripts/c-libraries/libffiprobe.c') }}
      - name: Verify pinned libffi headers, calls and closures without Rust
        shell: bash
        env:
          NUPP_NATIVE_TARGET: ${{ matrix.target }}
          NUPP_TOOLCHAIN_DIR: ${{ github.workspace }}/.nupp-c-library-cache
        run: |
          mkdir -p build/no-rust-tools
          for tool in cargo rustc rustup cargo-c; do
            printf '#!/bin/sh\necho "Unexpected Rust tool invocation" >&2\nexit 99\n' > "build/no-rust-tools/$tool"
            chmod +x "build/no-rust-tools/$tool"
          done
          export PATH="$PWD/build/no-rust-tools:$PATH"
          sh scripts/test-libffi
      - uses: actions/upload-artifact@v4
        with:
          name: libffi-abi-${{ matrix.target }}
          path: |
            build/libffi/abi.json
            build/libffi/libffi.identity
          if-no-files-found: error
  # Windows on ARM64 builds natively with LLVM MinGW from MSYS2's clangarm64
  # environment, which the runner image carries at C:/msys64. Every pinned
  # library is built for aarch64-pc-windows-gnullvm, and the native core's
  # bridge, guard and Windows contracts are built and run on them.
  windows-arm64:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name != github.repository
    runs-on: windows-11-arm
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5
      - name: Provision MSYS2's clangarm64 toolchain
        shell: pwsh
        run: |
          $bash = 'C:/msys64/usr/bin/bash.exe'
          if (!(Test-Path $bash)) { throw 'MSYS2 is required at C:/msys64' }
          & $bash -lc 'pacman -S --needed --noconfirm mingw-w64-clang-aarch64-toolchain mingw-w64-clang-aarch64-cmake mingw-w64-clang-aarch64-ninja make perl diffutils'
          if ($LASTEXITCODE) { throw 'clangarm64 provisioning failed' }
          Add-Content $env:GITHUB_PATH 'C:\msys64\clangarm64\bin'
      - uses: actions/cache@v4
        with:
          path: .nupp-c-library-cache
          key: c-libraries-aarch64-pc-windows-gnullvm-${{ hashFiles('scripts/toolchain.pins', 'scripts/native-libraries', 'scripts/host-machine', 'scripts/c-libraries/**', 'native/crc/**', 'native/markdown/**', 'native/yaml/**', 'notices/*LICENSE*') }}
      - name: Build the pinned libraries and the core bridge without Rust
        shell: bash
        env:
          NUPP_TOOLCHAIN_DIR: ${{ github.workspace }}/.nupp-c-library-cache
          NUPP_NATIVE_JOBS: '4'
        run: |
          mkdir -p build/no-rust-tools
          for tool in cargo rustc rustup cargo-c; do
            printf '#!/bin/sh\necho "Unexpected Rust tool invocation" >&2\nexit 99\n' > "build/no-rust-tools/$tool"
            chmod +x "build/no-rust-tools/$tool"
          done
          export PATH="$PWD/build/no-rust-tools:$PATH"
          [ "$(sh scripts/host-machine | cut -d: -f2)" = aarch64 ] || { echo 'host is not ARM64' >&2; exit 1; }
          [ "$(sh scripts/stage0-runtime --host)" = aarch64-pc-windows-gnullvm ]
          sh scripts/native-libraries zlib libuv openssl libcurl libffi isal cmark libyaml
          sh scripts/core-bridge --test
          llvm-objdump -f build/c-core-bridge/nupp-core.exe | grep -q aarch64
