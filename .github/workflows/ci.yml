name: CI

# What a checkout has to be able to do, on the platforms it claims to support:
# check itself, pass its suite, and rebuild itself byte for byte.
#
# LuaJIT is built from source rather than taken from a package, because the floor
# is a rolling 2.1 build (2.1.1784535649) and distributions are routinely older.
# On unix it is installed to a prefix, which is what puts its own Lua modules
# where an interpreter looks for them and gives LuaRocks something to configure
# against; Windows has no install target, so those modules are staged into the
# project's rock tree instead.
#
# LuaRocks supplies what the suite needs beyond the interpreter: lua-cjson for
# the compiler itself, LPeg for the materialization tests, and the rocks the
# documentation target installs from the manifest. They go into the project's own
# `.rocks` tree, which is where `bin/nupp` and `tests/run` look.
#
# Cargo is a build prerequisite since the compiler lists its own sources through
# a native provider. The runners ship a Rust toolchain; the job proves it is
# there rather than assuming it.

on:
  push:
    branches: ["main"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  LUAJIT_REF: v2.1
  LUA_VERSION: "5.4.8"
  LUAROCKS_VERSION: "3.11.1"

jobs:
  verify:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]

    steps:
      - uses: actions/checkout@v4

      - name: Report the toolchain
        shell: bash
        run: |
          cargo --version
          rustc --version

      - name: Build and install LuaJIT (unix)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          git clone --depth 1 --branch "$LUAJIT_REF" \
            https://github.com/LuaJIT/LuaJIT.git "$RUNNER_TEMP/luajit-src"
          # LuaJIT's makefile refuses to guess this, and says so rather than
          # building something that will not load.
          if [ "$RUNNER_OS" = "macOS" ]; then
            export MACOSX_DEPLOYMENT_TARGET="$(sw_vers -productVersion | cut -d. -f1).0"
          fi
          make -C "$RUNNER_TEMP/luajit-src" -j"$(getconf _NPROCESSORS_ONLN)" \
            PREFIX="$RUNNER_TEMP/luajit"
          make -C "$RUNNER_TEMP/luajit-src" install PREFIX="$RUNNER_TEMP/luajit"
          ln -sf "$RUNNER_TEMP"/luajit/bin/luajit-* "$RUNNER_TEMP/luajit/bin/luajit"
          echo "$RUNNER_TEMP/luajit/bin" >> "$GITHUB_PATH"

      - name: Build LuaJIT (windows)
        if: runner.os == 'Windows'
        shell: cmd
        run: |
          git clone --depth 1 --branch %LUAJIT_REF% https://github.com/LuaJIT/LuaJIT.git "%RUNNER_TEMP%\luajit-src"
          call "%GITHUB_WORKSPACE%\.github\workflows\msvc.cmd" || exit /b 1
          cd /d "%RUNNER_TEMP%\luajit-src\src"
          call msvcbuild.bat || exit /b 1
          mkdir "%RUNNER_TEMP%\luajit\bin" 2>nul
          mkdir "%RUNNER_TEMP%\luajit\include\luajit-2.1" 2>nul
          mkdir "%RUNNER_TEMP%\luajit\lib" 2>nul
          copy /y luajit.exe "%RUNNER_TEMP%\luajit\bin\" || exit /b 1
          copy /y lua51.dll "%RUNNER_TEMP%\luajit\bin\" || exit /b 1
          copy /y lua51.lib "%RUNNER_TEMP%\luajit\lib\" || exit /b 1
          copy /y lua.h "%RUNNER_TEMP%\luajit\include\luajit-2.1\" || exit /b 1
          copy /y luaconf.h "%RUNNER_TEMP%\luajit\include\luajit-2.1\" || exit /b 1
          copy /y lauxlib.h "%RUNNER_TEMP%\luajit\include\luajit-2.1\" || exit /b 1
          copy /y lualib.h "%RUNNER_TEMP%\luajit\include\luajit-2.1\" || exit /b 1
          copy /y lua.hpp "%RUNNER_TEMP%\luajit\include\luajit-2.1\" || exit /b 1
          echo %RUNNER_TEMP%\luajit\bin>>%GITHUB_PATH%

      # The unix install places LuaJIT's own Lua modules. Windows has no install
      # target, so the project rock tree stands in; it is already on the
      # interpreter's path.
      - name: Stage LuaJIT's support modules (windows)
        if: runner.os == 'Windows'
        shell: bash
        run: |
          mkdir -p .rocks/share/lua/5.1
          cp -R "$RUNNER_TEMP/luajit-src/src/jit" .rocks/share/lua/5.1/jit
          test -f .rocks/share/lua/5.1/jit/zone.lua

      - name: Check the interpreter meets the floor
        shell: bash
        run: |
          luajit -v
          LUA_PATH=".rocks/share/lua/5.1/?.lua;.rocks/share/lua/5.1/?/init.lua;;" \
            luajit -e 'require("jit.zone") print("jit.zone loads")'

      # LuaJIT cannot load LuaRocks.org's root manifest now that the generated
      # chunk holds more than 65,536 constants. LuaRocks itself runs under stock
      # Lua; the commands below still compile every rock against LuaJIT.
      - name: Build Lua for LuaRocks (unix)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          curl -fsSL "https://www.lua.org/ftp/lua-$LUA_VERSION.tar.gz" \
            | tar xz -C "$RUNNER_TEMP"
          target=linux
          if [ "$RUNNER_OS" = "macOS" ]; then target=macosx; fi
          make -C "$RUNNER_TEMP/lua-$LUA_VERSION" \
            -j"$(getconf _NPROCESSORS_ONLN)" "$target"
          make -C "$RUNNER_TEMP/lua-$LUA_VERSION" install \
            INSTALL_TOP="$RUNNER_TEMP/lua"

      - name: Install LuaRocks (unix)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          curl -fsSL "https://luarocks.org/releases/luarocks-$LUAROCKS_VERSION.tar.gz" \
            | tar xz -C "$RUNNER_TEMP"
          cd "$RUNNER_TEMP/luarocks-$LUAROCKS_VERSION"
          ./configure --prefix="$RUNNER_TEMP/luarocks" \
            --with-lua="$RUNNER_TEMP/lua" --lua-version=5.4
          make
          make install
          echo "$RUNNER_TEMP/luarocks/bin" >> "$GITHUB_PATH"

      - name: Install LuaRocks (windows)
        if: runner.os == 'Windows'
        shell: bash
        run: |
          curl -fsSLo "$RUNNER_TEMP/luarocks.zip" \
            "https://luarocks.github.io/luarocks/releases/luarocks-$LUAROCKS_VERSION-windows-64.zip"
          unzip -q "$RUNNER_TEMP/luarocks.zip" -d "$RUNNER_TEMP"
          mv "$RUNNER_TEMP/luarocks-$LUAROCKS_VERSION-windows-64" "$RUNNER_TEMP/luarocks"
          echo "$RUNNER_TEMP/luarocks" >> "$GITHUB_PATH"

      # Into the project's own tree, which is what `bin/nupp` and `tests/run` put
      # on the interpreter's path. The documentation target installs its own rocks
      # from the manifest, so only what the compiler and suite need first is here.
      - name: Install the project's rocks (unix)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          luarocks --version
          luarocks --lua-dir "$RUNNER_TEMP/luajit" --tree "$PWD/.rocks" \
            --lua-version 5.1 install lua-cjson 2.1.0.10-1
          luarocks --lua-dir "$RUNNER_TEMP/luajit" --tree "$PWD/.rocks" \
            --lua-version 5.1 install lpeg

      # A step gets a fresh process, so the MSVC environment used to build
      # LuaJIT is not present here unless it is installed again.
      - name: Install the project's rocks (windows)
        if: runner.os == 'Windows'
        shell: cmd
        run: |
          call "%GITHUB_WORKSPACE%\.github\workflows\msvc.cmd" || exit /b 1
          luarocks --version || exit /b 1
          luarocks --lua-dir "%RUNNER_TEMP%\luajit" --tree "%GITHUB_WORKSPACE%\.rocks" --lua-version 5.1 install lua-cjson 2.1.0.10-1 || exit /b 1
          luarocks --lua-dir "%RUNNER_TEMP%\luajit" --tree "%GITHUB_WORKSPACE%\.rocks" --lua-version 5.1 install lpeg || exit /b 1

      - name: Check the project's rocks
        shell: bash
        run: |
          LUA_PATH=".rocks/share/lua/5.1/?.lua;.rocks/share/lua/5.1/?/init.lua;;" \
          LUA_CPATH=".rocks/lib/lua/5.1/?.so;.rocks/lib/lua/5.1/?.dll;;" \
            luajit -e 'require("cjson") require("lpeg") print("cjson and lpeg load")'

      # Nupp invokes LuaRocks again for configured dependencies. Keep those
      # builds aimed at the rolling LuaJIT even though the LuaRocks program on
      # Unix is hosted by stock Lua.
      - name: Record the rock target
        shell: bash
        run: |
          lua_root="$RUNNER_TEMP/luajit"
          if ( cd "$lua_root" && pwd -W ) >/dev/null 2>&1; then
            lua_root="$(cd "$lua_root" && pwd -W)"
          fi
          echo "NUPP_LUA_DIR=$lua_root" >> "$GITHUB_ENV"

      - name: Help works without the native provider
        shell: bash
        run: |
          ./bin/nupp --help
          test ! -f build/lib/nupp_native

      # Separated from `check` so a build that does not finish is attributable to
      # itself rather than read backwards from whatever the checker then said
      # about a half-emitted tree.
      - name: Build
        shell: bash
        run: ./bin/nupp build

      - name: Check
        shell: bash
        run: ./bin/nupp check

      - name: Test
        shell: bash
        run: ./bin/nupp test

      - name: Fixpoint
        shell: bash
        run: ./bin/nupp fixpoint

      - name: Native provider tests
        shell: bash
        run: ./bin/nupp task native-test
