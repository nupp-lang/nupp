name: CI

# What a checkout has to be able to do, on the platforms it claims to support:
# check itself, pass its suite, and rebuild itself byte for byte.
#
# LuaJIT is built from source on every platform rather than installed, because
# the floor is a rolling 2.1 build (2.1.1784535649) and distribution packages
# are routinely older. lua-cjson comes the same way: the compiler requires it at
# startup, and building the three C files it is made of is more predictable than
# arranging LuaRocks on three operating systems.
#
# Cargo is a build prerequisite since the compiler lists its own sources through
# a native provider. The runners ship a Rust toolchain; the job proves it is
# there rather than assuming it.

on:
  push:
    branches: ["main"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  LUAJIT_REF: v2.1

jobs:
  verify:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]

    steps:
      - uses: actions/checkout@v4

      - name: Report the toolchain
        shell: bash
        run: |
          cargo --version
          rustc --version

      - name: Build LuaJIT (unix)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          git clone --depth 1 --branch "$LUAJIT_REF" \
            https://github.com/LuaJIT/LuaJIT.git "$RUNNER_TEMP/luajit"
          # LuaJIT's makefile refuses to guess this, and says so rather than
          # building something that will not load.
          if [ "$RUNNER_OS" = "macOS" ]; then
            export MACOSX_DEPLOYMENT_TARGET="$(sw_vers -productVersion | cut -d. -f1).0"
          fi
          make -C "$RUNNER_TEMP/luajit" -j"$(getconf _NPROCESSORS_ONLN)"
          echo "$RUNNER_TEMP/luajit/src" >> "$GITHUB_PATH"

      - name: Build LuaJIT (windows)
        if: runner.os == 'Windows'
        shell: cmd
        run: |
          git clone --depth 1 --branch %LUAJIT_REF% https://github.com/LuaJIT/LuaJIT.git "%RUNNER_TEMP%\luajit"
          call "%GITHUB_WORKSPACE%\.github\workflows\msvc.cmd" || exit /b 1
          cd /d "%RUNNER_TEMP%\luajit\src"
          call msvcbuild.bat || exit /b 1
          echo %RUNNER_TEMP%\luajit\src>>%GITHUB_PATH%

      # Building in place leaves LuaJIT's own Lua modules where they were built.
      # `make install` would place them; nothing here runs it, and the first
      # thing to notice is the suite failing to load `jit.zone`. The project rock
      # tree is already on the interpreter's path, so staging them there is
      # enough and needs no install prefix.
      - name: Stage LuaJIT's support modules
        shell: bash
        run: |
          mkdir -p .rocks/share/lua/5.1
          cp -R "$RUNNER_TEMP/luajit/src/jit" .rocks/share/lua/5.1/jit
          test -f .rocks/share/lua/5.1/jit/zone.lua

      - name: Check the interpreter meets the floor
        shell: bash
        run: |
          luajit -v
          # With the rock tree on the path, the way the launchers put it there.
          # A bare interpreter looks in its install prefix, which an in-place
          # build never had.
          LUA_PATH=".rocks/share/lua/5.1/?.lua;.rocks/share/lua/5.1/?/init.lua;;" \
            luajit -e 'require("jit.zone") print("jit.zone loads")'

      - name: Build lua-cjson (unix)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          git clone --depth 1 https://github.com/openresty/lua-cjson.git \
            "$RUNNER_TEMP/lua-cjson"
          cd "$RUNNER_TEMP/lua-cjson"
          shared="-shared"
          if [ "$RUNNER_OS" = "macOS" ]; then
            shared="-bundle -undefined dynamic_lookup"
          fi
          mkdir -p "$GITHUB_WORKSPACE/.rocks/lib/lua/5.1"
          cc -O2 -fPIC $shared -I"$RUNNER_TEMP/luajit/src" \
            lua_cjson.c strbuf.c fpconv.c \
            -o "$GITHUB_WORKSPACE/.rocks/lib/lua/5.1/cjson.so"

      - name: Build lua-cjson (windows)
        if: runner.os == 'Windows'
        shell: cmd
        run: |
          git clone --depth 1 https://github.com/openresty/lua-cjson.git "%RUNNER_TEMP%\lua-cjson"
          call "%GITHUB_WORKSPACE%\.github\workflows\msvc.cmd" || exit /b 1
          cd /d "%RUNNER_TEMP%\lua-cjson"
          mkdir "%GITHUB_WORKSPACE%\.rocks\lib\lua\5.1" 2>nul
          cl /nologo /O2 /LD /Fe:cjson.dll /I "%RUNNER_TEMP%\luajit\src" ^
            lua_cjson.c strbuf.c fpconv.c ^
            /link "%RUNNER_TEMP%\luajit\src\lua51.lib" || exit /b 1
          if not exist cjson.dll (
            echo lua-cjson built no cjson.dll 1>&2
            exit /b 1
          )
          copy /Y cjson.dll "%GITHUB_WORKSPACE%\.rocks\lib\lua\5.1\cjson.dll" >nul || exit /b 1
          if not exist "%GITHUB_WORKSPACE%\.rocks\lib\lua\5.1\cjson.dll" (
            echo cjson.dll was not staged in the project rock tree 1>&2
            exit /b 1
          )

      # `bin/nupp` puts .rocks on the interpreter's path itself, so the tree
      # above is all the placement this needs.
      - name: Help works without the native provider
        shell: bash
        run: |
          ./bin/nupp --help
          test ! -f build/lib/nupp_native

      # Diagnostic only, and to be removed once the platforms agree. `check` on
      # Windows reports missing exported types for modules whose value surfaces
      # arrived, and the first thing worth comparing is what each platform
      # discovered and what it named it.
      - name: Discovery diagnostics
        shell: bash
        continue-on-error: true
        run: |
          mkdir -p diag
          LUA_PATH="$PWD/build/?.lua;$PWD/.rocks/share/lua/5.1/?.lua;$PWD/.rocks/share/lua/5.1/?/init.lua;;" \
          LUA_CPATH="$PWD/.rocks/lib/lua/5.1/?.so;$PWD/.rocks/lib/lua/5.1/?.dll;;" \
          NUPP_NATIVE_LIBRARY="$PWD/build/lib/nupp_native" \
          NUPP_COMPILER_ROOT="$PWD" \
            luajit scripts/diagnose-discovery.lua > "diag/discovery.txt" 2>&1
          head -8 "diag/discovery.txt"

      - name: Check
        shell: bash
        run: ./bin/nupp check

      - name: Keep the generated surfaces for comparison
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: surfaces-${{ matrix.os }}
          if-no-files-found: warn
          path: |
            diag/discovery.txt
            build/nupp/compiler/types.lua
            build/nupp/compiler/cli/spec.lua

      - name: Test
        shell: bash
        run: ./bin/nupp test

      - name: Fixpoint
        shell: bash
        run: ./bin/nupp fixpoint

      - name: Native provider tests
        shell: bash
        run: ./bin/nupp task native-test
