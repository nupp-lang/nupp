name: LuaJIT browser guest candidate
on:
  push:
    branches: ['**']
    paths:
      - 'runtime/luajit/**'
      - 'runtime/wasm/app-runtime.mjs'
      - 'editors/playground/test/browser-matrix.mjs'
      - 'tests/luajit-browser/**'
      - 'bench/luajit-browser/*.mjs'
      - 'scripts/browser-*.py'
      - 'scripts/browser-*.mjs'
      - 'scripts/toolchain*'
      - 'host/notices/**'
      - 'src/nupp/compiler/**'
      - 'src/nupp/tools/**'
      - 'src/nupp/runtime/vendor/lunajson/**'
      - 'scripts/prelude-image'
      - 'nupp.lua'
      - '.github/workflows/browser-guest.yml'
  workflow_dispatch:
  workflow_call:
permissions:
  contents: read
  actions: read
jobs:
  guest:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Set up Emscripten
        uses: emscripten-core/setup-emsdk@v15
        with:
          version: 6.0.8
          actions-cache-folder: emsdk-cache
      - name: Install browser engines
        run: |
          npm ci --prefix editors/playground
          npx --prefix editors/playground playwright install --with-deps firefox webkit
      - name: Test transport boundaries
        run: |
          node --test tests/luajit-browser/transport.test.mjs tests/luajit-browser/native.test.mjs tests/luajit-browser/package-assets.test.mjs
          python3 tests/luajit-browser/toolchain_test.py
          python3 tests/luajit-browser/cold_checkout_test.py
      - name: Install the guest build tools
        run: sudo apt-get update && sudo apt-get install -y gcc-multilib g++-multilib flex bison libelf-dev libssl-dev
      # LLVM is restored from its own cache below and never saved in this one.
      - uses: actions/cache@v4
        with:
          path: |
            .nupp-cache/toolchain
            !.nupp-cache/toolchain/llvm
            !.nupp-cache/toolchain/sources/llvm-project-*
          key: browser-guest-${{ runner.os }}-${{ hashFiles('scripts/toolchain', 'scripts/toolchain.pins', 'scripts/browser-*.py', 'scripts/browser-*.mjs', 'runtime/luajit/**', 'src/nupp/runtime/vendor/lunajson/**', 'host/notices/**') }}
          restore-keys: browser-guest-${{ runner.os }}-
      # The code generator the packaged applications' AOT is compiled with.
      - name: Fetch the pinned LLVM
        uses: ./.github/actions/pinned-llvm
      - name: Build the pinned guest and matching sources
        run: |
          guest=$(./scripts/toolchain browser-guest)
          mkdir -p build/browser-guest
          cp -R "$guest/." build/browser-guest/
      - name: Build the LuaJIT compiler and native response oracle
        env:
          NUPP_REQUIRE_CODEGEN: '1'
        run: |
          ./scripts/toolchain --all
          ./bin/nupp build
          ./bin/nupp build --target bootstrapCompiler
          ./scripts/prelude-image luajit
          ./bin/nupp build --target browserLuaJITApplicationRuntime --host browser
          node tests/luajit-browser/prepare-application.mjs build/browser-guest
          luajit_dir=$(./scripts/toolchain luajit)
          "$luajit_dir/bin/luajit" tests/luajit-browser/prepare-compiler.lua build/browser-luajit/nupp-compiler.lua build/browser-guest
      - name: Exercise LuaJIT in Chromium without cross-origin isolation
        env:
          NUPP_BENCH_ISOLATED: '0'
          NUPP_BENCH_CSP: "default-src 'self'; script-src 'self' 'wasm-unsafe-eval'; worker-src 'self' blob:; connect-src 'self' http://127.0.0.1:8791"
          NUPP_BENCH_CHROME_FLAGS: '["--no-sandbox", "--disable-dev-shm-usage"]'
        run: |
          cp tests/luajit-browser/features.lua tests/luajit-browser/smoke.* tests/luajit-browser/snapshot.* tests/luajit-browser/compiler.html tests/luajit-browser/compiler.mjs tests/luajit-browser/recovery.html tests/luajit-browser/recovery.mjs tests/luajit-browser/lifecycle.* build/browser-guest/
          node bench/luajit-browser/serve.mjs build/browser-guest 8113 &
          server=$!
          trap 'kill "$server"' EXIT
          node bench/luajit-browser/run-browser.mjs http://127.0.0.1:8113/smoke.html build/browser-guest/normal-boot-conformance.json
          node scripts/browser-snapshot.mjs build/browser-guest http://127.0.0.1:8113/
          node bench/luajit-browser/run-browser.mjs http://127.0.0.1:8113/smoke.html build/browser-guest/snapshot-conformance.json
          node bench/luajit-browser/run-browser.mjs http://127.0.0.1:8113/compiler.html build/browser-guest/compiler-conformance.json
          node tests/luajit-browser/prepare-recovery.mjs build/browser-guest
          node bench/luajit-browser/run-browser.mjs http://127.0.0.1:8113/recovery.html build/browser-guest/recovery-conformance.json
      - name: Package the verified LuaJIT runtime and matching sources
        run: |
          node runtime/luajit/build-runtime-package.mjs release/browser-luajit build/browser-guest
          tar -czf release/nupp-luajit-browser-runtime.tar.gz -C release/browser-luajit .
      # Wasm kernels and the guest's i686 AOT are compiled and linked by nupp
      # itself. Emscripten and the C compiler are replaced by commands that
      # fail, so reaching either for an application fails the step.
      - name: Verify consumers of the extracted release archive
        env:
          NUPP_WASM_CC: 'false'
          NUPP_AOT_CC: 'false'
          NUPP_BENCH_ISOLATED: '0'
          NUPP_BENCH_CSP: "default-src 'self'; script-src 'self' 'wasm-unsafe-eval'; worker-src 'self' blob:; connect-src 'self' http://127.0.0.1:8791"
        run: |
          consumer="$RUNNER_TEMP/luajit-runtime-consumer"
          node tests/luajit-browser/prepare-archive.mjs release/nupp-luajit-browser-runtime.tar.gz "$consumer" build/browser-guest
          node tests/luajit-browser/prepare-recovery.mjs "$consumer/site"
          node tests/luajit-browser/prepare-packaged.mjs "$consumer/site" "$consumer/guest"
          node bench/luajit-browser/serve.mjs "$consumer/site" 8113 &
          server=$!
          trap 'kill "$server"' EXIT
          node editors/playground/test/browser-matrix.mjs http://127.0.0.1:8113/ "$consumer/browser-matrix.json"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: luajit-browser-archive-conformance
          path: |
            ${{ runner.temp }}/luajit-runtime-consumer/archive-verification.json
            ${{ runner.temp }}/luajit-runtime-consumer/browser-matrix.json
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: nupp-luajit-browser-runtime
          path: release/nupp-luajit-browser-runtime.tar.gz
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: luajit-browser-guest
          path: build/browser-guest
          if-no-files-found: error
