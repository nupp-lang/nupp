name: LuaJIT browser guest candidate
on:
  push:
    branches: ['codex/luajit-everywhere']
    paths:
      - 'runtime/luajit/**'
      - 'tests/luajit-browser/**'
      - 'bench/luajit-browser/*.mjs'
      - 'scripts/browser-*.py'
      - 'scripts/browser-*.mjs'
      - 'scripts/toolchain*'
      - 'host/notices/**'
      - '.github/workflows/browser-guest.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  guest:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Test transport boundaries
        run: |
          node --test tests/luajit-browser/transport.test.mjs
          python3 tests/luajit-browser/toolchain_test.py
      - name: Install the guest build tools
        run: sudo apt-get update && sudo apt-get install -y gcc-multilib g++-multilib flex bison libelf-dev libssl-dev
      - uses: actions/cache@v4
        with:
          path: .nupp-cache/toolchain
          key: browser-guest-${{ runner.os }}-${{ hashFiles('scripts/toolchain.pins', 'scripts/browser-*.py', 'runtime/luajit/**') }}
          restore-keys: browser-guest-${{ runner.os }}-
      - name: Build the pinned guest and matching sources
        run: |
          guest=$(./scripts/toolchain browser-guest)
          mkdir -p build/browser-guest
          cp -R "$guest/." build/browser-guest/
      - name: Exercise LuaJIT in Chromium without cross-origin isolation
        env:
          NUPP_BENCH_ISOLATED: '0'
          NUPP_BENCH_CHROME_FLAGS: '["--no-sandbox", "--disable-dev-shm-usage"]'
        run: |
          cp tests/luajit-browser/features.lua tests/luajit-browser/smoke.* tests/luajit-browser/snapshot.* build/browser-guest/
          node bench/luajit-browser/serve.mjs build/browser-guest 8113 &
          server=$!
          trap 'kill "$server"' EXIT
          node bench/luajit-browser/run-browser.mjs http://127.0.0.1:8113/smoke.html build/browser-guest/normal-boot-conformance.json
          node scripts/browser-snapshot.mjs build/browser-guest http://127.0.0.1:8113/
          node bench/luajit-browser/run-browser.mjs http://127.0.0.1:8113/smoke.html build/browser-guest/snapshot-conformance.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: luajit-browser-guest
          path: build/browser-guest
          if-no-files-found: error
