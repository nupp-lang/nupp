name: Linux ARM64 execution seed

on:
  push:
    branches:
      - ci-arm64-seed

permissions:
  contents: read

jobs:
  seed:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 60
    env:
      SEED_TAG: v0.0.15-native-api-seed.6
      SOURCE_REVISION: 526727cfe2b76713a5430b5d02150f553f3fa355
      IMAGE_SHA256: ab1b144840350699ef459b9b4db218834ffcec94a0f9d1c9597f335370cfc665
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 1
      # The runtime the x64 Linux seed carries was built at this revision,
      # before allocation required a linked Nupp core.
      - name: Build the runtime as the x64 Linux seed's was
        env:
          RUNTIME_REVISION: 4e6e9d449519f799e122526cacf505fd1f016b0a
        run: |
          set -euo pipefail
          uname -a
          git fetch -q --depth=1 origin "$SOURCE_REVISION" "$RUNTIME_REVISION"
          git diff --quiet "$SOURCE_REVISION" HEAD -- . ":!.github"
          git worktree add -q "$RUNNER_TEMP/runtime-source" "$RUNTIME_REVISION"
          cd "$RUNNER_TEMP/runtime-source"
          channel=$(sed -n 's/^channel = "\([^"]*\)"$/\1/p' rust-toolchain.toml)
          rustup toolchain install "$channel" --profile minimal
          CARGO_TARGET_DIR="$GITHUB_WORKSPACE/build/seed-target" cargo +"$channel" build --locked --release -p nupp-vm
          ls -l "$GITHUB_WORKSPACE/build/seed-target/release/nupp-vm"
      - name: Pack the seed
        run: |
          set -euo pipefail
          mkdir -p build/seed
          gh release download "$SEED_TAG" --repo "$GITHUB_REPOSITORY" \
            --pattern "nupp-stage0-$SEED_TAG.image.gz" --dir build/seed
          gzip -dc "build/seed/nupp-stage0-$SEED_TAG.image.gz" > build/seed/compiler.image
          test "$(sha256sum build/seed/compiler.image | cut -d' ' -f1)" = "$IMAGE_SHA256"
          vm=build/seed-target/release/nupp-vm
          set +e
          RUST_BACKTRACE=1 "$vm" verify build/seed/compiler.image 2>&1 | head -60; echo "verify: ${PIPESTATUS[0]}"
          env RUST_BACKTRACE=1 NO_JIT=1 NO_AOT=1 SIMD_INTERPRET=1 NUPP_COMPILER_ROOT="$PWD" NUPP_VM_BINARY="$PWD/$vm" \
            NUPP_VM_CLI_IMAGE="$PWD/build/seed/compiler.image" \
            "$vm" exec build/seed/compiler.image nupp.tools.vm.root --help 2>&1 | head -40; echo "exec: ${PIPESTATUS[0]}"
          set -e
          python3 scripts/bootstrap-seed pack \
            --runtime build/seed-target/release/nupp-vm --image build/seed/compiler.image \
            --source-revision "$SOURCE_REVISION" \
            --output "build/seed-out/nupp-seed-aarch64-unknown-linux-gnu-$SOURCE_REVISION.tar.gz"
      - uses: actions/upload-artifact@v4
        with:
          name: arm64-linux-seed
          path: build/seed-out/
          if-no-files-found: error
