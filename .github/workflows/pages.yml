name: Publish website

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    name: Build website
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    concurrency:
      group: pages-build-${{ github.ref }}
      cancel-in-progress: true
    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: editors/playground/package-lock.json

      - name: Validate Pages artifact reuse
        run: node --test tests/integration/browser/luajit/pages-cache.test.mjs

      - name: Identify the artifact inputs
        id: inputs
        run: node scripts/pages-cache.mjs keys

      - name: Restore the provisioned toolchain
        uses: actions/cache@v4
        with:
          path: |
            .nupp-cache/toolchain
            !.nupp-cache/toolchain/llvm
            !.nupp-cache/toolchain/sources/llvm-project-*
            !.nupp-cache/toolchain/browser-guest
            !.nupp-cache/toolchain/browser-sources
            !.nupp-cache/toolchain/archives
          key: >-
            pages-toolchain-v1-${{ runner.os }}-${{ runner.arch }}-${{
            hashFiles('scripts/toolchain.pins', 'scripts/toolchain') }}
          restore-keys: |
            pages-toolchain-v1-${{ runner.os }}-${{ runner.arch }}-

      - name: Restore the Rust build outputs
        uses: actions/cache@v4
        with:
          path: build/rust
          key: >-
            nupp-rust-${{ runner.os }}-${{ runner.arch }}-${{
            hashFiles('Cargo.lock', 'Cargo.toml', 'rust-toolchain.toml',
            'native/**/Cargo.toml', 'scripts/toolchain', 'scripts/toolchain.pins') }}
          restore-keys: |
            nupp-rust-${{ runner.os }}-${{ runner.arch }}-

      - name: Restore the documentation rocks
        uses: actions/cache@v4
        with:
          path: |
            ${{ runner.temp }}/nupp-ci-tools
            .rocks
          key: >-
            nupp-tools-${{ runner.os }}-${{ runner.arch }}-${{
            hashFiles('scripts/toolchain.pins', 'rocks/**') }}

      - name: Restore the compiler analysis cache
        uses: actions/cache@v4
        with:
          path: build/cache
          key: >-
            nupp-buildcache-${{ runner.os }}-${{ runner.arch }}-${{
            hashFiles('src/**', 'nupp.lua', 'scripts/toolchain.pins') }}
          restore-keys: |
            nupp-buildcache-${{ runner.os }}-${{ runner.arch }}-

      - name: Restore the completed compiler
        uses: actions/cache@v4
        with:
          path: build/pages-compiler
          key: pages-compiler-v1-${{ steps.inputs.outputs.compiler }}

      - name: Verify the completed compiler
        run: node scripts/pages-cache.mjs restore compiler

      - name: Restore the completed playground
        uses: actions/cache@v4
        with:
          path: build/pages-playground
          key: pages-playground-v1-${{ steps.inputs.outputs.playground }}

      - name: Verify the completed playground
        id: playground
        run: node scripts/pages-cache.mjs restore playground

      # Install before scripts/toolchain captures cargo --version. The guest
      # target and multilib packages are needed only on a playground cache miss.
      - name: Install the pinned Rust toolchain
        shell: bash
        run: |
          channel=$(sed -n 's/^channel = "\([^"]*\)"$/\1/p' rust-toolchain.toml)
          rustup toolchain install "$channel" --profile minimal

      - name: Build pinned host dependencies
        run: ./scripts/toolchain --all

      # This also refreshes pinned rock dependencies. On a verified compiler
      # hit it does not bootstrap the compiler again for checkout timestamps.
      - name: Prepare documentation dependencies
        run: ./bin/nupp build --target docs

      - name: Record the completed compiler
        env:
          PAGES_COMPILER_KEY: ${{ steps.inputs.outputs.compiler }}
        run: node scripts/pages-cache.mjs save compiler

      - name: Restore the browser guest and snapshots
        if: steps.playground.outputs.reused != 'true'
        uses: actions/cache@v4
        with:
          path: |
            .nupp-cache/toolchain/browser-guest
            .nupp-cache/toolchain/browser-sources
            .nupp-cache/toolchain/archives
          key: pages-guest-v1-${{ runner.os }}-${{ runner.arch }}-${{ steps.inputs.outputs.guest }}
          restore-keys: |
            pages-guest-v1-${{ runner.os }}-${{ runner.arch }}-

      # Snapshot recipes also depend on the browser driver and Playwright.
      # Restore these only for an exact match; partial kernel-cache restores
      # must not carry old snapshots under an otherwise unchanged guest key.
      - name: Restore the browser snapshots
        if: steps.playground.outputs.reused != 'true'
        uses: actions/cache@v4
        with:
          path: build/browser-delivery
          key: pages-snapshots-v1-${{ steps.inputs.outputs.snapshots }}

      - name: Install the guest build tools
        if: steps.playground.outputs.reused != 'true'
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-multilib g++-multilib flex bison libelf-dev libssl-dev
          channel=$(sed -n 's/^channel = "\([^"]*\)"$/\1/p' rust-toolchain.toml)
          rustup target add --toolchain "$channel" i686-unknown-linux-musl

      - name: Build the playground
        if: steps.playground.outputs.reused != 'true'
        env:
          PAGES_PLAYGROUND_KEY: ${{ steps.inputs.outputs.playground }}
        run: |
          npm ci --prefix editors/playground
          node --test tests/integration/browser/luajit/package-assets.test.mjs
          node editors/playground/build.mjs
          node scripts/pages-cache.mjs save playground

      - name: Generate documentation and assemble the website
        env:
          NUPP_PLAYGROUND_ALREADY_BUILT: '1'
        run: node scripts/build-pages.mjs

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: build/pages

  deploy:
    name: Deploy website
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    concurrency:
      group: pages-deploy
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Check out the deployment guard
        uses: actions/checkout@v4

      - name: Confirm this is still main
        id: current
        env:
          GH_TOKEN: ${{ github.token }}
        run: .github/scripts/pages-current.sh

      - name: Deploy GitHub Pages
        id: deployment
        if: steps.current.outputs.deploy == 'true'
        uses: actions/deploy-pages@v4
