name: Publish website

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: Build website
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: editors/playground/package-lock.json

      - name: Install LuaJIT and LuaRocks
        run: |
          sudo apt-get update
          sudo apt-get install --yes liblua5.1-0-dev luarocks
          curl --fail --location --silent --show-error \
            --output luajit.tar.gz \
            https://github.com/LuaJIT/LuaJIT/archive/1edc3e52b67eaf6ce5f809be8e17d6862594b8bc.tar.gz
          echo "85497ea149d136afbe2d7ef222e08849248e52cecc6dc8deefd8588e551e4e00  luajit.tar.gz" \
            | sha256sum --check
          tar xzf luajit.tar.gz
          make -C LuaJIT-1edc3e52b67eaf6ce5f809be8e17d6862594b8bc
          sudo make -C LuaJIT-1edc3e52b67eaf6ce5f809be8e17d6862594b8bc install PREFIX=/usr/local
          sudo ldconfig
          luarocks --lua-version=5.1 --tree=.rocks install lua-cjson 2.1.0.10-1

      - name: Install playground dependencies
        run: npm ci --prefix editors/playground

      - name: Build the website
        run: node scripts/build-pages.mjs

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: build/pages

  deploy:
    name: Deploy website
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
