name: Publish website

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    name: Build website
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    concurrency:
      group: pages-build-${{ github.ref }}
      cancel-in-progress: true
    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Validate native artifact reuse
        run: node --test tests/tools/packaging/pages-cache.test.mjs

      - name: Identify the artifact inputs
        id: inputs
        run: node scripts/pages-cache.mjs keys

      - name: Restore the provisioned toolchain
        uses: actions/cache@v4
        with:
          path: |
            .nupp-cache/toolchain
            !.nupp-cache/toolchain/llvm
            !.nupp-cache/toolchain/sources/llvm-project-*
            !.nupp-cache/toolchain/archives
          key: >-
            pages-native-toolchain-v1-${{ runner.os }}-${{ runner.arch }}-${{
            hashFiles('scripts/toolchain.pins', 'scripts/bootstrap-seeds.json', 'scripts/toolchain') }}
          restore-keys: |
            pages-native-toolchain-v1-${{ runner.os }}-${{ runner.arch }}-

      - name: Restore the Rust build outputs
        uses: actions/cache@v4
        with:
          path: build/rust
          key: >-
            nupp-rust-${{ runner.os }}-${{ runner.arch }}-${{
            hashFiles('Cargo.lock', 'Cargo.toml', 'rust-toolchain.toml',
            'native/**/Cargo.toml', 'scripts/toolchain', 'scripts/toolchain.pins',
            'scripts/bootstrap-seeds.json') }}
          restore-keys: |
            nupp-rust-${{ runner.os }}-${{ runner.arch }}-

      - name: Restore the compiler analysis cache
        uses: actions/cache@v4
        with:
          path: |
            build/cache
            build/vm-cli/emit-cache
          key: >-
            pages-native-analysis-v1-${{ runner.os }}-${{ runner.arch }}-${{
            hashFiles('src/**', 'native/**', 'runtime/**', 'nupp.lua',
            'scripts/toolchain.pins', 'scripts/bootstrap-seeds.json') }}
          restore-keys: |
            pages-native-analysis-v1-${{ runner.os }}-${{ runner.arch }}-

      - name: Restore the completed native compiler
        uses: actions/cache@v4
        with:
          path: build/pages-compiler
          key: pages-native-compiler-v1-${{ steps.inputs.outputs.compiler }}

      - name: Verify the completed native compiler
        run: node scripts/pages-cache.mjs restore compiler

      - name: Install the pinned Rust toolchain
        shell: bash
        run: |
          channel=$(sed -n 's/^channel = "\([^"]*\)"$/\1/p' rust-toolchain.toml)
          rustup toolchain install "$channel" --profile minimal

      - name: Build pinned host dependencies
        run: ./scripts/toolchain --all

      - name: Build the documentation
        run: ./bin/nupp build --target docs

      - name: Record the completed native compiler
        env:
          PAGES_COMPILER_KEY: ${{ steps.inputs.outputs.compiler }}
        run: node scripts/pages-cache.mjs save compiler

      - name: Generate documentation and assemble the website
        run: node scripts/build-pages.mjs

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: build/pages

  deploy:
    name: Deploy website
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    concurrency:
      group: pages-deploy
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Check out the deployment guard
        uses: actions/checkout@v4

      - name: Confirm this is still main
        id: current
        env:
          GH_TOKEN: ${{ github.token }}
        run: .github/scripts/pages-current.sh

      - name: Deploy GitHub Pages
        id: deployment
        if: steps.current.outputs.deploy == 'true'
        uses: actions/deploy-pages@v4
