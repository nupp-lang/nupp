name: Cross-platform links

# A standalone AOT program linked on one platform from another's link kit, and
# run where it was linked for. The compiler matrix runs every AOT suite through
# the code generator on each platform; this is what it cannot see, since each of
# its jobs links only for itself. The pinned LLVM comes from
# .github/actions/pinned-llvm, which builds it once per pin and platform and
# keeps it.
#
# It runs when something a kit or a cross link depends on changes, or when a
# commit message says `[llvm ci]`.
on:
  push:
    paths:
      - '.github/actions/pinned-llvm/**'
      - '.github/workflows/cross-link.yml'
      - 'native/crates/codegen/**'
      - 'native/crates/native/c/**'
      - 'scripts/toolchain'
      - 'scripts/toolchain.pins'
      - 'src/nupp/compiler/aot/llvm/coff.nupp'
      - 'src/nupp/compiler/aot/llvm/profile.nupp'
      - 'src/nupp/tools/build/aotllvm.nupp'
      - 'src/nupp/tools/build/kits.nupp'
      - 'src/nupp/tools/build/native.nupp'
      - 'tests/fixtures/cross-aot/**'
  workflow_dispatch:

# Reading and storing the pinned LLVM artifact.
permissions:
  contents: read
  actions: read

# Queued rather than cancelled: a cancelled cold run never saves the LLVM it
# spent an hour building. GitHub keeps only the newest pending run.
concurrency:
  group: cross-link-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # Each platform's link kit, built where that platform's libraries are. The
  # link jobs link programs for the other platform with it. A kit needs no LLVM.
  kits:
    name: ${{ matrix.name }} link kit
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS arm64
            os: macos-15
            platform: aarch64-apple-darwin
          - name: Linux x64
            os: ubuntu-24.04
            platform: x86_64-unknown-linux-gnu
    steps:
      - name: Check out the repository
        uses: actions/checkout@v5

      - name: Restore the provisioned toolchain
        uses: actions/cache/restore@v4
        with:
          path: .nupp-cache/toolchain
          key: >-
            nupp-toolchain-${{ runner.os }}-${{ runner.arch }}-${{
            hashFiles('scripts/toolchain.pins', 'scripts/toolchain') }}
          restore-keys: |
            nupp-toolchain-${{ runner.os }}-${{ runner.arch }}-

      - name: Build the link kit archive
        shell: bash
        run: ./scripts/toolchain kit-archive "" "$RUNNER_TEMP/kit-${{ matrix.platform }}.tar.gz"

      - name: Upload the link kit
        uses: actions/upload-artifact@v4
        with:
          name: kit-${{ matrix.platform }}
          path: ${{ runner.temp }}/kit-${{ matrix.platform }}.tar.gz
          if-no-files-found: error

  link:
    name: Link on ${{ matrix.name }} for ${{ matrix.cross }}
    needs: kits
    runs-on: ${{ matrix.os }}
    # A cold runner builds LLVM first.
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS arm64
            os: macos-15
            cross: x86_64-unknown-linux-gnu
          - name: Linux x64
            os: ubuntu-24.04
            cross: aarch64-apple-darwin
    steps:
      - name: Check out the repository
        uses: actions/checkout@v5

      - name: Restore the pinned build tools
        uses: actions/cache/restore@v4
        with:
          path: |
            ${{ runner.temp }}/nupp-ci-tools
            .rocks
          key: >-
            nupp-tools-${{ runner.os }}-${{ runner.arch }}-${{
            hashFiles('scripts/toolchain.pins') }}

      - name: Restore the provisioned toolchain
        uses: actions/cache/restore@v4
        with:
          path: .nupp-cache/toolchain
          key: >-
            nupp-toolchain-${{ runner.os }}-${{ runner.arch }}-${{
            hashFiles('scripts/toolchain.pins', 'scripts/toolchain') }}
          restore-keys: |
            nupp-toolchain-${{ runner.os }}-${{ runner.arch }}-

      # After the toolchain, so this LLVM wins over whatever an older
      # toolchain cache entry carried.
      - name: Fetch or build the pinned LLVM
        uses: ./.github/actions/pinned-llvm

      - name: Provision the pinned toolchain
        shell: bash
        run: ./scripts/toolchain --all

      - name: Bootstrap the compiler
        shell: bash
        env:
          NUPP_REQUIRE_CODEGEN: '1'
        run: ./bin/nupp build

      - name: Download the other platform's link kit
        uses: actions/download-artifact@v4
        with:
          name: kit-${{ matrix.cross }}
          path: ${{ runner.temp }}/kit-archive

      - name: Link a standalone AOT program for ${{ matrix.cross }}
        shell: bash
        run: |
          kit="$RUNNER_TEMP/kit"
          mkdir -p "$kit"
          tar -xzf "$RUNNER_TEMP/kit-archive/kit-${{ matrix.cross }}.tar.gz" -C "$kit"
          cd tests/fixtures/cross-aot
          NUPP_KIT_DIR="$kit" ../../../bin/nupp build --platform "${{ matrix.cross }}"
          mkdir -p "$RUNNER_TEMP/cross"
          cp "build/default/${{ matrix.cross }}/default" "$RUNNER_TEMP/cross/program"

      - name: Upload the program for ${{ matrix.cross }}
        uses: actions/upload-artifact@v4
        with:
          name: cross-program-${{ matrix.cross }}
          path: ${{ runner.temp }}/cross/program
          if-no-files-found: error

  # Each program runs where it was linked for, not where it was linked.
  cross-run:
    name: Run the ${{ matrix.name }} program linked elsewhere
    needs: link
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS arm64
            os: macos-15
            platform: aarch64-apple-darwin
          - name: Linux x64
            os: ubuntu-24.04
            platform: x86_64-unknown-linux-gnu
    steps:
      - name: Download the program
        uses: actions/download-artifact@v4
        with:
          name: cross-program-${{ matrix.platform }}
          path: cross

      # Output for an explicit platform is unsigned; a release signs it.
      - name: Run it
        shell: bash
        run: |
          chmod +x cross/program
          if [ "$RUNNER_OS" = macOS ]; then codesign --force --sign - cross/program; fi
          answer=$(cross/program)
          printf '%s\n' "$answer"
          [ "$answer" = "$(printf '15\t4')" ]
