name: Provide the test runner
description: >-
  The manifest's test runner for exactly these sources: every module compiled
  into one image and stamped onto a program runtime. Building it checks and
  lowers the whole of src, which is twenty-five minutes and twelve gigabytes
  on a runner, and every job that ran a suite used to do it for itself. The
  platform's runner job runs this with `save` set and is the one job that
  builds it; a leg restores what that job saved and finds it current. A leg
  that finds nothing saved builds the runner itself, so a lost cache costs
  time and not an answer.
inputs:
  save:
    description: Save the runner this run built.
    default: "false"
runs:
  using: composite
  steps:
    # What the runner is built from: the compiler's own inputs, and the harness
    # sources it carries as resources.
    - id: keys
      shell: bash
      env:
        RUNNER: >-
          nupp-testrunner-${{ runner.os }}-${{ runner.arch }}-${{
          hashFiles('src/**', 'native/crates/**/*.rs', 'native/crates/**/Cargo.toml', 'Cargo.lock',
          'nupp.lua', 'scripts/vm-cli', 'scripts/toolchain', 'scripts/toolchain.pins',
          'tests/run.lua', 'tests/cache.lua', 'tests/tools/test/runner/**') }}
      run: echo "runner=$RUNNER" >> "$GITHUB_OUTPUT"

    # Beside the runner itself: what it recorded about each module, so a
    # restored older one rechecks only what changed, and the linked runtimes
    # and native core object its build is content-addressed by, so a leg's
    # freshness check finds them rather than linking them again.
    - id: runner
      uses: actions/cache/restore@v4
      with:
        path: |
          build/test-runner
          build/nupp-test
          build/nupp-test.exe
          build/rust
          build/native-runtime
          ~/.cache/nupp/build-steps
        key: ${{ steps.keys.outputs.runner }}
        restore-keys: |
          nupp-testrunner-${{ runner.os }}-${{ runner.arch }}-

    # The test runner refuses to start on Windows unless it is told which Git Bash
    # and sh its shell suites use, and asking it for its groups starts it. Set
    # here, before the first `nupp test`, rather than by the leg, which runs this
    # action before its own steps.
    - if: runner.os == 'Windows'
      shell: bash
      run: |
        bash_path=$(command -v bash)
        sh_path=$(dirname "$bash_path")/sh.exe
        test -f "$sh_path"
        {
          echo "NUPP_TEST_BASH=$(cygpath -w "$bash_path")"
          echo "NUPP_TEST_SH=$(cygpath -w "$sh_path")"
        } >> "$GITHUB_ENV"

    # What the recorded test build is keyed on from the environment, as names
    # and a short digest of each value, never the value: when a job that
    # restored the runner rebuilds it anyway, comparing this with the runner
    # job's names the variable responsible. The prefixes are the ones the key
    # leaves out (`nupp.tools.build.testbuild`).
    - shell: bash
      run: |
        hasher="sha256sum"
        command -v sha256sum > /dev/null 2>&1 || hasher="shasum -a 256"
        env -0 | while IFS= read -r -d '' item; do
          name=${item%%=*}
          case "$name" in
            GITHUB_*|ACTIONS_*|CODEX_TOOL_CALL_ID|INVOCATION_ID|JOURNAL_STREAM|SYSTEMD_EXEC_PID) continue ;;
            RUNNER_*) case "$name" in RUNNER_OS|RUNNER_ARCH) ;; *) continue ;; esac ;;
          esac
          printf '%s %s\n' "$name" "$(printf '%s' "${item#*=}" | $hasher | cut -c1-8)"
        done | LC_ALL=C sort

    # Builds the runner when it is not current, and answers in seconds when it
    # is; the summary line says which, and the log is printed in full when the
    # build fails.
    - shell: bash
      env:
        NUPP_PROGRESS: always
      run: |
        log="$RUNNER_TEMP/test-runner-build.log"
        status=0
        ./bin/nupp test --list-groups > "$log" 2>&1 || status=$?
        if [ "$status" -ne 0 ]; then
          cat "$log"
          exit "$status"
        fi
        grep -E '(reused|built) testRunner|^  [a-z:-]+ [0-9.]+m?s' "$log" || true

    # Cargo's own target directories are most of `build/rust` and none of what
    # a leg reads: the results are copied out to their content keys, and what
    # Cargo needs again it has from sccache. Programs other than the runner
    # are whatever an older restored cache still held.
    - if: inputs.save == 'true' && steps.runner.outputs.cache-hit != 'true'
      shell: bash
      run: |
        rm -rf build/rust/target build/rust/*-target build/rust/*/target build/rust/*/target-*
        rm -rf build/rust/vm-program/programs/*.work.*
        cd build/rust/vm-program/programs 2>/dev/null || exit 0
        newest=$(ls -t | head -n 1)
        for entry in *; do
          [ "$entry" = "$newest" ] || rm -rf "$entry"
        done

    - if: inputs.save == 'true' && steps.runner.outputs.cache-hit != 'true'
      uses: actions/cache/save@v4
      continue-on-error: true
      with:
        path: |
          build/test-runner
          build/nupp-test
          build/nupp-test.exe
          build/rust
          build/native-runtime
          ~/.cache/nupp/build-steps
        key: ${{ steps.keys.outputs.runner }}
