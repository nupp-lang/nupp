name: Prepare the compiler
description: >-
  Everything a job needs before it can run a Nupp command: the provisioned
  toolchain, a shared Rust compiler cache, and the VM compiler for exactly
  these sources. The platform's build job runs this with `save` set, so it is
  the one job that rebuilds a changed compiler; every job after it restores
  what that one saved and starts in seconds. A job that finds nothing saved
  builds the compiler itself, so a lost cache costs time and not an answer.
inputs:
  save:
    description: Save the toolchain and the VM compiler this run built.
    default: "false"
runs:
  using: composite
  steps:
    - uses: ./.github/actions/c-assembler
    # One spelling of each key, read by the restores and the saves below.
    - id: keys
      shell: bash
      env:
        TOOLCHAIN: >-
          nupp-toolchain-${{ runner.os }}-${{ runner.arch }}-${{
          hashFiles('scripts/toolchain.pins', 'scripts/toolchain') }}
        # Exactly what `scripts/vm-cli current` fingerprints, which is what
        # decides whether `bin/nupp` rebuilds. A narrower key was a hit for a
        # generation the launcher then found stale: the build job rebuilt it,
        # the hit kept it from being saved, and every leg rebuilt it again.
        VMCLI: >-
          nupp-vmcli-${{ runner.os }}-${{ runner.arch }}-${{
          hashFiles('src/**', 'templates/**', 'native/**', 'runtime/**', 'scripts/**', 'bin/**',
          'nupp.lua', 'tests/run.lua', 'Cargo.toml', 'Cargo.lock', 'rust-toolchain.toml', '.cargo/**') }}
      run: |
        echo "toolchain=$TOOLCHAIN" >> "$GITHUB_OUTPUT"
        echo "vmcli=$VMCLI" >> "$GITHUB_OUTPUT"
        echo "corecli=${VMCLI/nupp-vmcli-/nupp-corecli-}" >> "$GITHUB_OUTPUT"
        echo "runtime=$(sh scripts/stage0-runtime)" >> "$GITHUB_OUTPUT"

    - id: toolchain
      uses: actions/cache/restore@v4
      with:
        path: .nupp-cache/toolchain
        key: ${{ steps.keys.outputs.toolchain }}
        restore-keys: |
          nupp-toolchain-${{ runner.os }}-${{ runner.arch }}-

    # An exact match is current and nothing rebuilds. An older one lowers these
    # sources with the compiler it holds, which is minutes; none at all starts
    # from the pinned stage zero, which is half an hour.
    - id: vmcli
      if: steps.keys.outputs.runtime == 'vm'
      uses: actions/cache/restore@v4
      with:
        path: .nupp/vm-cli
        key: ${{ steps.keys.outputs.vmcli }}
        restore-keys: |
          nupp-vmcli-${{ runner.os }}-${{ runner.arch }}-

    # A host the pins flip to the native core (`scripts/stage0-runtime`) runs
    # the core compiler `scripts/core-cli` installs, under the same sources key,
    # and builds no VM compiler at all.
    - id: corecli
      if: steps.keys.outputs.runtime == 'core'
      uses: actions/cache/restore@v4
      with:
        path: .nupp/core-cli
        key: ${{ steps.keys.outputs.corecli }}
        restore-keys: |
          nupp-corecli-${{ runner.os }}-${{ runner.arch }}-

    # Every Cargo build the compiler starts goes through sccache once it is on
    # the path (`bin/nupp`, `scripts/toolchain`, `scripts/vm-cli`), and this
    # points it at the repository's Actions cache. A crate is then compiled
    # once per source state for the whole repository, whichever job, target
    # directory or feature set asks first. A cached `build/rust` could not do
    # that: one key was shared by jobs that build different crates, so the
    # first to save decided what every later one restored, and a fresh
    # checkout's file times made Cargo rebuild the workspace crates anyway.
    - uses: mozilla-actions/sccache-action@fc920bf0ec8de6ee65d409111f7ec508035751ba # v0.0.11
      with:
        version: v0.19.0
    # A cache that cannot be reached compiles instead of failing the build.
    # IGNORE_SERVER_IO_ERROR covers requests, not the server's startup, and
    # the Actions cache has refused startup ("Egress is over the account
    # limit"). So the server starts here, once: later compiles reuse it, and
    # if it cannot start, the job compiles without sccache rather than every
    # compile failing. scripts/sccache-wrapper covers the same failure later
    # in a job, but Cargo cannot run that script on Windows.
    - shell: bash
      run: |
        echo "SCCACHE_GHA_ENABLED=true" >> "$GITHUB_ENV"
        echo "SCCACHE_IGNORE_SERVER_IO_ERROR=1" >> "$GITHUB_ENV"
        export SCCACHE_GHA_ENABLED=true SCCACHE_IGNORE_SERVER_IO_ERROR=1
        if ! sccache --start-server; then
          echo "::warning::sccache could not start; this job compiles without it"
          echo "RUSTC_WRAPPER=" >> "$GITHUB_ENV"
        fi

    # The pinned nightly. A hosted runner carries only stable, and
    # `scripts/toolchain` installs the pinned channel the first time a build
    # needs Rust -- quietly, inside whatever step asked, which on a leg was the
    # test runner's restore: two minutes of every leg spent downloading the
    # same toolchain. Restored here instead, and installed in plain view when
    # the restore misses.
    - id: rust
      shell: bash
      run: |
        channel=$(sed -n 's/^channel = "\([^"]*\)"$/\1/p' rust-toolchain.toml)
        toolchain=$channel
        [ "$RUNNER_OS" != Windows ] || toolchain="${channel}-x86_64-pc-windows-gnu"
        echo "toolchain=$toolchain" >> "$GITHUB_OUTPUT"

    - id: rust-cache
      uses: actions/cache/restore@v4
      with:
        # The toolchain, and the manifest hash rustup compares before deciding
        # an installed toolchain is current; without it, it downloads again.
        path: |
          ~/.rustup/toolchains/${{ steps.rust.outputs.toolchain }}*
          ~/.rustup/update-hashes/${{ steps.rust.outputs.toolchain }}*
        key: nupp-rust-toolchain-${{ runner.os }}-${{ runner.arch }}-${{ steps.rust.outputs.toolchain }}

    - shell: bash
      env:
        TOOLCHAIN: ${{ steps.rust.outputs.toolchain }}
      run: rustup toolchain install "$TOOLCHAIN" --profile minimal

    - if: inputs.save == 'true' && steps.rust-cache.outputs.cache-hit != 'true'
      uses: actions/cache/save@v4
      continue-on-error: true
      with:
        # The toolchain, and the manifest hash rustup compares before deciding
        # an installed toolchain is current; without it, it downloads again.
        path: |
          ~/.rustup/toolchains/${{ steps.rust.outputs.toolchain }}*
          ~/.rustup/update-hashes/${{ steps.rust.outputs.toolchain }}*
        key: nupp-rust-toolchain-${{ runner.os }}-${{ runner.arch }}-${{ steps.rust.outputs.toolchain }}

    - shell: bash
      run: ./scripts/toolchain --all

    - shell: bash
      run: ./bin/nupp version

    # Only the generation this run selected is kept: each holds a runtime, and
    # older ones are dead weight in the cache.
    - if: inputs.save == 'true' && steps.keys.outputs.runtime == 'vm' && steps.vmcli.outputs.cache-hit != 'true'
      shell: bash
      run: |
        cd .nupp/vm-cli
        keep=" $(cat current 2>/dev/null || true) "
        for entry in */; do
          entry=${entry%/}
          case "$keep" in *" $entry "*) ;; *) rm -rf "$entry" ;; esac
        done

    - if: inputs.save == 'true' && steps.keys.outputs.runtime == 'vm' && steps.vmcli.outputs.cache-hit != 'true'
      uses: actions/cache/save@v4
      continue-on-error: true
      with:
        path: .nupp/vm-cli
        key: ${{ steps.keys.outputs.vmcli }}

    - if: inputs.save == 'true' && steps.keys.outputs.runtime == 'core' && steps.corecli.outputs.cache-hit != 'true'
      uses: actions/cache/save@v4
      continue-on-error: true
      with:
        path: .nupp/core-cli
        key: ${{ steps.keys.outputs.corecli }}

    - if: inputs.save == 'true' && steps.toolchain.outputs.cache-hit != 'true'
      uses: actions/cache/save@v4
      continue-on-error: true
      with:
        path: .nupp-cache/toolchain
        key: ${{ steps.keys.outputs.toolchain }}
