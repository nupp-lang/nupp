name: Provide the x86 CRC assembler
description: ISA-L's upstream x86 implementations require NASM
runs:
  using: composite
  steps:
    - name: Install NASM when absent
      shell: bash
      run: |
        if [ "$(uname -m)" != x86_64 ]; then exit 0; fi
        if command -v nasm >/dev/null; then exit 0; fi
        case "$RUNNER_OS" in
          Linux) sudo apt-get update && sudo apt-get install -y nasm ;;
          macOS) brew install nasm ;;
          Windows)
            nasm_dir='C:\Program Files\NASM'
            export PATH="$(cygpath -u "$nasm_dir"):$PATH"
            for attempt in 1 2 3; do
              if nasm -v 2>/dev/null || { choco install nasm --no-progress -y && nasm -v; }; then
                printf '%s\n' "$nasm_dir" >> "$GITHUB_PATH"
                exit 0
              fi
              if [ "$attempt" -lt 3 ]; then sleep 5; fi
            done
            echo 'NASM is unavailable after three install attempts' >&2
            exit 1
            ;;
        esac
