[workspace]
members = ["native/crates/*"]
# The core's bridge is frozen and builds alone, with its own lockfile and
# release profile.
exclude = ["native/crates/core-bridge"]
resolver = "3"

[workspace.package]
edition = "2024"
publish = false
rust-version = "1.98"

# No Rust panic may unwind through a C ABI, and none may end the process
# either: every native export catches a panic at its boundary and answers a
# status. That catch is only live when panics unwind. An unwind that escaped an
# `extern "C"` function would abort rather than cross it, so unwinding never
# reaches a C caller's frames. Individual crates still own their optimization
# policy.
[profile.release]
panic = "unwind"
strip = false

