[workspace]
members = ["native/crates/*"]
resolver = "3"

[workspace.package]
edition = "2024"
publish = false
rust-version = "1.98"

# No Rust panic may unwind through LuaJIT's C ABI, and none may end the process
# either: every native export catches a panic at its boundary and answers a
# status. That catch is only live when panics unwind. An unwind that escaped an
# `extern "C"` function would abort rather than cross it, so unwinding never
# reaches LuaJIT's frames. Individual crates still own their optimization policy.
[profile.release]
panic = "unwind"
strip = false

# The Windows static application host is linked as an ordinary archive. Keep
# each crate that owns name-resolved LuaJIT FFI exports in one codegen unit so
# selecting its linked entry point retains the complete exported Rust surface
# without force-loading Rust std and every flattened Windows import object.
[profile.release.package.nupp-native]
codegen-units = 1

[profile.release.package.nupp-native-host]
codegen-units = 1
