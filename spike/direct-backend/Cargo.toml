[package]
name = "nupp-direct-backend-spike"
version = "0.0.0"
edition = "2024"
publish = false

# Standalone: not a member of the repository workspace.
[workspace]

[dependencies]
regalloc2 = "=0.15.2"
serde_json = "1"
libc = "0.2"
iced-x86 = { version = "1.21", default-features = false, features = ["std", "code_asm", "decoder", "encoder", "block_encoder", "intel"] }
object = { version = "=0.39.1", default-features = false, features = ["write", "std"] }
ar_archive_writer = "0.5"
yaxpeax-arm = "0.3"
yaxpeax-arch = "0.3"
wasm-encoder = "=0.259.0"
wasmparser = "=0.259.0"
gimli = { version = "=0.33.0", default-features = false, features = ["write"] }

[profile.release]
debug = false

[lints.rust]
unexpected_cfgs = { level = "allow" }
