[package]
name = "nupp-llvm"
version = "0.0.0"
edition = "2024"
publish = false

# Standalone: not a member of the repository workspace.
[workspace]

# The lld drivers linked in process. `native` is what the cached-library
# shape needs on every host; `wasm` is the driver the Wasm target would add.
[features]
default = ["native"]
native = ["macho", "elf", "coff"]
macho = []
elf = []
# COFF plus its MinGW front end, and import libraries for the DLL's imports.
coff = []
wasm = []

[dependencies]
serde_json = "1"
object = { version = "=0.39.1", default-features = false, features = ["read_core", "macho", "elf", "coff", "archive", "std"] }
llvm-sys = { version = "=231.0.0", features = ["no-llvm-linking"] }

[build-dependencies]
cc = "1"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
strip = true

[lints.rust]
unexpected_cfgs = { level = "allow" }
