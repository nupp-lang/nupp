[package]
name = "nupp-artifact-host"
version = "0.0.0"
edition = "2024"
publish = false

# Standalone: not a member of the repository workspace. No LLVM anywhere in
# this crate's graph: it stands in for the Nupp host that consumes the cache.
[workspace]

[dependencies]
serde_json = "1"
sha2 = "0.10"
# Test-only readers: the final library's sections and its instructions, for
# the fused multiply-add scan. Neither is LLVM.
object = { version = "=0.39.1", default-features = false, features = ["read_core", "macho", "elf", "coff", "pe", "std"] }
yaxpeax-arm = "0.3"
yaxpeax-arch = "0.3"
iced-x86 = { version = "1.21", default-features = false, features = ["std", "decoder", "intel"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
strip = true

[lints.rust]
unexpected_cfgs = { level = "allow" }
