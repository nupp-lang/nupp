[package]
name = "nupp-host"
version = "0.1.0"
edition = "2021"
description = "Runs a Nupp payload appended to this executable, or a Lua file named on the command line."
license = "MIT"

# The stub is one file people run. Debug info and unwinding tables are weight
# in every binary anybody ever stamps out of it.
[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
panic = "abort"
strip = true

[[bin]]
name = "nupp-host"
path = "src/main.rs"

[dependencies]
sha2 = { version = "0.10", default-features = false }

[build-dependencies]
# LuaJIT and lua-cjson are both fetched by revision and checked against a
# digest in build.rs. LuaJIT was a crate once; the crate's pin trails upstream,
# and the interpreter this stub carries has to be new enough to parse what the
# compiler emits, so the pin belongs where that requirement is written down.
cc = "1"
sha2 = { version = "0.10", default-features = false }
